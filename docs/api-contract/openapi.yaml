        관리자 액션으로만 트리거 — 자동 재임베딩 없음). 원본 PDF를 저장소에서 다시 읽어 텍스트를
        재추출하고, AI 서버가 동일 문서의 기존 청크를 삭제 후 재삽입하는 idempotent 설계라 여러 번
