openapi: 3.0.3
info:
  title: hajaCheck API
  version: "0.46.0-draft"
  description: >
    Contract-First 초안 (PRD §6, §8). 실제 소스 오브 트루스는 이 파일.


    ## 실시간(WS) 상담 — /ws STOMP (FR-7, #20/HAJA-33, #1002/HAJA-496)

    OpenAPI 3.0 은 WebSocket/STOMP 를 네이티브로 표현하지 못하므로, 이 계약은 `paths` 항목이 아니라
    이 서술로 대체한다(`backend/.../counsel/websocket/WebSocketConfig.java` 실구현 기준).

    - **엔드포인트**: `/ws` (SockJS 미사용 — dev(Vite)/prod(nginx) 동일 오리진 프록시 전제, 기본 same-origin
      정책 유지).
    - **인증**: SESSION 쿠키 기반, 2단계로 강제한다 — ① 핸드셰이크(`CounselHandshakeInterceptor`)에서
      SESSION 쿠키 검증, ② 인바운드 채널(`StompAuthChannelInterceptor`)에서 CONNECT 재검증 + SUBSCRIBE
      시점 당사자(참여자) 검증. 클라이언트 페이로드의 senderId 는 신뢰하지 않고 핸드셰이크에서 확립한
      `StompUserPrincipal` 로만 발신자를 식별한다.
    - **destinations**:
      - `SEND /app/counsel/{ticketId}/send` — 상담 메시지 전송(`ChatMessageSendRequest`: content
        ≤2000자/attachmentKey ≤500자, 텍스트·첨부 중 최소 하나). 티켓이 IN_PROGRESS 가 아니거나 발신자가
        참여자(사용자 본인/담당 상담원)가 아니면 예외 대신 조용히 드롭한다(WS 프레임 처리 중 예외로 세션이
        끊기는 것을 피하기 위한 방어적 설계).
      - `SUBSCRIBE /topic/counsel/{ticketId}` — 해당 상담방 브로드캐스트 구독. 서버가 저장된 메시지를
        `ChatMessageResponse` 로 이 destination 에 `convertAndSend` 한다.
      - `SUBSCRIBE /user/queue/counsel/assigned` — 개인 알림(user destination prefix `/user`). 내 티켓이
        상담원에게 배정되면(`POST /api/counsel/tickets/{id}/assign` 성공 시) `CounselTicketResponse` 를
        수신한다.
      - `SUBSCRIBE /user/queue/counsel/ended` — 개인 알림. 내 티켓이 종료되면(`POST /api/counsel/tickets/
        {id}/resolve` 성공 시) `CounselTicketResponse` 를 수신한다.
    - **브로커**: 인메모리 심플 브로커(`/topic`, `/queue`), 애플리케이션 목적지 prefix `/app`, 사용자 목적지
      prefix `/user`.


    2026-08-04 로그인 API를 화면별로 분리해 서버가 role을 강제(#1514) — 기업(`POST /api/auth/login`,
    경로 유지)에 더해 `POST /api/auth/platform-admin/login`·`POST /api/auth/counselor/login` 2개를
    신설했다. 각 엔드포인트는 허용 role 화이트리스트(기업=ADMIN/INSPECTOR/USER · 플랫폼=PLATFORM_ADMIN ·
    상담원=COUNSELOR)를 강제하며, 불일치는 **403 `AUTH_ROLE_NOT_ALLOWED`(신규 ErrorCode)** 로 거절하고
    **세션을 발급하지 않는다**(role 게이트가 세션 고정 방어보다 앞에 있어 세션 생성·ID 회전 자체가
    일어나지 않는다 — 403 응답의 세션으로 `GET /api/users/me` 를 호출해도 401). 이전에는 세 화면이 같은
    엔드포인트를 쓰고 role 판정이 프론트의 사후 `logout` 이라 curl 로 직접 치면 세션이 그대로 남았다.
    ⚠️ 자격증명 실패는 **기존 401 `AUTH_INVALID_CREDENTIALS` 그대로**다(role 게이트보다 먼저 걸린다) —
    403은 "올바른 비밀번호를 이미 아는" 요청만 도달하므로 계정 열거 단서로서의 실익이 없고, 잘못된 탭에
    입력한 사용자에게 "비밀번호가 틀렸습니다"로 오안내하지 않기 위한 의도된 트레이드오프다.
    ⚠️ **이 게이트는 비밀번호 로그인 경로에만 적용된다.** 소셜 로그인(`/api/auth/oauth2/{provider}`)은
    이 컨트롤러를 타지 않아 포털 role 게이트가 걸리지 않으며, **그 예외는 실재한다**: 플랫폼 관리자
    콘솔의 역할 변경(`PATCH /api/platform-admin/users/{id}/role`)은 대상 계정의 가입 방식을 검사하지
    않고 COUNSELOR를 배정할 수 있으므로(#1008), **소셜 가입 계정이 COUNSELOR로 승격되는 것이 정상 지원
    흐름**이고 그 계정은 소셜 식별자를 그대로 보유한 채 기업 화면의 소셜 버튼으로 로그인할 수 있다.


    2026-08-11 데모 원클릭 로그인(#1626) — `POST /api/auth/demo-login` 신설(바디 없음, 서버 보관
    크레덴셜로 기업 로그인과 동일 세션 발급, 비활성 시 404 `AUTH_DEMO_DISABLED`(신규), 전역 rate-limit
    429). `UserResponse` 에 `isDemo`(boolean, 서버 계산) 추가. 데모 계정 대상 role/status/비밀번호
    변경은 409 `DEMO_ACCOUNT_PROTECTED`(신규)로 통일 차단(관리자 콘솔 role/status 변경 ·
    PATCH /api/users/me/password), 비로그인 이메일 재설정은 응답 통일 계약 유지를 위해 조용히 제외.
    승격된 소셜 계정은 password_hash가 null이라 비밀번호 로그인이 이미 차단되어 있어(소셜까지 막으면
    로그인 수단이 0개가 된다) 이번 PR에서는 막지 않는다 — **소셜 경로의 포털 분리는 후속 이슈 #1519**.

    2026-08-13 데모 계정 결제·플랜변경 차단(#1626 P1-1) — 읽기 위주 데모라 결제 자체가 불필요하고,
    열어 두면 데모 세션이 샌드박스 결제로 유료 플랜을 영구 획득한다(리셋도 되돌리지 못하던 표면).
    `POST /api/me/plan/orders`·`POST /api/me/payments/confirm`·`PATCH /api/admin/plan`(즉시/예약 변경)이
    데모 계정 요청이면 409 `DEMO_ACCOUNT_PROTECTED` 로 거절한다. 또한 데모 스위치 off 시 데모 계정의
    일반 로그인(`POST /api/auth/login`)도 401 로 차단해 킬스위치를 완전화했다(P2-2a).


    2026-08-05 계약 전수 최신화(코드 실측 대조) — 컨트롤러/라우터 전수 추출과 명세를 diff 해 누락돼
    있던 63개 엔드포인트(Spring 59 + FastAPI 4: detect-defects·rag-documents embed/상태/삭제)를 일괄
    등재했다(admin·platform-admin·counsel/채팅세션·facilities/inspections/defects 보강·statistics/
    dashboard/menus/plans/마이페이지·auth 진위확인/AI 프록시). 함께 정리한 것: ① `/api/inspections/
    {id}/analyze` POST TODO 스텁을 실구현(202 비동기, ANALYSIS_* ErrorCode) 기준으로 갱신, ②
    `/api/inspections/{id}/media` **path 키 중복 선언 버그 수정** — POST 블록과 GET 블록이 같은 키로
    두 번 선언돼 있어 YAML 파서(Swagger 포함)가 뒤의 GET만 남기고 POST 명세를 조용히 버리던 것을 한
    path item으로 병합했다. admin(전사)과 platform-admin의 사용자 role/status 변경 계약은 허용값이
    다르므로(예: role 화이트리스트 ADMIN/INSPECTOR/USER vs +COUNSELOR) 스키마를 `AdminUser*` /
    `PlatformAdminUser*` 로 분리했다.


    2026-07-30 플랫폼 관리자 날짜별 상담 목록 계약화(#1168, PR #1205 dev 머지 반영) — GET
    /api/counsel/tickets/admin 신설. 접수일(`createdAt`) 기준 특정 날짜의 상담 티켓 전체를 최신순으로
    반환하며 **PLATFORM_ADMIN 전용**이다. `date`(YYYY-MM-DD)는 필수이고 누락·형식 오류를 모두
    INVALID_INPUT(400)으로 표면화한다(파싱 실패가 500으로 새지 않게). 비-PLATFORM_ADMIN 은
    COUNSEL_TICKET_FORBIDDEN(403).


    함께 `CounselTicketSummaryResponse` 에 고객 프로필 4필드(`customerName`/`customerEmail`/
    `customerPlan`/`customerJoinedAt`)를 **전부 nullable additive** 로 추가했다. 이 필드들은 위 관리자
    날짜별 목록에서만 채워지고 **기존 경로(대기열·내 이력·고객 이력)에서는 항상 null** 이다 — 같은
    스키마를 공유하되 PII 노출 표면은 관리자 경로 하나로 제한한다는 뜻이므로, 소비자는 이 필드의
    존재를 근거로 다른 경로에서도 값이 온다고 가정하면 안 된다. ⚠️ `customerPlan` 은 현재 개인 구독만
    해석해 **회사 소속 고객이면 항상 null** 이다(후속 #1263에서 회사 구독까지 해석하도록 수정 예정) —
    "미가입"과 구분되지 않는 값이라 화면에서 단정적으로 표기하면 안 된다.


    같은 PR 로 GET /api/counsel/tickets/{id}/messages 의 인가가 **당사자 전용 → 당사자 또는
    PLATFORM_ADMIN** 으로 완화됐다(관리자 콘솔이 목록에서 대화로 드릴다운하기 위함). 비당사자·미존재를
    통일 404로 응답하는 열거 방지 정책 자체는 그대로다.


    ⚠️ 아직 미문서로 남은 상담 엔드포인트(#1086 도입, 후속 계약화 대상):
    GET /api/counsel/tickets/{id}/customer-history · GET
    /api/counsel/tickets/{id}/customer-history/{historyId}/messages.


    2026-07-29 유료→유료 하향의 미결제 유예 도입(#1177, Flyway V33) — 하향 예약 대상을 FREE 로만 제한하던
    것을 **킬 스위치 게이팅 하에 유료 대상까지** 확대한다(`PLAN_SCHEDULED_CHANGE_PAID_TARGET_ENABLED`,
    **기본 false**). 스위치가 닫힌 동안 유료 대상은 기존대로 `PLAN_SCHEDULE_PAID_TARGET_UNSUPPORTED`(403).
    열린 경우 적용 시점에 대상 유료 요금제로 전환하되 `user_plans.payment_pending_until`(유예 마감, 기본
    7일·최대 14일)을 세우고, **유예 중에는 한도와 기능 플래그(상담사 연결·AI 부가기능)가 모두 FREE 기준**
    으로 내려간다 — 무결제로 얻는 유료 혜택이 없어야 결제 경로 우회가 되지 않기 때문이다. 마감 전 정산
    결제 시 정상 주기 시작, 미결제 시 FREE 강등.


    응답 변화(additive): `GET /api/me/plan`·`GET·PATCH /api/admin/plan` 의 `plan.paymentPendingUntil`
    (nullable) 신설. **유예 중 `limits.*`·기능 플래그가 FREE 값으로 내려가는 반면 `plan.name` 은 구독
    요금제를 그대로 보여주므로**, 이 필드 없이는 "STANDARD 인데 좌석 한도가 1"이라는 화면 모순을 설명할 수
    없다. 에러 계약: 유예 중 재예약은 `PLAN_SCHEDULE_PAYMENT_PENDING`(409) 신설.
    (버전: 초안에서 0.36.0-draft 로 잡았으나 dev 에서 #1044 가 같은 번호를 먼저 쓰면서 충돌해
    **0.37.0-draft** 로 재배정했다 — 같은 버전이 서로 다른 계약을 가리키지 않게.)


    2026-07-29 최근 점검 목록 REVIEWED 상태 라벨 통일(#1044, PR#1040 P2 후속) — GET
    /api/dashboard/recent-inspections 의 status 값이 REVIEWED 를 "조치대기"로 표기하던 것을 대시보드
    KPI 카드(HAJA-499)와 동일한 "검수확정"으로 변경. RecentInspectionItem.status enum 값도 함께 수정
    (기존 값 "조치대기" 제거, "검수확정" 추가) — 이 값을 그대로 필터 쿼리파라미터로 보내는
    프론트(RecentInspectionsFullListPage)도 동시 반영.


    2026-07-28 구독 만료 FREE 자동 강등 알림 추가(#1145 / HAJA-549, Flyway V28) — `NotificationTypeCode`
    에 **PLAN_EXPIRED** 신설. 결제 주기(`current_period_end`)가 지난 유료 구독을 배치가 FREE 로 내리면서
    발행한다. 기존 enum 값은 그대로라 하위호환이며, 프론트는 미지원 타입 폴백("기타")을 갖고 있으므로
    문구 대응 전에도 깨지지 않는다. 배치는 `enabled=false`·`mode=DRY_RUN` 기본값이라 이 계약이 실제로
    발행되기 전 운영 승격 절차를 거친다.

    2026-07-28 알림 삭제 계약 추가(FR-9) — DELETE /api/notifications/{id} 신설. 알림 센터의 개별 닫기(X)가
    클라이언트 숨김이 아니라 실제 삭제(notifications 행 물리 삭제)로 동작한다. 인가·404 통일 정책은
    PATCH /{id}/read 와 동일(타인 소유·미존재 모두 NOTIFICATION_NOT_FOUND).

    2026-07-28 구독 결제 주기 실체화(#1104 / HAJA-525, Flyway V27) — `user_plans.current_period_start`
    /`current_period_end` 컬럼 신설로 nextBillingDate·remainingDays 의 산출 근거가 **조회 시점 파생 계산
    (startedAt + 1개월)에서 DB 컬럼값으로 교체**됐다. 응답 필드 이름·타입은 그대로라 하위호환이지만
    **의미가 바뀐 지점이 하나 있다**: `remainingDays=null` 이 이제 "만료"뿐 아니라 "무기한(FREE)"도
    뜻하므로(FREE = `remainingDays=null` + `status=ACTIVE`), 소비자는 만료 판정을 **status 로만** 해야
    한다. 결제 승인 전이 시 주기 리셋, 관리자 플랜 변경(무결제) 시 기존 주기 승계.


    2026-07-28 회차 간 비교 조회 계약화(HAJA-531/#1112, HAJA-437 후속) — GET /api/facilities/{id}/compare
    신설. previous_defect_id로 확정된 회차 간 대응을 기준으로 하자를 신규/진행중(악화 포함)/개선완료로
    분류하고 KPI 4종(신규/진행성/개선완료/등급상승)을 반환한다. "재발생"(이전 회차 RESOLVED가 이후
    회차에 재연결된 경우)은 프론트 DefectChangeType에 대응 타입이 없어 이번 범위에서 진행중(worsened)
    으로 근사 매핑한다(HAJA-532/#1119 후속에서 정확화 예정). beforeImageUrl/afterImageUrl/crackTrend는
    실 데이터 근거가 없어 이번 범위에서 생략(프론트 InspectionComparisonResult 타입과 완전히 1:1은 아님).

    2026-07-28 회차 간 비교 "재발생" 정확 분류(HAJA-532/#1119, HAJA-531/#1112 후속) — #1112 당시
    프론트 DefectChangeType에 대응 타입이 없어 worsened로 근사 매핑했던 "재발생"(이전 회차 RESOLVED가
    이후 회차에 재연결된 경우)을 별도 changeType 값 `recurring`으로 정확히 분리한다. "진행성 (악화)"
    KPI는 worsened와 recurring을 함께 센다(둘 다 "다시 조치가 필요한" 상태라는 점에서 동일 버킷).
    gradeEscalated KPI는 worsened만 본다(recurring의 이전 등급은 "이미 조치 완료 시점" 기준이라
    이후 등급과 비교해도 진짜 등급 악화를 의미하지 않음).

    2026-07-28 조치 결과 등록 계약화 + 진행상태 선택 도입(#1128) — 실구현은 있었으나 미문서였던
    **PATCH /api/defects/{id}/action** 을 신규 계약화하면서, 요청 스키마 DefectActionResultRequest에
    **targetStatus**(전이 목표 상태)를 추가했다. 이전에는 이 엔드포인트가 항상 RESOLVED로만 고정 전이했으나,
    하자 상세 모달의 조치 등록 폼에 "진행상태" select가 생기면서 같은 폼으로 조치중(IN_PROGRESS)·
    조치완료(RESOLVED)를 모두 저장한다. targetStatus 허용 값은 IN_PROGRESS/RESOLVED 두 개뿐이며
    (DETECTED/CONFIRMED는 조치 등록의 타겟이 될 수 없어 400), 실제 전이 가능 여부는 기존 정방향 한 단계
    규칙을 그대로 따른다 — CONFIRMED→IN_PROGRESS, IN_PROGRESS→RESOLVED만 허용되고 건너뛴 전이
    (CONFIRMED→RESOLVED)는 400으로 거부된다. defect_revisions 이력도 실제 전이된 상태를 기록한다.

