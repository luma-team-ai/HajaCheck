          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  # ⚠️ 아래 두 항목은 기존 /api/reports/{id} path item(SoT 3125행)에 이미 get/patch가 있다.
  # 이 fragment 를 그대로 paths: 밑에 새 키로 붙이면 YAML 키 중복이 되므로, 병합 시
  # `delete:` 오퍼레이션은 기존 /api/reports/{id}: 블록 안에 patch: 다음 줄로 옮겨 넣고,
  # 아래 /api/reports/{id}/clone: 은 새 top-level path로 그대로 추가한다.

  /api/reports/{id}/clone:
    post:
      summary: 보고서 복제 (ReportController, #446 / HAJA-283)
      description: >
        기존 보고서의 content(contentJson)를 그대로 복제해 같은 점검의 다음 버전(version = 기존
        최대 버전 + 1) DRAFT 보고서를 새로 생성한다(원본 상태는 DRAFT/FINALIZED 무관, 원본 자체는
        변경되지 않는다). 미존재/타인 소유(점검 기준 소유권) 모두 REPORT_NOT_FOUND(404)로 통일 응답한다.
        `ReportController.cloneReport` 구현됨.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [report]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "201":
          description: 복제 성공(새 DRAFT 보고서 생성)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportDetailApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 미존재 또는 타인 소유 (REPORT_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/me/reports:
    get:
      summary: 내 발급 보고서 목록 (MyInspectionsController, #844)
      description: >
        FINALIZED 상태 보고서를 조회 기간(period) 필터와 함께 최신순으로 반환한다(페이지네이션 없음,
        최대 100건 상한 — MY_REPORTS_MAX, 행마다 PDF 파일 stat I/O가 발생해 성능 방어 목적). title 은
        반환하지 않는다(Report 엔티티에 제목 컬럼 없음, 화면 제목은 프론트가 조립). fileSizeBytes 는
        PDF 조회 실패 시 예외 대신 null. `MyInspectionsController.getReports` 구현됨.
      security:
        - SessionCookie: []
      tags: [mypage]
      parameters:
        - name: period
          in: query
          required: false
          description: "1M | 3M | 6M | 1Y | ALL (미지정 시 ALL, 그 외 값은 INVALID_INPUT)"
          schema: { type: string, default: ALL }
      responses:
        "200":
          description: 조회 성공(0건이면 빈 배열, 최대 100건)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyReportRowListApiResponse" }
        "400":
          description: period 가 인식되지 않는 값 (INVALID_INPUT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }


  # ── auth 진위확인·사업자등록증 파일·AI 프록시/내부 ──
  /api/auth/business-verification:
    post:
      summary: 사업자 진위확인(실시간, 공개 프록시, #648)
      description: >
        회원가입 전(비로그인) [진위확인] 버튼 전용. 국세청 상태조회+진위확인 결과를 사용자 대면
        결과 코드(VERIFIED/NOT_REGISTERED/MISMATCH/SUSPENDED/CLOSED/UNAVAILABLE)로 번역해 반환한다.
        UNAVAILABLE(국세청 서비스 미설정·일시 장애)도 fail-open — 200 성공 응답이며 가입 자체를
        막지 않는다(최종 차단은 회원가입 제출 시 서버 재검증이 담당). `/api/auth/**` permitAll(비로그인),
        rate-limit(분당 전역 + 일일 절대캡, 초과 시 429) 적용. `BusinessVerificationController.verify` 구현됨.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessVerificationRequest" }
      responses:
        "200":
          description: 성공 — 국세청 장애로 인한 UNAVAILABLE 포함(fail-open, 에러 아님)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessVerificationApiResponse" }
        "400":
          description: INVALID_INPUT — 사업자등록번호 형식 불량, 대표자명·개업일자 누락 등
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "429":
          description: AUTH_TOO_MANY_REQUESTS — rate-limit 초과(분당 전역 또는 일일 캡)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/companies/{companyId}/business-license/{storageKey}:
    get:
      summary: 사업자등록증 파일 조회(보호 파일, 회사 스코프 재검증)
      description: >
        정적 리소스가 아닌 회사 소속(인가) 재검증 후에만 사업자등록증 바이너리를 반환하는 보호 파일
        엔드포인트다. `{storageKey}`는 실제 라우팅에서 `{*storageKey}`(capture-the-rest) 로 매핑돼
        `business-registration/...` 형태의 다중 슬래시 세그먼트를 그대로 포함할 수 있다(OpenAPI 3.0은
        와일드카드 경로변수를 표현할 수 없어 단일 `{storageKey}` 파라미터로 표기 — 실제 값은
        `business-registration/{파일명}`처럼 `/`를 포함하는 전체 잔여 경로다). 요청자와 `companyId`의
        유효 소속(APPROVED)을 재검증하고, 회사에 저장된 URL에서 역산한 기대 storageKey와 요청값이
        정확히 일치할 때만 파일을 반환한다(경로 조작·타 회사 파일 추측 차단). `BusinessLicenseFileController.download` 구현됨.
      security:
        - SessionCookie: []
      tags: [auth]
      parameters:
        - name: companyId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          example: 10
        - name: storageKey
          in: path
          required: true
          description: >
            capture-the-rest 잔여 경로 전체(예: business-registration/1700000000000_license.png).
            `/` 를 포함하는 다중 세그먼트가 그대로 하나의 경로 변수로 전달된다.
          schema: { type: string }
          example: "business-registration/1700000000000_license.png"
      responses:
        "200":
          description: 파일 바이너리(Content-Type은 확장자로 결정 — image/jpeg, image/png, application/pdf 등)
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
            application/octet-stream: { schema: { type: string, format: binary } }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: FORBIDDEN — 요청자가 해당 companyId의 유효(APPROVED) 소속이 아님
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: >
            COMPANY_NOT_FOUND(회사 미존재) 또는 FILE_NOT_FOUND(회사에 저장된 URL 미존재/파싱 실패,
            storageKey 불일치·경로 조작 시도, 실제 파일 미존재 포함)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/ai/rag-chat:
    post:
      summary: 고객지원 RAG 챗봇 (인증 프록시, HAJA-32 / #467)
      description: >
        로그인 사용자 질의를 세션 인증 프록시로 내부 FastAPI `/ai/rag-chat` 에 전달해 법규·점검 기준
        기반 답변과 출처를 반환한다. userId·companyId는 `@AuthenticationPrincipal` 에서만 취득해
        전달한다(요청 바디 금지) — companyId는 AI 서버 시맨틱 캐시의 회사 스코프 키로 쓰여 바디에서
        받으면 임의 회사의 캐시를 읽어갈 수 있다. `sessionId`(선택, #1467/HAJA-647)를 보내면 세션
        소유자·`sessionType=RAG` 를 FastAPI 호출 전에 검증하고(불일치·미존재 시 403), 최근 3턴 이력을
        함께 전달하며 응답 성공 시 질의/답변/출처를 best-effort로 저장한다(저장 실패는 답변 자체에
        영향 없음). `sessionId` 없이 호출하면 기존과 동일한 무상태 단발 질의로 동작한다.
        `AiProxyController.ragChat` 구현됨.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RagChatProxyRequest" }
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RagChatApiResponse" }
        "400":
          description: INVALID_INPUT | AI_REQUEST_REJECTED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: CHAT_SESSION_FORBIDDEN — sessionId가 타인 소유이거나 sessionType이 RAG가 아님
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "502":
          description: AI_INVALID_RESPONSE | AI_SERVER_ERROR — 내부 FastAPI 오류를 그대로 전달하지 않고 이 코드로 통일
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "503":
          description: AI_SERVER_UNREACHABLE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "504":
          description: AI_SERVER_TIMEOUT
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /ai/detect-defects:
    post:
      summary: AI 하자 탐지 (dev-05-04, AP-006, 내부 전용)
      description: >
        점검 미디어 이미지 1장을 비전 모델로 추론해 하자 탐지 결과 목록을 반환한다. Spring이 회차의
        미디어를 순회하며 이미지 1장당 1회 호출한다. `image_base64`는 점검 미디어 업로드 상한(20MB)의
        base64 상당치를 초과하면 FastAPI가 요청 파싱 단계에서 422로 거부한다. 디코딩 실패·모델 로드
        실패·추론 오류는 예외를 삼키지 않고 로그만 남긴 뒤 VISION_INFERENCE_FAILED 로 반환한다(LLM
        호출 없는 비전 전용 경로라 다른 /ai/* 엔드포인트와 달리 LLM 계열 에러코드를 쓰지 않는다).
        `ai-server/routers/ai_router.py` `detect_defects` 구현됨.
      x-internal: true
      security:
        - InternalKey: []
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DetectDefectsRequest" }
      responses:
        "200":
          description: 성공/실패 모두 200 — success 필드로 구분(추론 실패 시 error.code=VISION_INFERENCE_FAILED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetectDefectsAIResponse" }
        "422":
          description: image_base64 누락 또는 상한(max_length) 초과 — FastAPI detail[] 형식
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FastApiValidationError" }

  /ai/rag-documents/embed:
    post:
      summary: RAG 문서 임베딩 (#22 / HAJA-35, PRD FR-8-B, 내부 전용)
      description: >
        Spring RagDocumentService가 PDF에서 추출한 텍스트와 문서 메타데이터를 실어 보내면, 청킹(텍스트
        분할)만 동기로 즉시 수행해 청크 개수와 이번 배치 식별자(`embed_batch_id`)를 반환하고, 실제
        bge-m3 임베딩 연산은 BackgroundTasks로 넘겨 504 Gateway Timeout을 방지한다(#1393). doc_id 단위
        직렬화 락으로 재임베딩 중 원본/재임베딩 배경 태스크의 경합을 막는다. `target_collection`은
        `regulations` 또는 `defect_kb`만 허용하며 그 외 값은 VALIDATION_ERROR. Spring은 이 응답의
        chunk_count·embed_batch_id를 임베딩 상태 폴링(`/ai/rag-documents/{doc_id}/embedding-status`)의
        완료 판정 기준으로 쓴다. `ai-server/routers/ai_router.py` `rag_documents_embed` 구현됨.
      x-internal: true
      security:
        - InternalKey: []
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RagDocumentEmbedRequest" }
      responses:
        "200":
          description: 성공(청킹 완료, 임베딩은 백그라운드 진행 중) 또는 실패 — success 필드로 구분
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RagDocumentEmbedAIResponse" }
        "422":
          description: 필수 필드(doc_id/title/doc_type/target_collection/text) 누락 등 — FastAPI detail[] 형식
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FastApiValidationError" }

  /ai/rag-documents/{doc_id}/embedding-status:
    get:
      summary: RAG 문서 백그라운드 임베딩 완료 여부 조회 (#1328, 내부 전용)
      description: >
        `/ai/rag-documents/embed` 가 청킹만 동기로 끝내고 실제 임베딩은 BackgroundTasks로 넘기므로,
        Spring이 즉시 완료 처리하면 실제로는 아직 Chroma에 반영되지 않은 거짓 완료가 생길 수 있다.
        Spring은 이 엔드포인트를 폴링해 Chroma의 실제 chunk_count가 기대치와 일치할 때만 완료로
        확정한다. 적재된 청크 전부가 같은 배치에서 나왔을 때만 `embed_batch_id`를 반환하고, 재임베딩
        도중처럼 신·구 배치 청크가 섞여 있으면 `null`(재임베딩 도중 거짓 완료 방지, #1393). 임베딩 모델
        호출 없이 Chroma 메타데이터 조회만 수행하는 가벼운 read-only 엔드포인트다.
        `ai-server/routers/ai_router.py` `rag_documents_embedding_status` 구현됨.
      x-internal: true
      security:
        - InternalKey: []
      tags: [ai]
      parameters:
        - name: doc_id
          in: path
          required: true
          schema: { type: string, pattern: "^[1-9][0-9]*$" }
          example: "42"
        - name: target_collection
          in: query
          required: true
          schema: { type: string, enum: [regulations, defect_kb] }
          example: regulations
      responses:
        "200":
          description: 성공(조회) 또는 실패 — success 필드로 구분(target_collection 미상 값은 VALIDATION_ERROR)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RagEmbeddingStatusAIResponse" }

  /ai/rag-documents/{doc_id}:
    delete:
      summary: RAG 문서 Chroma 청크 삭제 (#1394, PLATFORM_ADMIN 콘솔 문서 삭제, 내부 전용)
      description: >
        Spring RagDocumentService가 DB 로우·원본 파일을 지우기 전에 먼저 호출해 Chroma의 해당 doc_id
        청크를 삭제한다. doc_id에 매치되는 청크가 없어도(이미 삭제됐거나 애초에 없던 경우) 에러 없이
        조용히 성공하는 idempotent 엔드포인트라 Spring이 실패 후 재시도해도 안전하게 수렴한다. 삭제도
        doc_id 단위 직렬화 락으로 감싸(#1412) 진행 중인 재임베딩 배경 태스크가 끝난 뒤 실행되도록 해,
        "삭제 직후 배경 ingest가 청크를 다시 써 넣는" 고아 청크(삭제된 문서를 근거로 챗봇이 답변하는
        사용자 노출 오동작)를 방지한다. `ai-server/routers/ai_router.py` `rag_documents_delete` 구현됨.
      x-internal: true
      security:
        - InternalKey: []
      tags: [ai]
      parameters:
        - name: doc_id
          in: path
          required: true
          schema: { type: string }
          example: "42"
        - name: target_collection
          in: query
          required: true
          schema: { type: string, enum: [regulations, defect_kb] }
          example: regulations
      responses:
        "200":
          description: 성공(삭제 완료 또는 애초에 청크 없음, 둘 다 success=true) 또는 실패 — success 필드로 구분
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RagDeleteAIResponse" }

components:
  securitySchemes:
    InternalKey:
      type: apiKey
      in: header
      name: X-Internal-Key
      description: Spring Boot가 FastAPI 내부 호출에 부착하는 AI_INTERNAL_KEY
    InternalServiceToken:
      type: apiKey
      in: header
      name: X-Internal-Service-Token
      description: Spring Boot와 FastAPI 환경변수에만 주입하는 내부 호출 토큰
    SessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: Spring Security 인증 세션 쿠키
    XsrfToken:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: 상태 변경 요청에 필요한 double-submit CSRF 토큰

  schemas:
    # ── auth 도메인 (Spring Boot envelope: { success, data, error }) ──
    LoginRequest:
      type: object
      required: [loginId, password]
      properties:
        loginId: { type: string, description: 로그인 ID(=email), example: company@haja.com }
        password: { type: string, format: password, example: "pw123456" }

    UserResponse:
      type: object
      description: 사용자 응답(민감 필드 password_hash/social_id 제외)
      properties:
        id: { type: integer, format: int64, example: 1 }
        email: { type: string, example: company@haja.com }
        name: { type: string, example: 기업사용자 }
        role: { type: string, enum: [ADMIN, INSPECTOR, USER, COUNSELOR, PLATFORM_ADMIN], example: USER }
        companyId: { type: integer, format: int64, nullable: true, example: 10 }
        profileImageUrl: { type: string, nullable: true, example: "https://.../p.png" }
        createdAt: { type: string, format: date-time, description: "가입일시(BaseTimeEntity, 항상 존재)", example: "2026-07-24T14:30:00" }
        companyName: { type: string, nullable: true, description: 소속 기업명(개인 회원/회사 미조회 시 null), example: 하자체크 }
        isDemo: { type: boolean, description: "데모 계정 여부(#1626) — 서버가 설정(app.demo.login-id) 매칭으로 계산. 프론트는 이 값으로 데모 배너/안내 UI를 분기한다(추가 필드라 기존 클라이언트 호환)", example: false }

    ApiError:
      type: object
      properties:
        code: { type: string, example: AUTH_INVALID_CREDENTIALS }
        message: { type: string, example: 아이디 또는 비밀번호가 올바르지 않습니다. }

    UserApiResponse:
      type: object
      description: 성공 envelope — data=UserResponse
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/UserResponse" }
        error: { type: object, nullable: true, example: null }

    VoidApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { type: object, nullable: true, example: null }
        error: { type: object, nullable: true, example: null }

    ErrorApiResponse:
      type: object
      description: 실패 envelope — error=ApiError
      properties:
        success: { type: boolean, example: false }
        data: { type: object, nullable: true, example: null }
        error: { $ref: "#/components/schemas/ApiError" }

    # ── counsel 도메인 (FR-7, #20/HAJA-33, #1002/HAJA-496) ──
    CounselTicketStatus:
      type: string
      enum: [WAITING, IN_PROGRESS, RESOLVED, OFFLINE_LEFT]

    ChatSenderType:
      type: string
      enum: [USER, BOT, COUNSELOR]

    CounselTicketCreateRequest:
      type: object
      required: [scenarioId]
      properties:
        scenarioId:
          type: integer
          format: int64
          description: 상담원 연결을 유발한 시나리오 리프(leadsToCounselor=true) 노드 id
          example: 42

    CounselTicketResponse:
      type: object
      description: 상담 티켓 단건 응답 — 생성/배정/종료 결과 및 개인 알림(/user/queue/counsel/**) 페이로드.
      properties:
        id: { type: integer, format: int64, example: 501 }
        ticketNumber: { type: string, example: "C-20260727-501" }
        category: { type: string, example: INSPECTION_REPORT }
        title: { type: string, example: 분석 결과 문의 }
        userId: { type: integer, format: int64, example: 10 }
        counselorId: { type: integer, format: int64, nullable: true, example: 7 }
        counselorName: { type: string, nullable: true, description: 배정된 상담원 표시 이름(미배정 시 null), example: 김상담 }
        sessionId: { type: integer, format: int64, nullable: true, example: 88 }
        status: { $ref: "#/components/schemas/CounselTicketStatus" }
        queuePosition: { type: integer, nullable: true, example: 3 }
        createdAt: { type: string, format: date-time, example: "2026-07-27T10:00:00" }
        endedAt: { type: string, format: date-time, nullable: true, example: null }

    CounselTicketApiResponse:
      type: object
      description: 성공 envelope — data=CounselTicketResponse
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/CounselTicketResponse" }
        error: { type: object, nullable: true, example: null }

    CounselTicketSummaryResponse:
      type: object
      description: >
        상담원 대기열/내 이력/고객 이력/관리자 날짜별 목록 항목 — 대화 내용 등 민감 정보는 제외.
        `customer*` 4필드는 GET /api/counsel/tickets/admin 전용이며 그 외 경로에서는 항상 null 이다(#1168).
      properties:
        id: { type: integer, format: int64, example: 501 }
        ticketNumber: { type: string, example: "C-20260727-501" }
        category: { type: string, example: INSPECTION_REPORT }
        title: { type: string, example: 분석 결과 문의 }
        userId: { type: integer, format: int64, example: 10 }
        counselorId: { type: integer, format: int64, nullable: true, example: 7 }
        counselorName: { type: string, nullable: true, example: 김상담 }
        status: { $ref: "#/components/schemas/CounselTicketStatus" }
        queuePosition: { type: integer, nullable: true, example: 3 }
        createdAt: { type: string, format: date-time, example: "2026-07-27T10:00:00" }
        customerName:
          type: string
          nullable: true
          description: "PLATFORM_ADMIN 날짜별 목록 전용. 그 외 경로(대기열·내 이력·고객 이력)에서는 항상 null."
          example: 홍길동
        customerEmail:
          type: string
          nullable: true
          description: "PLATFORM_ADMIN 날짜별 목록 전용. 그 외 경로(대기열·내 이력·고객 이력)에서는 항상 null."
          example: user@example.com
        customerPlan:
          type: string
          nullable: true
          description: >
            활성 구독 요금제명. PLATFORM_ADMIN 날짜별 목록 전용 — 그 외 경로(대기열·내 이력·고객 이력)
            에서는 항상 null. ⚠️ 현재는 개인 구독만 해석하므로 **회사 소속 고객이면 유료여도 null** 이며
            (후속 #1263에서 회사 구독까지 해석 예정), 유예 중(#1177) 실효 요금제도 반영하지 않는다.
          example: PREMIUM
        customerJoinedAt:
          type: string
          format: date-time
          nullable: true
          description: "가입일. PLATFORM_ADMIN 날짜별 목록 전용. 그 외 경로에서는 항상 null."
          example: "2026-05-01T09:00:00"

    CounselTicketSummaryPage:
      type: object
      description: >
        global.common.PageResponse<CounselTicketSummaryResponse> 매핑(content/page/totalElements
        3필드 — size/totalPages 는 이 envelope 에 없음).
      required: [content, page, totalElements]
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/CounselTicketSummaryResponse" }
        page: { type: integer, minimum: 0, example: 0 }
        totalElements: { type: integer, format: int64, minimum: 0, example: 12 }

    CounselTicketSummaryPageApiResponse:
      type: object
      description: 성공 envelope — data=CounselTicketSummaryPage
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/CounselTicketSummaryPage" }
        error: { type: object, nullable: true, example: null }

    CounselTicketNoteUpdateRequest:
      type: object
      description: >
        상담원 전용 비공개 메모 저장(upsert) 요청. content 는 선택 — null/빈 문자열이면 메모를 비운다.
      properties:
        content:
          type: string
          nullable: true
          maxLength: 4000
          example: 고객 재문의 예정 — 다음 주 점검 보고서 재발송 필요

    CounselTicketNoteResponse:
      type: object
      description: >
        상담원 전용 비공개 메모(고객 비노출, 티켓당 1개). 메모가 아직 없는 티켓이면 counselorId/content/
        updatedAt 이 모두 null 인 "빈 메모"로 응답한다.
      properties:
        ticketId: { type: integer, format: int64, example: 501 }
        counselorId:
          type: integer
          format: int64
          nullable: true
          description: 최근 메모를 작성/갱신한 상담원 ID(메모 없으면 null)
          example: 7
        content:
          type: string
          nullable: true
          description: 메모 본문(메모 없음/초기화 시 null)
          example: 고객 재문의 예정 — 다음 주 점검 보고서 재발송 필요
        updatedAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-07-28T09:20:00"

    CounselTicketNoteApiResponse:
      type: object
      description: 성공 envelope — data=CounselTicketNoteResponse
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/CounselTicketNoteResponse" }
        error: { type: object, nullable: true, example: null }

    ChatMessageResponse:
      type: object
      description: >
        상담방 브로드캐스트/이력 메시지. 첨부가 있으면 원본 저장키 대신 인가된 서빙 API 경로
        (attachmentUrl)만 노출한다.
      properties:
        id: { type: integer, format: int64, example: 9001 }
        sessionId: { type: integer, format: int64, example: 88 }
        sender: { $ref: "#/components/schemas/ChatSenderType" }
        content: { type: string, example: "화면에 오류가 떠서 문의드립니다." }
        counselorName:
          type: string
          nullable: true
          description: sender=COUNSELOR 메시지에만 채워짐(USER/BOT 은 항상 null)
          example: 김상담
        attachmentUrl:
          type: string
          nullable: true
          description: "첨부가 있을 때만 — /api/counsel/tickets/{id}/messages/{messageId}/attachment"
          example: "/api/counsel/tickets/501/messages/9001/attachment"
        createdAt: { type: string, format: date-time, example: "2026-07-27T10:05:00" }

    ChatMessageListApiResponse:
      type: object
      description: 성공 envelope — data=ChatMessageResponse[]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/ChatMessageResponse" }
        error: { type: object, nullable: true, example: null }

    AIErrorCode:
      type: string
      enum: [LLM_TIMEOUT, LLM_RATE_LIMIT, LLM_INVALID_OUTPUT, RAG_NO_RESULT, VALIDATION_ERROR]
      description: >-
        LLM 계열(TIMEOUT/RATE_LIMIT/INVALID_OUTPUT)·RAG_NO_RESULT 외에,
        VALIDATION_ERROR 는 LLM 호출이 없는 순수 코드 대조 경로(grounding-check 등)의
        입력·대조 검증 실패용 (#122).

    AIError:
      type: object
      properties:
        code: { $ref: "#/components/schemas/AIErrorCode" }
        message: { type: string }

    AIUsage:
      type: object
      properties:
        tokens: { type: integer }

    AIResponse:
      type: object
      description: 모든 /ai/** 공통 응답 envelope (AI_개발_컨벤션.md §5)
      properties:
        success: { type: boolean }
        data: {}
        usage: { $ref: "#/components/schemas/AIUsage" }
        error: { $ref: "#/components/schemas/AIError" }

    DefectTypeCode:
      type: string
      description: >-
        탐지 클래스 3종 확정(PRD v0.42, 2026-07-13) — LEAK_EFFLORESCENCE(누수·백태)·PAINT_DAMAGE(도장손상)는
        데이터 확보 상황상 이번 범위에서 제외됨. DB `defect_type` enum·프론트 DefectType은 별도 확인·정합 필요.
      enum: [CRACK, SPALLING, REBAR_EXPOSURE]

    DefectGradeCode:
      type: string
      enum: [A, B, C, D, E]

    DefectStatusCode:
      type: string
      description: >-
        하자 조치 상태 4단계(DETECTED → CONFIRMED → IN_PROGRESS → RESOLVED). CONFIRMED(검수확정)가
        "검수완료 + 아직 조치 착수 전"까지 겸한다 — 구 ACTION_PENDING(조치대기)은 CONFIRMED로 흡수되어
        제거됐다(DB V22 마이그레이션).
      enum: [DETECTED, CONFIRMED, IN_PROGRESS, RESOLVED]

    InspectionStatusCode:
      type: string
      enum: [CREATED, UPLOADING, ANALYZING, ANALYZED, REVIEWED, REPORTED]

    InspectionTypeCode:
      type: string
      description: 점검유형(#540 ①) — DB inspection_type PG enum(V7 마이그레이션)과 1:1.
      enum: [REGULAR, DETAILED, EMERGENCY]

    InspectionCreateRequest:
      type: object
      additionalProperties: false
      required: [facilityId, inspectionDate, assignedInspectorId]
      properties:
        facilityId: { type: integer, format: int64, minimum: 1 }
        inspectionDate: { type: string, format: date }
        assignedInspectorId:
          type: integer
          format: int64
          minimum: 1
          description: ACTIVE이며 INSPECTOR 또는 ADMIN 역할인 담당자 식별자

    FacilityCreateRequest:
      type: object
      additionalProperties: false
      required: [name, type]
      description: companyId 는 인증 주체에서 서버가 기록하므로 요청 바디에 포함하지 않는다.
      properties:
        name: { type: string, maxLength: 200 }
        type: { type: string, maxLength: 20 }
        address: { type: string, maxLength: 300, nullable: true }
        latitude: { type: number, format: double, minimum: -90.0, maximum: 90.0, nullable: true }
        longitude: { type: number, format: double, minimum: -180.0, maximum: 180.0, nullable: true }
        builtYear: { type: integer, nullable: true }
        scale: { type: string, maxLength: 100, nullable: true }
        inspectionCycleMonths: { type: integer, minimum: 0, nullable: true }
        nextInspectionDueAt: { type: string, format: date, nullable: true }

    FacilityUpdateRequest:
      type: object
      additionalProperties: false
      required: [name, type]
      description: FacilityCreateRequest 와 동일 필드 집합(전체 교체 방식).
      properties:
        name: { type: string, maxLength: 200 }
        type: { type: string, maxLength: 20 }
        address: { type: string, maxLength: 300, nullable: true }
        latitude: { type: number, format: double, minimum: -90.0, maximum: 90.0, nullable: true }
        longitude: { type: number, format: double, minimum: -180.0, maximum: 180.0, nullable: true }
        builtYear: { type: integer, nullable: true }
        scale: { type: string, maxLength: 100, nullable: true }
        inspectionCycleMonths: { type: integer, minimum: 0, nullable: true }
        nextInspectionDueAt: { type: string, format: date, nullable: true }

    FacilityScheduleRequest:
      type: object
      additionalProperties: false
      required: [inspectionCycleMonths]
      description: >
        점검주기 설정 요청(dev-04-03). 기준일(오늘)은 서버가 산출하므로 요청 바디에 포함하지 않는다.
      properties:
        inspectionCycleMonths: { type: integer, minimum: 1 }

    InspectionNotificationSettingRequest:
      type: object
      additionalProperties: false
      required: [notifyBeforeEnabled, notifyBeforeDays, warnOnOverdueEnabled]
      description: >
        점검 알림 설정 저장(upsert) 요청(#540 ③, HAJA-498). notifyBeforeDays 범위는 DB 체크 제약(1~365)과
        동일하게 Bean Validation으로도 사전 방어한다.
      properties:
        notifyBeforeEnabled: { type: boolean }
        notifyBeforeDays: { type: integer, minimum: 1, maximum: 365 }
        warnOnOverdueEnabled: { type: boolean }

    InspectionNotificationSettingResponse:
      type: object
      additionalProperties: false
      required: [notifyBeforeEnabled, notifyBeforeDays, warnOnOverdueEnabled]
      description: >
        점검 알림 설정 조회/저장 응답(#540 ③). 사용자가 한 번도 저장한 적 없는 시설물은 DB 컬럼 기본값
        (notifyBeforeEnabled=true, notifyBeforeDays=7, warnOnOverdueEnabled=true — HAJA-498/V21, 최초
        false였다가 연체 알림 미발행 회귀로 Polalise 승인 옵션1로 되돌림)과 동일한 값을 반환한다.
      properties:
        notifyBeforeEnabled: { type: boolean }
        notifyBeforeDays: { type: integer, minimum: 1, maximum: 365 }
        warnOnOverdueEnabled: { type: boolean }

    InspectionNotificationSettingApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/InspectionNotificationSettingResponse" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    FacilityResponse:
      type: object
      additionalProperties: false
      required: [id, name, type, createdAt, updatedAt, defectCount]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type: { type: string }
        address: { type: string, nullable: true }
        latitude: { type: number, format: double, nullable: true }
        longitude: { type: number, format: double, nullable: true }
        builtYear: { type: integer, nullable: true }
        scale: { type: string, nullable: true }
        inspectionCycleMonths: { type: integer, nullable: true }
        nextInspectionDueAt: { type: string, format: date, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        thumbnailUrl:
          type: string
          nullable: true
          description: >
            대표 사진 썸네일 조회 경로(HAJA-367/#670, 예: /api/media/{id}/thumbnail). 대표 사진이 없으면 null.
        lastInspectedAt:
          type: string
          format: date
          nullable: true
          description: >
            가장 최근 점검의 inspectionDate(HAJA-514/#1074). 점검 이력이 없으면 null.
        defectCount:
          type: integer
          format: int64
          description: >
            시설물 카드 하자건수 배지(HAJA-515/#1075) — 비삭제 하자 총건수. facilityIds 배치 조회 후
            그룹핑(DefectRepository.countGroupByFacilityIds)해 N+1 없이 채운다. 하자가 없으면 null이
            아니라 0.

    FacilityDetailResponse:
      type: object
      additionalProperties: false
      required: [facility, inspections]
      description: >
        ⚠️ 계획안(미구현) — dev-04-02 점검이력 결합 후속 작업에서 채택 예정. 현재 GET /api/facilities/{id}
        는 flat FacilityResponse 를 반환한다. 채택 시 응답 구조 변경(breaking)이므로 계약 오너 승인 필요.
        시설물 상세 + 해당 시설의 점검 회차 이력(최신순).
      properties:
        facility: { $ref: "#/components/schemas/FacilityResponse" }
        inspections:
          type: array
          items: { $ref: "#/components/schemas/InspectionResponse" }

    FacilityApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/FacilityResponse" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    FacilityListApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          type: array
          items: { $ref: "#/components/schemas/FacilityResponse" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    FacilityComparisonCycleOption:
      type: object
      additionalProperties: false
      required: [cycle, date]
      properties:
        cycle: { type: integer, description: 점검 회차 번호(roundNo). }
        date: { type: string, format: date, description: 해당 회차의 inspectionDate. }

    FacilityComparisonKpi:
      type: object
      additionalProperties: false
      required: [key, label, value, changeValue]
      properties:
        key:
          type: string
          enum: [newDefects, worsening, resolved, gradeEscalated]
        label: { type: string, description: KPI 한글 라벨. }
        value: { type: integer, description: 해당 KPI 분류 건수. }
        changeValue:
          type: integer
          description: >
            악화/신규=양수, 개선=음수 부호 규칙만 반영한 값(#489 스펙). 회차간 KPI 추이 비교의
            정식 기준선은 아직 없어 value와 부호만 다른 단순화된 값이다.

    FacilityComparisonDefectChangeRow:
      type: object
      additionalProperties: false
      required: [id, location, defectType, gradeBefore, gradeAfter, changeType, note]
      properties:
        id: { type: integer, format: int64 }
        location: { type: string, nullable: true }
        defectType: { type: string, description: DefectType.label() 한글 라벨(예=균열). }
        gradeBefore: { type: string, nullable: true, description: 이전 회차 등급(A~E). 신규면 null. }
        gradeAfter: { type: string, nullable: true, description: 이후 회차 등급(A~E). 개선완료면 null. }
        changeType:
          type: string
          enum: [new, unchanged, worsened, resolved, recurring]
          description: >
            recurring(재발생, HAJA-532/#1119) — 이전 회차 RESOLVED였던 하자가 이후 회차에
            previousDefectId로 재연결된 경우. 초기(#1112)엔 대응 타입이 없어 worsened로
            근사 매핑했었으나 이제 정확히 구분한다. "진행성 (악화)" KPI는 worsened와 recurring을
            함께 센다.
        note: { type: string, description: 이번 범위에서는 항상 빈 문자열. }

    FacilityComparisonResponse:
      type: object
      additionalProperties: false
      required: [facilityId, facilityName, beforeCycle, afterCycle, kpis, changes, availableCycles]
      description: >
        HAJA-531/#1112 — 프론트 InspectionComparisonResult와 완전히 1:1은 아니다. 실 데이터 근거가
        없는 beforeImageUrl/afterImageUrl/crackTrend는 이번 범위에서 생략한다.
      properties:
        facilityId: { type: integer, format: int64 }
        facilityName: { type: string }
        beforeCycle: { $ref: "#/components/schemas/FacilityComparisonCycleOption" }
        afterCycle: { $ref: "#/components/schemas/FacilityComparisonCycleOption" }
        kpis:
          type: array
          items: { $ref: "#/components/schemas/FacilityComparisonKpi" }
        changes:
          type: array
          items: { $ref: "#/components/schemas/FacilityComparisonDefectChangeRow" }
        availableCycles:
          type: array
          items: { $ref: "#/components/schemas/FacilityComparisonCycleOption" }

    FacilityComparisonApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/FacilityComparisonResponse" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    UpcomingInspectionResponse:
      type: object
      additionalProperties: false
      required: [facilityId, facilityName, nextInspectionDueAt, dDay]
      properties:
        facilityId: { type: integer, format: int64 }
        facilityName: { type: string }
        nextInspectionDueAt: { type: string, format: date }
        dDay: { type: integer, description: "오늘 기준 잔여일(nextInspectionDueAt - 오늘). 0=오늘. 오늘 이후만 조회하므로 음수 없음" }
        inspectionCycleMonths: { type: integer, nullable: true }

    UpcomingInspectionListApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          type: array
          items: { $ref: "#/components/schemas/UpcomingInspectionResponse" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    FacilityDetailApiResponse:
      type: object
      description: ⚠️ 계획안(미구현) — FacilityDetailResponse 채택 시 사용.
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/FacilityDetailResponse" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    InspectionResponse:
      type: object
      additionalProperties: false
      required:
        [id, facilityId, createdBy, assignedInspectorId, roundNo, inspectionDate, type, status, createdAt]
      properties:
        id: { type: integer, format: int64 }
        facilityId: { type: integer, format: int64 }
        createdBy: { type: integer, format: int64 }
        assignedInspectorId: { type: integer, format: int64 }
        roundNo: { type: integer, minimum: 1 }
        inspectionDate: { type: string, format: date }
        type:
          $ref: "#/components/schemas/InspectionTypeCode"
          description: >
            점검유형(#540 ①) — 엔티티/DB(V7 마이그레이션)에는 이미 있었으나 응답 DTO에 노출되지 않던 갭을
            소급 반영(PR#1032 사람검수 P2-3). 현재 POST /api/inspections 요청 바디에는 이 필드가 없어
            항상 REGULAR로 생성된다(#540 ①은 응답 노출만 범위 — 생성 시 유형 지정은 후속 범위).
        status: { $ref: "#/components/schemas/InspectionStatusCode" }
        createdAt: { type: string, format: date-time }

    InspectionApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/InspectionResponse" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    InspectionListItemResponse:
      type: object
      additionalProperties: false
      description: >
        GET /api/inspections 목록 항목(#725/HAJA-393, PR #891로 실구현 완료·PR#1032 사람검수 P2-3로
        소급 계약화). assignedInspectorId는 점검 회차 생성 시 배정된 담당자이며, gradeDistribution은
        A~E 5개 키를 항상 포함(값 없는 등급은 0, #893/HAJA-458).
      required:
        [id, facilityId, facilityName, roundNo, inspectionDate, type, assignedInspectorId, assigneeName,
         status, defectCount, gradeDistribution]
      properties:
        id: { type: integer, format: int64 }
        facilityId: { type: integer, format: int64 }
        facilityName: { type: string }
        roundNo: { type: integer, minimum: 1 }
        inspectionDate: { type: string, format: date }
        type: { $ref: "#/components/schemas/InspectionTypeCode" }
        assignedInspectorId: { type: integer, format: int64 }
        assigneeName: { type: string, description: 배정 담당자를 찾을 수 없으면 "-" }
        status: { $ref: "#/components/schemas/InspectionStatusCode" }
        defectCount: { type: integer, format: int64, minimum: 0 }
        gradeDistribution:
          type: object
          description: 등급(A~E)별 하자 건수 — 5개 키 항상 포함
          additionalProperties: { type: integer, format: int64, minimum: 0 }
          example: { A: 0, B: 2, C: 1, D: 0, E: 0 }

    InspectionListItemPage:
      type: object
      description: >
        global.common.PageResponse<InspectionListItemResponse> 매핑(content/page/totalElements 3필드 —
        size/totalPages 는 이 envelope 에 없음, CounselTicketSummaryPage 와 동일 패턴).
      required: [content, page, totalElements]
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/InspectionListItemResponse" }
        page: { type: integer, minimum: 0, example: 0 }
        totalElements: { type: integer, format: int64, minimum: 0, example: 12 }

    InspectionListItemPageApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/InspectionListItemPage" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    MediaFileTypeCode:
      type: string
      enum: [IMAGE, VIDEO]

    MediaResponse:
      type: object
      additionalProperties: false
      required: [id, inspectionId, fileType, thumbnailUrl, createdAt]
      properties:
        id: { type: integer, format: int64 }
        inspectionId: { type: integer, format: int64 }
        fileType: { $ref: "#/components/schemas/MediaFileTypeCode" }
        thumbnailUrl:
          type: string
          description: 인가된 썸네일 조회 API 경로(/api/media/{id}/thumbnail) — 저장소 원본 경로 아님.
        detailUrl:
          type: string
          description: 분석 결과 뷰어 전용 상세 이미지 조회 API 경로(/api/media/{id}/detail, #803)
        mimeType: { type: string, nullable: true }
        capturedAt: { type: string, format: date-time, nullable: true, description: EXIF 촬영시각(없으면 null) }
        gpsLat: { type: number, nullable: true }
        gpsLng: { type: number, nullable: true }
        createdAt: { type: string, format: date-time }

    MediaListApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          type: array
          items: { $ref: "#/components/schemas/MediaResponse" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    NullableDefectGradeCode:
      type: string
      enum: [A, B, C, D, E]
      nullable: true

    DefectListItem:
      type: object
      additionalProperties: false
      required: [id, inspectionId, facilityId, type, grade, status, confidence, isReviewed, createdAt]
      properties:
        id: { type: integer, format: int64 }
        inspectionId: { type: integer, format: int64 }
        facilityId: { type: integer, format: int64 }
        type: { $ref: "#/components/schemas/DefectTypeCode" }
        grade: { $ref: "#/components/schemas/NullableDefectGradeCode" }
        status: { $ref: "#/components/schemas/DefectStatusCode" }
        confidence: { type: number, format: double, minimum: 0, maximum: 1 }
        isReviewed: { type: boolean }
        createdAt: { type: string, format: date-time }

    DefectPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/DefectListItem" }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    DefectListApiResponse:
      type: object
      description: GET /api/defects 전용 Spring ApiResponse envelope
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/DefectPage" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    DefectDetailItem:
      type: object
      additionalProperties: false
      description: >
        DefectListItem + 뷰어 오버레이·정밀 검수에 필요한 필드(bbox·균열 실측치). 목록(#/api/defects)은
        가벼운 DefectListItem을 쓰고, 점검 회차 단위 조회·검수 API는 이 스키마를 쓴다.
      required: [id, inspectionId, type, typeLabel, grade, status, confidence, isReviewed, mediaId, imageUrl, createdAt]
      properties:
        id: { type: integer, format: int64 }
        inspectionId: { type: integer, format: int64 }
        type: { $ref: "#/components/schemas/DefectTypeCode" }
        typeLabel: { type: string }
        grade: { $ref: "#/components/schemas/NullableDefectGradeCode" }
        status: { $ref: "#/components/schemas/DefectStatusCode" }
        confidence: { type: number, format: double, minimum: 0, maximum: 1 }
        isReviewed: { type: boolean }
        bboxX: { type: number, format: double, nullable: true }
        bboxY: { type: number, format: double, nullable: true }
        bboxW: { type: number, format: double, nullable: true }
        bboxH: { type: number, format: double, nullable: true }
        crackWidthMm: { type: number, format: double, nullable: true }
        crackLengthMm: { type: number, format: double, nullable: true }
        areaRatio:
          type: number
          format: double
          nullable: true
          description: 결함 면적비율(탐지 bbox 면적 ÷ 이미지 전체 면적) — 박리박락·철근노출 전용, 균열은 항상 null(#802/#803)
        mediaId:
          type: integer
          format: int64
          nullable: true
          description: 탐지 이미지 ID. 수동 추가 등 이미지와 연결되지 않은 하자는 null
        imageUrl:
          type: string
          nullable: true
          description: 카드용 썸네일 URL(/api/media/{mediaId}/thumbnail) — mediaId가 있을 때만 채워짐
        detailUrl:
          type: string
          nullable: true
          description: 분석 결과 뷰어 전용 상세 이미지 URL(/api/media/{mediaId}/detail) — mediaId가 있을 때만 채워짐(#788/#789)
        createdAt: { type: string, format: date-time }

    DefectDetailListApiResponse:
      type: object
      description: GET /api/inspections/{id}/defects 전용 Spring ApiResponse envelope(페이지네이션 없음)
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          type: array
          items: { $ref: "#/components/schemas/DefectDetailItem" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    DefectResponse:
      type: object
      description: >
        하자 상세 응답(backend `core.defect.dto.DefectResponse`) — GET /api/defects/{id} 와
        PATCH /api/defects/{id}/location · /previous-defect 가 쓰는 계약. DefectDetailItem(점검 회차
        단위 조회용)과 달리 시설물 정보·조치 정보·담당자 이름까지 포함한 상세형이다.
      required: [id, inspectionId, facilityId, facilityName, type, typeLabel, status, reviewed, createdAt]
      properties:
        id: { type: integer, format: int64, example: 3012 }
        inspectionId: { type: integer, format: int64, example: 88 }
        facilityId: { type: integer, format: int64, example: 12 }
        facilityName: { type: string, example: 한빛아파트 101동 }
        facilityType: { type: string, nullable: true, example: APARTMENT }
        location:
          type: string
          nullable: true
          description: 하자 위치 텍스트(#970 갭3) — 검수자가 사후 편집하기 전에는 null
          example: 외벽 동측 12층 부근
        assigneeName:
          type: string
          nullable: true
          description: >
            시설물 담당자(Facility.assigneeUserId) 이름(#970 갭3). 상세 조회에서만 채워지고 목록·PATCH
            응답에서는 null이다(목록은 N+1 방지, PATCH는 후속 #1107/HAJA-528 정정 대상).
          example: 김점검
        foundCycle:
          type: integer
          nullable: true
          description: 하자를 발견한 점검 회차(Inspection.roundNo, HAJA-488)
          example: 3
        type: { $ref: "#/components/schemas/DefectTypeCode" }
        typeLabel: { type: string, example: 균열 }
        grade: { $ref: "#/components/schemas/NullableDefectGradeCode" }
        status: { $ref: "#/components/schemas/DefectStatusCode" }
        confidence: { type: number, format: double, nullable: true, minimum: 0, maximum: 1, example: 0.92 }
        reviewed: { type: boolean, example: false }
        bboxX: { type: number, format: double, nullable: true }
        bboxY: { type: number, format: double, nullable: true }
        bboxW: { type: number, format: double, nullable: true }
        bboxH: { type: number, format: double, nullable: true }
        crackWidthMm: { type: number, format: double, nullable: true, description: 균열 외 유형은 null }
        crackLengthMm: { type: number, format: double, nullable: true, description: 균열 외 유형은 null }
        imageUrl:
          type: string
          nullable: true
          description: 탐지 이미지 썸네일(/api/media/{mediaId}/thumbnail) — mediaId 없으면 null(HAJA-314)
          example: /api/media/551/thumbnail
        previousDefectId:
          type: integer
          format: int64
          nullable: true
          description: 검수자가 확정한 이전 회차 대응 하자 id(HAJA-437, self-referencing) — 미확정이면 null
          example: 2871
        actionPhotoUrl: { type: string, nullable: true, example: /api/media/612/thumbnail }
        actionContent: { type: string, nullable: true, example: 에폭시 주입 보수 완료 }
        actionDate: { type: string, format: date, nullable: true, example: "2026-07-20" }
        actionAssigneeId: { type: integer, format: int64, nullable: true, example: 42 }
        actionAssigneeName:
          type: string
          nullable: true
          description: 조치 담당자 이름 — assigneeName과 동일하게 상세 조회에서만 채워진다
          example: 이조치
        createdAt: { type: string, format: date-time, example: "2026-07-20T10:00:00" }

    DefectResponseApiResponse:
      type: object
      description: 성공 envelope — data=DefectResponse
      required: [success, data, error]
      properties:
        success: { type: boolean, example: true }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/DefectResponse" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    DefectLocationUpdateRequest:
      type: object
      description: >
        하자 위치 사후 편집 요청(#970 갭3). location은 nullable — null/빈 문자열/공백은 서버가 null로
        정규화해 위치를 지운다.
      properties:
        location:
          type: string
          nullable: true
          maxLength: 300
          example: 외벽 동측 12층 부근

    DefectActionResultRequest:
      type: object
      description: >
        조치 결과 등록 요청(HAJA-393/#725, targetStatus 도입 #1128). 4개 조치 필드는 폼상 전부 필수이며,
        targetStatus는 폼의 "진행상태" select 값이다.
      required: [actionMediaId, actionContent, actionDate, actionAssigneeId, targetStatus]
      properties:
        actionMediaId:
          type: integer
          format: int64
          description: 조치 후 사진 media id — 해당 하자와 같은 점검 소속이어야 한다(POST /api/inspections/{id}/media 업로드 결과)
          example: 4821
        actionContent:
          type: string
          maxLength: 2000
          description: 조치 내용(공백만 입력 불가)
          example: 균열부 에폭시 주입 후 표면 마감
        actionDate:
          type: string
          format: date
          example: "2026-07-28"
        actionAssigneeId:
          type: integer
          format: int64
          description: 조치 담당자 user id — GET /api/facilities/assignable-users 옵션 중 하나
          example: 12
        targetStatus:
          type: string
          enum: [IN_PROGRESS, RESOLVED]
          description: >
            전이 목표 상태. IN_PROGRESS/RESOLVED만 허용된다(DETECTED·CONFIRMED는 400). 현재 상태 기준
            정방향 한 단계만 가능 — CONFIRMED면 IN_PROGRESS, IN_PROGRESS면 RESOLVED.
          example: RESOLVED

    DefectPreviousDefectUpdateRequest:
      type: object
      description: 회차 간 대응 하자 확정 요청(HAJA-437).
      required: [previousDefectId]
      properties:
        previousDefectId:
          type: integer
          format: int64
          description: 같은 회사·같은 시설물·더 이전 회차의 하자 id
          example: 2871

    DefectApiResponse:
      type: object
      description: PATCH /api/defects/{id} 전용 Spring ApiResponse envelope
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/DefectDetailItem" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    DeletedDefectItem:
      type: object
      description: >
        오탐 삭제된 하자 1건(#1399). 하자 본문은 DefectDetailItem 을 그대로 재사용하고, 삭제 이력
        (defect_revisions, field_changed='is_deleted')에서 온 3필드를 덧붙인다.
        deletedByName 은 이력 시점의 이름이 아니라 **현재 이름**이며(이름 스냅샷을 이력에 남기지 않는
        기존 방식), 사용자를 찾을 수 없으면 null 이다.
      properties:
        defect: { $ref: "#/components/schemas/DefectDetailItem" }
        deletedReason: { type: string, nullable: true, maxLength: 500 }
        deletedAt: { type: string, format: date-time, nullable: true }
        deletedByName: { type: string, nullable: true }

    DeletedDefectListApiResponse:
      type: object
      description: GET /api/inspections/{id}/defects/deleted 전용 Spring ApiResponse envelope(페이지네이션 없음)
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/DeletedDefectItem" }
        error: { type: object, nullable: true, example: null }

    DefectRevisionRequest:
      type: object
      additionalProperties: false
      description: >
        grade·isDeleted 중 정확히 하나만 지정(둘 다 또는 둘 다 아님이면 400).
        isDeleted=true 는 오탐 삭제, **isDeleted=false 는 복구(되살리기)** 다(#1399 — 이전에는
        false 를 400으로 거부했다). 복구는 검수자가 오탐으로 지운 것만 가능하며(재분석 소프트삭제분은
        409 INVALID_STATE_TRANSITION), 삭제되지 않은 하자에 대한 복구 요청도 409다.
        복구도 삭제와 동일하게 사유가 필수이고 `defect_revisions`에 append-only 로 기록된다
        (old_value='true', new_value='false').
      required: [reason]
      properties:
        grade: { $ref: "#/components/schemas/DefectGradeCode" }
        isDeleted:
          type: boolean
          description: true=오탐 삭제 / false=복구(되살리기)
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: defect_revisions.reason — 오탐 삭제·복구/등급 조정 사유(검수 감사 추적)

    DefectCreateRequest:
      type: object
      additionalProperties: false
      description: >
        POST /api/inspections/{id}/defects 요청 DTO(HAJA-344 #622).
        type은 필수. bbox는 선택적이나 4개(bboxX, Y, W, H) 모두 지정하거나 모두 미지정해야 한다.
        grade는 선택적이며, 미지정 시 미검수 상태로 저장된다.
      required: [type]
      properties:
        type: { $ref: "#/components/schemas/DefectTypeCode" }
        bboxX: { type: number, format: double, nullable: true, description: 경계상자 X 좌표(0~1, 정규화) }
        bboxY: { type: number, format: double, nullable: true, description: 경계상자 Y 좌표(0~1, 정규화) }
        bboxW: { type: number, format: double, nullable: true, description: 경계상자 폭(0~1, 정규화) }
        bboxH: { type: number, format: double, nullable: true, description: 경계상자 높이(0~1, 정규화) }
        grade: { $ref: "#/components/schemas/NullableDefectGradeCode" }

    NlSearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 500
          description: 양끝 공백 제거 후 1~500자인 자연어 질의
          example: D등급 이상 조치 대기 하자

    NlSearchInternalRequest:
      type: object
      additionalProperties: false
      required: [query, referenceDate]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 500
          description: 양끝 공백 제거 후 1~500자인 자연어 질의
        referenceDate:
          type: string
          format: date
          description: Spring Boot가 KST Clock으로 산출한 상대 날짜 해석 기준일

    NlSearchFilters:
      type: object
      additionalProperties: false
      required:
        - type
        - grade
        - status
        - confidenceMin
        - inspectionType
        - inspectionStatus
        - inspectionDateFrom
        - inspectionDateTo
        - roundNoMin
        - roundNoMax
        - defectCountMin
        - defectCountMax
      properties:
        type:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/DefectTypeCode" }
        grade:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/DefectGradeCode" }
        status:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/DefectStatusCode" }
        confidenceMin:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
        inspectionType:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/InspectionTypeCode" }
        inspectionStatus:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/InspectionStatusCode" }
        inspectionDateFrom:
          type: string
          format: date
          nullable: true
          description: 점검일 시작일(포함)
        inspectionDateTo:
          type: string
          format: date
          nullable: true
          description: 점검일 종료일(포함)
        roundNoMin:
          type: integer
          minimum: 1
          nullable: true
        roundNoMax:
          type: integer
          minimum: 1
          nullable: true
        defectCountMin:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: 점검의 전체 비삭제 하자 건수 하한
        defectCountMax:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: 점검의 전체 비삭제 하자 건수 상한

    NlSearchResult:
      type: object
      additionalProperties: false
      required: [filters, unsupported_terms, clarifying_question, interpretation_confidence]
      properties:
        filters: { $ref: "#/components/schemas/NlSearchFilters" }
        unsupported_terms:
          type: array
          items: { type: string }
        clarifying_question:
          type: string
          nullable: true
        interpretation_confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1

    NlSearchAIResponse:
      type: object
      description: 내부 /ai/nl-search 전용 AIResponse envelope
      required: [success, data, usage, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/NlSearchResult" }
        usage:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/AIUsage" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/AIError" }

    NlSearchApiResponse:
      type: object
      description: 공개 /api/defects/nl-search 전용 Spring ApiResponse envelope
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/NlSearchResult" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    SourceCitation:
      type: object
      description: RAG 답변이 인용한 문서 1건. Chroma metadata `source`는 API 경계에서 `title`로 매핑한다.
      required: [doc_id, title, collection, locator, snippet, chunk_ref]
      properties:
        doc_id: { type: string, pattern: "^[1-9][0-9]*$", example: "42" }
        title: { type: string, minLength: 1, example: "시설물의 안전 및 유지관리에 관한 특별법" }
        collection: { type: string, enum: [regulations, defect_kb], example: regulations }
        locator: { type: string, minLength: 1, example: "제12조" }
        snippet: { type: string, minLength: 1, example: "관리주체는 시설물의 안전점검을 정기적으로 실시하여야 한다." }
        chunk_ref: { type: string, minLength: 1, example: "42_3" }

    RagAnswerData:
      type: object
      description: AIResponse.data 의 실제 형태(성공 시) — /ai/rag-chat
      required: [answer, sources]
      properties:
        answer: { type: string, example: "균열 보수는 손상 정도와 구조 안전성 평가 결과에 따라 보수 공법을 선택합니다." }
        sources:
          type: array
          items: { $ref: "#/components/schemas/SourceCitation" }

    DefectExplainRequest:
      type: object
      required: [defect_type, severity_grade, location, facility_type]
      properties:
        defect_type: { type: string, example: 철근 노출 }
        severity_grade: { type: string, enum: [A, B, C, D, E], example: D }
        location: { type: string, example: 교각 하부 }
        facility_type: { type: string, example: 교량 }

    DefectExplain:
      type: object
      description: AIResponse.data 의 실제 형태(성공 시)
      properties:
        cause: { type: string, description: 추정 원인 }
        risk: { type: string, description: 방치 시 위험 }
        action: { type: string, description: 조치 방안 }

    ReportDefectInput:
      type: object
      required: [defect_type, location, severity_grade, description]
      properties:
        defect_type: { type: string, example: 균열 }
        location: { type: string, example: 1동 1층 기둥 }
        severity_grade: { type: string, enum: [A, B, C, D, E], example: B }
        description: { type: string, example: 기둥 표면 수평 균열 }

    ReportGenerateRequest:
      type: object
      description: >
        correlation 필드 3개는 모두 함께 제공하거나 모두 생략한다. 모두 생략하면 기존 호환 경로이며,
        모두 제공하면 응답에 같은 값과 content_hash가 포함된다. 현재 값의 서버 발급·점검 귀속은 강제되지 않는다.
      required: [facility_info, confirmed_defects]
      properties:
        facility_info:
          type: object
          required: [name, location]
          properties:
            name: { type: string, example: Haja APT }
            location: { type: string, example: 서울시 }
        confirmed_defects:
          type: array
          maxItems: 100
          items:
            { $ref: "#/components/schemas/ReportDefectInput" }
        on_mismatch:
          type: string
          enum: [regenerate, warn]
          default: regenerate
        grounding_request_id:
          type: string
          minLength: 1
          description: 선택적 correlation 요청 ID. inspection_id, report_version과 함께 제공해야 한다.
          example: rpt-01J2Y8A7M6
        inspection_id:
          type: integer
          format: int64
          minimum: 1
          description: 선택적 점검 ID. 다른 correlation 필드와 함께 제공해야 한다.
          example: 42
        report_version:
          type: integer
          minimum: 1
          description: 선택적 보고서 업무 버전. 다른 correlation 필드와 함께 제공해야 한다.
          example: 3

    ReportOverview:
      type: object
      required: [purpose, facility_summary, scope]
      properties:
        purpose: { type: string }
        facility_summary: { type: string }
        scope: { type: string }

    ReportSummary:
      type: object
      required: [overall_opinion, total_count, count_by_grade, key_findings]
      properties:
        overall_opinion: { type: string }
        total_count: { type: integer, minimum: 0 }
        count_by_grade:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        key_findings:
          type: array
          items: { type: string }

    ReportDetailItem:
      type: object
      required: [defect_type, location, severity_grade, description, cause]
      properties:
        defect_type: { type: string }
        location: { type: string }
        severity_grade: { type: string, enum: [A, B, C, D, E] }
        description: { type: string }
        cause: { type: string }

    ReportRecommendationItem:
      type: object
      required: [target, method, priority, legal_basis, legal_basis_verified]
      properties:
        target: { type: string }
        method: { type: string }
        priority: { type: string }
        legal_basis: { type: string }
        legal_basis_verified: { type: boolean }

    ReportGenerateData:
      type: object
      required: [overview, summary, detail, recommendation, grounding_ok]
      properties:
        overview: { $ref: "#/components/schemas/ReportOverview" }
        summary: { $ref: "#/components/schemas/ReportSummary" }
        detail:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/ReportDetailItem" }
        recommendation:
          type: object
          required: [items, monitoring_points]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/ReportRecommendationItem" }
            monitoring_points:
              type: array
              items: { type: string }
        grounding_ok: { type: boolean }
        grounding_request_id:
          type: string
          minLength: 1
          description: correlation 요청에서 세 필드를 모두 제공한 경우에만 존재한다.
        inspection_id:
          type: integer
          format: int64
          minimum: 1
          description: correlation 요청에서 세 필드를 모두 제공한 경우에만 존재한다.
        report_version:
          type: integer
          minimum: 1
          description: correlation 요청에서 세 필드를 모두 제공한 경우에만 존재한다.
        content_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: correlation 필드를 제외한 보고서 본문 canonical JSON의 SHA-256 hex.

    ReportAIResponse:
      type: object
      required: [success, data, usage, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          allOf:
            - { $ref: "#/components/schemas/ReportGenerateData" }
        usage:
          nullable: true
          allOf:
            - { $ref: "#/components/schemas/AIUsage" }
        error:
          nullable: true
          allOf:
            - { $ref: "#/components/schemas/AIError" }

    FastApiValidationError:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
            additionalProperties: true

    # ── grounding-check (구현됨, ai-server/ai/core/grounding.py) ──
    GroundingDefect:
      type: object
      description: 대조 기준이 되는 실측 하자 1건
      required: [defect_type, grade]
      properties:
        defect_type: { type: string, example: 균열 }
        grade: { type: string, enum: [A, B, C, D, E], example: B }

    GroundingClaims:
      type: object
      description: 생성물(LLM 출력)이 주장하는 수치·등급 — 체인의 structured output에서 채운다
      properties:
        total_count: { type: integer, nullable: true, example: 1 }
        count_by_grade:
          type: object
          additionalProperties: { type: integer }
          example: { "B": 1 }
        count_by_type:
          type: object
          additionalProperties: { type: integer }
          example: { "균열": 1 }
        mentioned_grades:
          type: array
          items: { type: string }
          example: ["B"]

    GroundingCheckRequest:
      type: object
      required: [defects, claims]
      properties:
        defects:
          type: array
          items: { $ref: "#/components/schemas/GroundingDefect" }
        claims: { $ref: "#/components/schemas/GroundingClaims" }
        on_mismatch:
          type: string
          enum: [regenerate, warn]
          default: regenerate
          description: 불일치 발생 시 조치 — REGENERATE(재생성 권고) | WARN(경고 배지)

    GroundingCheckItem:
      type: object
      properties:
        field: { type: string, example: "grade:B" }
        claimed: { type: string, example: "1" }
        actual: { type: string, example: "1" }
        status: { type: string, enum: [MATCH, MISMATCH, UNVERIFIABLE] }
        detail: { type: string }

    GroundingResult:
      type: object
      description: AIResponse.data 의 실제 형태(성공 시) — grounded=True 라도 action!=PASS 면 경고 배지 필요(#121)
      properties:
        grounded: { type: boolean }
        action: { type: string, enum: [PASS, REGENERATE, WARN] }
        ground_truth:
          type: object
          properties:
            total_count: { type: integer }
            count_by_grade:
              type: object
              additionalProperties: { type: integer }
            count_by_type:
              type: object
              additionalProperties: { type: integer }
        checks:
          type: array
          items: { $ref: "#/components/schemas/GroundingCheckItem" }
        mismatches:
          type: array
          items: { $ref: "#/components/schemas/GroundingCheckItem" }
        unverifiable:
          type: array
          items: { $ref: "#/components/schemas/GroundingCheckItem" }

    # ── briefing (구현됨, ai-server/ai/chains/briefing_chain.py) ──
    DashboardStats:
      type: object
      description: 대시보드 현황 데이터(브리핑 입력) — 값은 백엔드 집계 실측치
      required:
        [
          total_facilities,
          monthly_analysis,
          pending_review,
          pending_action,
          this_week_defects,
          last_week_defects,
          top_defect_type,
          critical_defects,
        ]
      properties:
        total_facilities: { type: integer, example: 12 }
        monthly_analysis: { type: integer, example: 34 }
        pending_review: { type: integer, example: 5 }
        pending_action: { type: integer, example: 2 }
        this_week_defects: { type: integer, example: 8 }
        last_week_defects: { type: integer, example: 10 }
        top_defect_type: { type: string, example: 균열 }
        critical_defects: { type: integer, example: 1 }
        grade_distribution:
          type: object
          additionalProperties: { type: integer }
          example: { "A": 3, "B": 4, "C": 1 }

    WeeklyBriefing:
      type: object
      description: AIResponse.data 의 실제 형태(성공 시)
      properties:
        briefing: { type: string, description: "카드 본문(2~4문장)" }
        recommendation: { type: string, description: "권고 조치(1~2문장)" }
        facts:
          type: object
          description: 코드로 계산한 파생 사실(프론트 배지용)
          properties:
            this_week_defects: { type: integer }
            last_week_defects: { type: integer }
            change_pct: { type: integer, nullable: true }
            trend: { type: string, enum: [감소, 증가, 유지] }
            top_defect_type: { type: string }
            critical_defects: { type: integer }

    # ── 기업 인증 (구현됨, backend/auth) ──
    CompanySignupRequest:
      type: object
      description: multipart/form-data(@ModelAttribute) — 약관 버전은 서버 소유, 클라이언트는 동의 여부만 전송
      required:
        [
          email,
          password,
          companyName,
          businessRegistrationNumber,
          representativeName,
          businessStartDate,
          address,
          agreeTermsOfService,
          agreePrivacyPolicy,
        ]
      properties:
        email: { type: string, format: email, example: company@haja.com }
        password: { type: string, format: password, description: "8자 이상, 영문+숫자 포함", example: "pw123456" }
        companyName: { type: string, maxLength: 200, example: "(주)하자체크" }
        businessRegistrationNumber: { type: string, pattern: '\d{3}-?\d{2}-?\d{5}', example: "123-45-67890" }
        representativeName: { type: string, maxLength: 100, example: 김민수 }
        businessStartDate:
          type: string
          format: date
          description: "개업일자(ISO yyyy-MM-dd). 국세청 진위확인(번호+대표자명+개업일자)에 사용. OCR 자동채움 또는 수기 입력."
          example: "2020-01-15"
        address: { type: string, maxLength: 300, example: 서울시 강남구 ... }
        addressDetail: { type: string, maxLength: 200, nullable: true }
        agreeTermsOfService: { type: boolean }
        agreePrivacyPolicy: { type: boolean }
        businessRegistrationFile:
          type: string
          format: binary
          description: "필수, MIME∈{image/jpeg,image/png,application/pdf}, ≤10MB"

    CompanySignupResponse:
      type: object
      description: signupToken 은 가입 상태조회용 불투명 랜덤 문자열(PK 비노출). status 는 자동승인(#1324)이라 항상 APPROVED.
      properties:
        companyId: { type: integer, format: int64, example: 1 }
        maskedEmail: { type: string, example: "h***@c***.com" }
        status: { type: string, enum: [PENDING_REVIEW, APPROVED, REJECTED], example: APPROVED }
        signupToken: { type: string }

    CompanySignupApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/CompanySignupResponse" }
        error: { type: object, nullable: true, example: null }

    EmailAvailabilityResponse:
      type: object
      properties:
        available: { type: boolean }

    EmailAvailabilityApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/EmailAvailabilityResponse" }
        error: { type: object, nullable: true, example: null }

    BusinessLicenseOcrProxyResponse:
      type: object
      description: >
        공개 프록시가 FE에 반환하는 4필드(ai-server raw 신뢰도·stub 등 부가필드는 화이트리스트로 제거).
        인식 실패한 필드는 null — FE는 수동 입력으로 폴백.
      properties:
        businessRegistrationNumber: { type: string, nullable: true, example: "123-45-67890" }
        companyName: { type: string, nullable: true, example: "하자첵 주식회사" }
        representativeName: { type: string, nullable: true, example: "홍길동" }
        businessStartDate: { type: string, format: date, nullable: true, description: "개업일자(ISO yyyy-MM-dd). 국세청 진위확인(#596)용. 인식 실패 시 null.", example: "2020-01-15" }

    BusinessLicenseOcrProxyApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/BusinessLicenseOcrProxyResponse" }
        error: { type: object, nullable: true, example: null }

    SignupStatusResponse:
      type: object
      description: rejectionReason 은 REJECTED 일 때만 존재
      properties:
        status: { type: string, enum: [PENDING_REVIEW, APPROVED, REJECTED] }
        companyName: { type: string }
        rejectionReason: { type: string, nullable: true }

    SignupStatusApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/SignupStatusResponse" }
        error: { type: object, nullable: true, example: null }

    FindIdRequest:
      type: object
      description: representativeName·companyName 중 최소 1개 필수(@AssertTrue)
      required: [businessRegistrationNumber]
      properties:
        businessRegistrationNumber: { type: string, example: "123-45-67890" }
        representativeName: { type: string, nullable: true, example: 김민수 }
        companyName: { type: string, nullable: true, example: "(주)하자체크" }

    FindIdResponse:
      type: object
      properties:
        maskedEmail: { type: string, example: "h***@c***.com" }

    FindIdApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/FindIdResponse" }
        error: { type: object, nullable: true, example: null }

    # ── notification 도메인 (AP-020, #25 / HAJA-38 FR-9) ──
    NotificationTypeCode:
      type: string
      description: >
        PLAN_EXPIRED(#1145 / HAJA-549) — 구독 결제 주기 만료로 FREE 자동 강등됐음을 알린다.
        수신자는 회사 구독이면 회사 owner, 개인 구독이면 구독 소유자다. payload는
        {previousPlanName, newPlanName, periodEndAt, suspendedSeatCount} 형태다.
      enum: [ANALYSIS_DONE, REVIEW_PENDING, COUNSEL_REPLIED, INSPECTION_DUE, PLAN_EXPIRED]

    NotificationResponse:
      type: object
      additionalProperties: false
      required: [id, type, isRead, createdAt]
      description: >
        payload는 jsonb 원본을 이스케이프된 문자열이 아니라 구조화된 JSON 객체로 그대로 노출한다
        (알림 유형별로 표시·이동에 쓰는 부가 데이터 — 스키마는 유형마다 달라 자유 객체로 둔다).
      properties:
        id: { type: integer, format: int64, example: 1 }
        type: { $ref: "#/components/schemas/NotificationTypeCode" }
        payload:
          type: object
          nullable: true
          additionalProperties: true
          example: { inspectionId: 10 }
        isRead: { type: boolean, example: false }
        createdAt: { type: string, format: date-time }

    NotificationListApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          type: array
          items: { $ref: "#/components/schemas/NotificationResponse" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    # ── ai-server OCR (실구현, ai-server/routers/ai_router.py, #552 / HAJA-321) ──
    BusinessLicenseOcrRequest:
      type: object
      description: >
        image_base64 필수(사업자등록증 이미지의 base64). max_length=14000000 —
        FE 업로드 상한 10MB 의 base64 인코딩 상당치(초과 시 요청 파싱 단계 422). file_ref 는 미구현(seam only).
      required: [image_base64]
      properties:
        image_base64: { type: string, nullable: true, maxLength: 14000000 }
        file_ref: { type: string, nullable: true }

    BusinessLicenseOcrData:
      type: object
      description: >
        AIResponse.data 형태. 인식 실패한 필드는 null. raw 는 개인정보 노출 방지를 위해 OCR 원문 대신
        집계값(lineCount·avgConfidence)만 담는다. stub 은 실구현 후 항상 false.
      required: [businessRegistrationNumber, companyName, representativeName, raw, stub]
      properties:
        businessRegistrationNumber: { type: string, nullable: true, example: "123-45-67890" }
        companyName: { type: string, nullable: true, example: "하자첵 주식회사" }
        representativeName: { type: string, nullable: true, example: "홍길동" }
        businessStartDate: { type: string, format: date, nullable: true, example: "2020-01-15" }
        raw:
          type: object
          example: { lineCount: 12, avgConfidence: 0.93 }
        stub: { type: boolean, example: false }

    BusinessLicenseOcrAIResponse:
      type: object
      description: 내부 /ai/business-license-ocr 전용 AIResponse envelope(성공 시 success=true, 실패 시 error)
      required: [success, data, error]
      properties:
        success: { type: boolean, example: true }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/BusinessLicenseOcrData" }
        usage:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/AIUsage" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/AIError" }

    # ── 계정복구 — 비밀번호 재설정 (구현됨, backend/auth, #194 / HAJA-172) ──
    PasswordResetLinkRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, example: company@haja.com }

    PasswordResetLinkResponse:
      type: object
      description: >
        계정 존재 여부와 무관하게 항상 동일한 값(계정 열거 방지). resetToken 은 절대 포함하지 않는다
        (메일로만 전달).
      required: [requested]
      properties:
        requested: { type: boolean, example: true }

    PasswordResetLinkApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/PasswordResetLinkResponse" }
        error: { type: object, nullable: true, example: null }

    PasswordResetRequest:
      type: object
      description: newPassword 정책은 가입(CompanySignupRequest.password)과 동일 — 8자 이상, 영문+숫자 포함.
      required: [token, newPassword]
      properties:
        token: { type: string, description: 메일 링크의 1회용 재설정 토큰 }
        newPassword: { type: string, format: password, minLength: 8, example: "newPw123456" }

    PasswordResetResponse:
      type: object
      required: [reset]
      properties:
        reset: { type: boolean, example: true }

    PasswordResetApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/PasswordResetResponse" }
        error: { type: object, nullable: true, example: null }

    PasswordChangeRequest:
      type: object
      description: >
        로그인 상태 비밀번호 변경(#1315). newPassword 정책은 가입(CompanySignupRequest.password)·
        재설정(PasswordResetRequest.newPassword)과 동일 — 8자 이상, 영문+숫자 포함.
        currentPassword 는 재인증용이며 형식 제약을 두지 않는다(사유는 경로 description 참조).
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password, description: 현재 비밀번호(재인증) }
        newPassword: { type: string, format: password, minLength: 8, example: "newPw123456" }

    # ── 마이페이지(멤버십) — 내 플랜·사용량·좌석 (구현됨, backend/membership, HAJA-177) ──
    MyPlanResponse:
      type: object
      required: [plan, limits, usage]
      properties:
        plan:
          type: object
          required: [name, priceMonthly, status, nextBillingDate, businessVerified]
          properties:
            name: { type: string, enum: [FREE, STANDARD, ENTERPRISE], example: STANDARD }
            priceMonthly: { type: number, example: 99000 }
            status: { type: string, enum: [ACTIVE, EXPIRED, UPGRADE_REQUESTED], example: ACTIVE }
            paymentPendingUntil:
              type: string
              format: date-time
              nullable: true
              description: >
                미결제 유예 마감(#1177). NULL = 정상. 값이 있으면 **유료→유료 하향 예약이 적용됐으나 아직
                정산 결제가 되지 않은 상태**이며, 그 시각까지 결제하지 않으면 FREE 로 강등된다.


                ⚠️ 유예 중에는 `limits.*` 와 요금제 기능 플래그(상담사 연결·AI 부가기능)가 **FREE 기준**으로
                내려간다 — `name` 은 구독 요금제(예: STANDARD)를 그대로 보여주므로, 이 필드가 없으면 화면은
                "STANDARD 인데 좌석 한도가 1"이라는 모순을 설명할 수 없다. 유예 진입 시점에 초과 좌석이
                FREE 기준으로 정지되며, 결제해도 정지된 구성원은 자동 복구되지 않는다(재활성화 필요).
              example: "2026-08-05T00:00:00Z"
            nextBillingDate:
              type: string
              format: date
              nullable: true
              description: >
                `user_plans.current_period_end`(#1104/HAJA-525 로 실체화된 컬럼)를 KST 날짜로 노출한다.
                FREE 플랜이면 null(무기한, #711). 과거처럼 `startedAt + 1개월`을 조회 시점에 파생 계산하지
                않는다 — 결제 승인 전이 시 리셋(now~now+1개월)되고 관리자 플랜 변경(무결제) 시에는 기존
                주기가 승계되므로, 유료여도 startedAt 과 무관한 값일 수 있다.
              example: "2026-08-15"
            businessVerified:
              type: boolean
              nullable: true
              description: >
                **국세청 진위확인을 통과했음을 증명할 수 있는가**(#1324 재정의). 회사 구독이면 boolean,
                개인 구독(companyId=null)이면 사업자 인증 개념이 없으므로 null(#711).
                판정 근거는 companies.verification_status 가 **아니라** 진위확인 provenance
                (companies.business_registration_ocr_raw.ntsOutcome)다 — 가입 즉시 자동승인(#1324)으로
                verification_status 는 전건 VERIFIED 가 되어 "회사 승인 상태"만 뜻하게 됐고, 그 값으로
                배지를 켜면 국세청 장애·키 미설정으로 통과한 회사(SKIPPED)와 소급 승인분에까지
                "사업자 인증 완료"라는 허위 표시가 나간다.
                true = ntsOutcome ∈ {VERIFIED(가입 시 국세청 성공), LEGACY_VERIFIED(#1324 이전 검증분)}.
                그 밖의 값·키 부재·JSON 파손은 모두 false(fail-safe — 증명할 수 없으면 인증 완료라고
                말하지 않는다).
              example: true
        limits:
          type: object
          description: plans.max_* 가 null(무제한)이면 null 을 그대로 반환한다.
          required: [maxFacilities, maxMonthlyAnalyses, maxSeats]
          properties:
            maxFacilities: { type: integer, nullable: true, example: 20 }
            maxMonthlyAnalyses: { type: integer, nullable: true, example: 100 }
            maxSeats: { type: integer, nullable: true, example: 5 }
        usage:
          type: object
          required: [facilityCount, analyzedImageCount, seatCount, period]
          properties:
            facilityCount: { type: integer, example: 3 }
            analyzedImageCount: { type: integer, example: 12 }
            seatCount: { type: integer, example: 2 }
            period: { type: string, format: date, description: "집계 기준월 1일(KST)", example: "2026-07-01" }

    PaymentOrderResponse:
      type: object
      description: >
        결제 주문 선등록 결과(#988). 상향 결제는 잔여 기간 일할 크레딧을 차감한다(#1146 / HAJA-550,
        B안 — 잔여 크레딧 차감 + 주기 리셋). `listPrice - credit == amount` 가 항상 성립한다.
        `amount` 는 이 시점에 확정돼 `payments` 행에 스냅샷으로 굳으며, 승인 단계에서 재계산하지 않는다.
      required: [orderId, planName, listPrice, credit, amount, orderName]
      properties:
        orderId: { type: string, description: 서버 발급 주문 식별자(UUID), example: "b1e4f0c2-..." }
        planName: { type: string, enum: [STANDARD, ENTERPRISE] }
        listPrice:
          type: integer
          format: int64
          description: 대상 플랜 정가(plans.price_monthly, 크레딧 차감 전)
          example: 100000
        credit:
          type: integer
          format: int64
          description: >
            잔여 기간 일할 크레딧(차감액, 0 이상). 현재 플랜 정가 × 잔여일/주기일수(KST 기준 달력일,
            원 단위 내림) — 단, 그 구독에 실제로 연결된 PAID 결제 합계를 넘지 않는다(무결제 구독·V27
            백필 추정치·모의 결제 시절 구독은 크레딧 0, 정가 인상 후에도 실제로 낸 금액이 상한).
            current_period_end/start 가 없거나(FREE·주기 정보 없음) 만료가 지났으면 0. 최소 결제금액
            (100원) 가드로 amount 가 올림 조정된 경우 그 조정 후 값 기준으로 역산한다.
          example: 15000
        amount:
          type: integer
          format: int64
          description: >
            결제 금액(원) — 서버 결정값(listPrice - credit, 토스 최소 결제금액 100원 미만이면 100원으로
            올림)
          example: 85000
        orderName: { type: string, description: 결제창 표시용 주문명, example: "HajaCheck STANDARD 플랜 구독" }

    PaymentOrderApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/PaymentOrderResponse" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    PaymentHistoryItem:
      type: object
      description: 결제 이력 1건(#988). paymentKey 는 노출하지 않는다.
      required: [id, orderId, planName, amount, status]
      properties:
        id: { type: integer, format: int64 }
        orderId: { type: string }
        planName: { type: string, enum: [FREE, STANDARD, ENTERPRISE] }
        amount: { type: integer, format: int64, description: 결제 시점 금액 스냅샷(원) }
        status: { type: string, enum: [READY, PAID, FAILED, CANCELED] }
        method: { type: string, nullable: true, enum: [CARD], description: 승인 전에는 null }
        approvedAt: { type: string, format: date-time, nullable: true }
        receiptUrl: { type: string, nullable: true }

    PaymentHistoryResponse:
      type: object
      required: [payments]
      properties:
        payments:
          type: array
          items: { $ref: "#/components/schemas/PaymentHistoryItem" }

    PaymentHistoryApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/PaymentHistoryResponse" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    MyPlanApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/MyPlanResponse" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    SeatsResponse:
      type: object
      description: >
        개인 사용자는 본인 1인만 담은 목록(used=1)을 반환한다. 이메일은 회사 내부 팀 명부이므로
        비마스킹(동일 회사 소속만 조회 가능).
      required: [used, limit, members]
      properties:
        used: { type: integer, description: "회사 소속 ACTIVE 사용자 총원 수(목록 상한과 무관한 정확한 count)", example: 3 }
        limit: { type: integer, nullable: true, example: 5 }
        members:
          type: array
          maxItems: 200
          items:
            type: object
            required: [userId, name, email, role, status]
            properties:
              userId: { type: integer, format: int64, example: 1 }
              name: { type: string, example: 김민수 }
              email: { type: string, example: member@haja.com }
              role: { type: string, enum: [ADMIN, INSPECTOR, USER, COUNSELOR, PLATFORM_ADMIN], example: USER }
              status: { type: string, enum: [ACTIVE, SUSPENDED, WITHDRAWN], example: ACTIVE }

    SeatsApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/SeatsResponse" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    UpgradeInquiryResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ACTIVE, EXPIRED, UPGRADE_REQUESTED], example: UPGRADE_REQUESTED }

    UpgradeInquiryApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/UpgradeInquiryResponse" }
        error: { type: object, nullable: true, example: null }

    # ── 관리자 플랜·쿼터 관리 (구현됨, backend/admin, FR-8-A #507 / HAJA-258) ──
    AdminPlanItem:
      type: object
      description: 요금제 카탈로그 항목. max_* 는 무제한이면 null.
      required:
        [id, name, maxFacilities, maxMonthlyAnalyses, maxSeats, hasPdfWatermark, hasCounselorAccess, hasAiAddon, priceMonthly]
      properties:
        id: { type: integer, format: int64, example: 2 }
        name: { type: string, enum: [FREE, STANDARD, ENTERPRISE], example: STANDARD }
        maxFacilities: { type: integer, nullable: true, example: 10 }
        maxMonthlyAnalyses: { type: integer, nullable: true, example: 300 }
        maxSeats: { type: integer, nullable: true, example: 5 }
        hasPdfWatermark: { type: boolean, example: false }
        hasCounselorAccess: { type: boolean, example: true }
        hasAiAddon: { type: boolean, example: true }
        priceMonthly: { type: number, nullable: true, example: 29000 }

    AdminPlanCatalogResponse:
      type: object
      required: [plans]
      properties:
        plans:
          type: array
          items: { $ref: "#/components/schemas/AdminPlanItem" }

    AdminPlanCatalogApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/AdminPlanCatalogResponse" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    AdminPlanResponse:
      type: object
      description: >
        회사 귀속 현재 구독의 요금제·상태·이번 달 사용량. usage 는 usage_counters 를 읽기만 하며(집계 증가는
        QuotaInterceptor 책임) 당월 집계 행이 없으면 0.
      required: [subscriptionId, plan, status, startedAt, usage]
      properties:
        subscriptionId: { type: integer, format: int64, example: 41 }
        plan: { $ref: "#/components/schemas/AdminPlanItem" }
        status: { type: string, enum: [ACTIVE, EXPIRED, UPGRADE_REQUESTED], example: ACTIVE }
        startedAt: { type: string, format: date-time, example: "2026-07-21T09:00:00Z" }
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
          description: >
            현재 결제 주기 종료 시각(#1104). NULL = 무기한(FREE). 하향 예약(#1105)의 적용 예정일이 곧 이 값이라,
            화면이 "언제부터 적용되는지"를 별도 조회 없이 표시할 수 있게 함께 내려준다.
          example: "2026-08-21T09:00:00Z"
        scheduledChange:
          nullable: true
          allOf:
            - { $ref: "#/components/schemas/AdminScheduledPlanChangeResponse" }
          description: "대기 중인 하향 예약(#1105). 없으면 null — 프론트는 이 필드의 존재로 예약 유무를 판정한다."
        usage:
          type: object
          required: [analyzedImageCount, analysisRequestCount, facilityCount, seatCount, period]
          properties:
            analyzedImageCount: { type: integer, example: 12 }
            analysisRequestCount: { type: integer, example: 8 }
            facilityCount: { type: integer, example: 3 }
            seatCount: { type: integer, example: 2 }
            period: { type: string, format: date, description: "집계 기준월 1일(KST)", example: "2026-07-01" }

    AdminScheduledPlanChangeRequest:
      type: object
      description: >
        하향 예약 생성 요청(#1105). 상향은 이 경로로 받지 않는다 — 즉시 적용 + 결제가 필요하므로
        `PLAN_SCHEDULE_NOT_DOWNGRADE`(403)로 거절한다.
      required: [planName]
      properties:
        planName: { type: string, enum: [FREE, STANDARD, ENTERPRISE], example: STANDARD }
        confirmOverflow:
          type: boolean
          nullable: true
          description: "한도 초과(좌석·시설물)를 확인했는지. 초과가 있는데 false/미지정이면 PLAN_DOWNGRADE_CONFIRMATION_REQUIRED(409)."
          example: true
        keepUserIds:
          type: array
          maxItems: 200
          nullable: true
          items: { type: integer, format: int64 }
          description: >
            좌석 초과 시 유지할 구성원. 미지정이면 자동 규칙(owner 우선). ⚠️ 이 목록은 예약 실행 시점까지
            보관되므로, 실행 시 퇴사·정지·타사 이동한 id는 드롭하고 owner 우선으로 자동 보충한다.
          example: [7, 12]

    AdminScheduledPlanChangeResponse:
      type: object
      description: "하향 예약 상태(#1105)."
      required: [id, targetPlanName, effectiveAt, keepUserIds, status]
      properties:
        id: { type: integer, format: int64, example: 5 }
        targetPlanName: { type: string, enum: [FREE, STANDARD, ENTERPRISE], example: STANDARD }
        effectiveAt:
          type: string
          format: date-time
          description: "적용 예정 시각 = 신청 시점의 current_period_end. 그때까지는 기존 플랜이 그대로 유지된다."
          example: "2026-08-21T09:00:00Z"
        keepUserIds:
          type: array
          items: { type: integer, format: int64 }
          example: [7, 12]
        status: { type: string, enum: [PENDING, APPLIED, CANCELED, FAILED], example: PENDING }

    AdminScheduledPlanChangeApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/AdminScheduledPlanChangeResponse" }
        error: { type: object, nullable: true, example: null }

    AdminPlanApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/AdminPlanResponse" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    AdminPlanChangeRequest:
      type: object
      required: [planName]
      properties:
        planName: { type: string, enum: [FREE, STANDARD, ENTERPRISE], example: STANDARD }
        confirmOverflow:
          type: boolean
          default: false
          description: >
            하향으로 한도를 넘게 되는 자원이 있을 때만 의미가 있다(#890). 초과가 있는데 true 가 아니면
            서버는 아무것도 바꾸지 않고 409(PLAN_DOWNGRADE_CONFIRMATION_REQUIRED)로 거절한다 —
            관리자가 모르는 사이에 구성원이 정지되는 것을 막는 안전장치다. 초과가 없으면 이 값과 무관하게
            그대로 변경된다.
          example: false
        keepUserIds:
          type: array
          items: { type: integer, format: int64 }
          description: >
            하향으로 좌석이 넘칠 때 **관리자가 직접 유지할 구성원**(#890 Phase 2). 미지정이면 기존 동작인
            id 오름차순(오래된 계정 유지)으로 자동 선정한다. owner 는 이 목록과 무관하게 항상 유지된다.
            검증: 요청자 회사의 ACTIVE 구성원이 아니면 PLAN_KEEP_USER_INVALID(403, 어느 id가 문제인지는 밝히지 않는다) · 선택 인원이 대상 요금제
            좌석 수를 넘으면 PLAN_SEAT_QUOTA_EXCEEDED(403) · 선택 결과로 ACTIVE 관리자가 0명이 되면
            ADMIN_PROTECTED_ACCOUNT(409).
          example: [12, 34]

    AdminPlanChangePreviewResponse:
      type: object
      description: >
        이 요금제로 바꾸면 무엇이 정지·읽기전용이 되는지 미리 본다(#890). 부작용이 없는 조회다.
        seatsToSuspend 에 owner 는 절대 포함되지 않는다(정지되면 회사가 관리 불능).
      required: [targetPlan, requiresConfirmation, seatsToSuspend, facilityOverflowCount]
      properties:
        targetPlan: { type: string, enum: [FREE, STANDARD, ENTERPRISE], example: FREE }
        requiresConfirmation:
          type: boolean
          description: true 면 PATCH 요청에 confirmOverflow=true 를 실어야 실제 변경된다.
          example: true
        seatsToSuspend:
          type: array
          description: 정지될 구성원(id 오름차순). 이름·이메일까지 주는 이유는 "3명 정지"만으로는 관리자가 판단할 수 없기 때문이다.
          items:
            type: object
            required: [userId, name, email]
            properties:
              userId: { type: integer, format: int64, example: 42 }
              name: { type: string, example: 김점검 }
              email: { type: string, format: email, example: inspector@haja.test }
        facilityOverflowCount:
          type: integer
          description: >
            대상 요금제 기준 읽기 전용 시설물 **총량**(이번에 새로 바뀌는 증분이 아니다 — 이전 하향으로
            이미 읽기전용이던 것도 포함). 조회·기존 점검 이력은 유지되고 신규 점검 생성만 차단된다.
          example: 10

    AdminPlanChangePreviewApiResponse:
      type: object
      description: >
        성공 envelope — data=AdminPlanChangePreviewResponse. (원래 존재하지 않는
        `ApiResponseBase` 를 allOf 로 참조해 스펙이 깨져 있던 것을 다른 envelope 들과 동일한 형태로 정정.)
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/AdminPlanChangePreviewResponse" }
        error: { type: object, nullable: true, example: null }

