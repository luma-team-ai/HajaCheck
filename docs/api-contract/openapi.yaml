      description: >
        법규·지침 PDF 문서와 임베딩 상태를 최신 등록순으로 반환한다(PLATFORM_ADMIN 전용 —
        `/api/admin/rag-documents/**` 는 SecurityConfig 필터에서 hasRole(PLATFORM_ADMIN) 로 강제하며,
        `/api/admin/**`(ADMIN 전용)과는 별개 인가 경계다). company 스코핑은 없다 — 법규·지침 문서는
        회사 소유 리소스가 아니라 플랫폼 전체가 공유하는 지식베이스 원본이다.
        `RagDocumentController.list` 구현됨.
      security:
        - SessionCookie: []
      tags: [admin]
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RagDocumentListApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: PLATFORM_ADMIN 아님 (FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

    post:
      summary: RAG 문서 업로드 (플랫폼 관리자 콘솔, #22/HAJA-35, multipart/form-data)
      description: >
        법규·지침 PDF를 업로드해 텍스트를 추출하고 AI 서버 임베딩 파이프라인을 실행한다
        (PLATFORM_ADMIN 전용). 텍스트가 없는 PDF는 파일 저장 자체를 하지 않고 실패한다
        (RAG_TEXT_EXTRACTION_FAILED, 400). AI 서버 임베딩 실패는 업로드 자체를 실패시키지 않는다 —
        생성된 문서는 embeddingStatus=FAILED로 남고 재임베딩(`POST /{id}/re-embed`)으로 복구한다.
        `RagDocumentController.upload` 구현됨.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [admin]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, title, sourceType, targetCollection]
              properties:
                file: { type: string, format: binary, description: "PDF 원본(application/pdf, 최대 20MB)" }
                title: { type: string, maxLength: 300 }
                sourceType: { type: string, enum: [LAW, GUIDELINE] }
                targetCollection: { type: string, enum: [REGULATIONS, DEFECT_KB] }
                effectiveDate: { type: string, format: date, nullable: true }
                publisher: { type: string, maxLength: 200, nullable: true }
                authoredAt: { type: string, format: date, nullable: true }
      responses:
        "201":
          description: 업로드 성공(생성 직후 상태 — 임베딩은 비동기로 계속 진행될 수 있음)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RagDocumentApiResponse" }
        "400":
          description: >
            입력값 검증 실패(INVALID_INPUT) | 파일 누락(FILE_REQUIRED) |
            PDF 텍스트 추출 실패(RAG_TEXT_EXTRACTION_FAILED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
