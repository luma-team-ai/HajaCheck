          items: { $ref: "#/components/schemas/CompanyOptionResponse" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    PlatformAdminServiceStatsKpi:
      type: object
      description: >
        analysisRequests 필드명은 유지하지만 값은 요청 건수가 아니라 분석한 이미지 장수다(#1407 후속).
        analysisRequests/counselCount는 최근 6개월 추이 윈도우 누적치로 monthlySummary 각 행의
        analysisCount/counselCount 합계와 항상 일치한다.
      required: [totalSubscribers, totalSubscribersDelta, newSubscribersThisMonth,
        newSubscribersChangePercent, analysisRequests, counselCount]
      properties:
        totalSubscribers: { type: integer, format: int64, example: 320 }
        totalSubscribersDelta: { type: integer, format: int64, example: 12 }
        newSubscribersThisMonth: { type: integer, format: int64, example: 28 }
        newSubscribersChangePercent: { type: integer, example: 15 }
        analysisRequests: { type: integer, format: int64, description: "분석한 이미지 장수(요청 건수 아님)", example: 4820 }
        counselCount: { type: integer, format: int64, example: 96 }

    PlatformAdminSubscriberTrendPoint:
      type: object
      required: [month, subscribers]
      properties:
        month: { type: string, example: "2026-07" }
        subscribers: { type: integer, format: int64, example: 320 }

    PlatformAdminAnalysisRequestTrendPoint:
      type: object
      description: requests 필드명은 유지하지만 값은 분석한 이미지 장수다(usage_counters.analyzedImageCount, #1407 후속).
      required: [month, requests]
      properties:
        month: { type: string, example: "2026-07" }
        requests: { type: integer, format: int64, example: 4820 }

    PlatformAdminPlanDistributionItem:
      type: object
      required: [plan, percent]
      properties:
        plan: { type: string, enum: [FREE, STANDARD, ENTERPRISE], example: STANDARD }
        percent: { type: integer, example: 45 }

    PlatformAdminCounselTypeDistributionItem:
      type: object
      description: >
        이번 구현 범위 밖(사용자 지시, 2026-07-23) — counsel 도메인에 유형 분류 데이터가 아직 없어
        PlatformAdminServiceStatsService는 항상 빈 목록을 반환한다.
      required: [type, count]
      properties:
        type: { type: string, example: USAGE }
        count: { type: integer, format: int64, example: 0 }

    PlatformAdminMonthlyTrend:
      type: string
      enum: [UP, DOWN, FLAT]

    PlatformAdminMonthlySummaryRow:
      type: object
      description: analysisCount는 분석 요청 건수가 아니라 분석한 이미지 장수다(#1407 후속).
      required: [month, newSubscribers, analysisCount, counselCount, upgradeConversions, trend]
      properties:
        month: { type: string, example: "2026-07" }
        newSubscribers: { type: integer, format: int64, example: 28 }
        analysisCount: { type: integer, format: int64, description: "분석한 이미지 장수", example: 4820 }
        counselCount: { type: integer, format: int64, example: 96 }
        upgradeConversions: { type: integer, format: int64, example: 4 }
        trend: { $ref: "#/components/schemas/PlatformAdminMonthlyTrend" }

    PlatformAdminServiceStatsResponse:
      type: object
      required: [kpi, subscriberTrend, analysisRequestTrend, planDistribution, counselTypeDistribution, monthlySummary]
      properties:
        kpi: { $ref: "#/components/schemas/PlatformAdminServiceStatsKpi" }
        subscriberTrend:
          type: array
          items: { $ref: "#/components/schemas/PlatformAdminSubscriberTrendPoint" }
        analysisRequestTrend:
          type: array
          items: { $ref: "#/components/schemas/PlatformAdminAnalysisRequestTrendPoint" }
        planDistribution:
          type: array
          items: { $ref: "#/components/schemas/PlatformAdminPlanDistributionItem" }
        counselTypeDistribution:
          type: array
          description: 현재 항상 빈 배열(범위 밖, 위 설명 참고)
          items: { $ref: "#/components/schemas/PlatformAdminCounselTypeDistributionItem" }
        monthlySummary:
          type: array
          items: { $ref: "#/components/schemas/PlatformAdminMonthlySummaryRow" }

    PlatformAdminServiceStatsApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/PlatformAdminServiceStatsResponse" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    ServerHealthStatus:
      type: string
      enum: [HEALTHY, DEGRADED, DOWN]

    ServerHealthItemResponse:
      type: object
      description: 서버 헬스 카드 1개. metric은 부가 지표(가동률 등) — 없으면 null.
      required: [id, name, status]
      properties:
        id: { type: string, example: api-server }
        name: { type: string, example: "API 서버" }
        status: { $ref: "#/components/schemas/ServerHealthStatus" }
        metric: { type: string, nullable: true, example: "99.9%" }

    AnalysisJobStatus:
      type: string
      description: >
        inspections.status 매핑: CREATED/UPLOADING/ANALYZING → IN_PROGRESS, ANALYZED/REVIEWED/
        REPORTED → COMPLETED. FAILED/WAITING은 DB에 대응 상태가 아직 없어 현재는 나오지 않는다
        (계약 값 자체는 프론트 호환을 위해 유지, #1408).
      enum: [IN_PROGRESS, COMPLETED, FAILED, WAITING]

    AnalysisJobQueueItemResponse:
      type: object
      description: >
        분석 잡 큐 항목 — inspections 테이블 기준 실데이터(#1408). facilityAddress는 시설물명이
        아니라 facilities.address 주소 텍스트. durationLabel은 "mm:ss" 소요 시간이며 진행 중이거나
        진행률 캐시가 만료(TTL 6h)돼 계산할 수 없으면 null.
      required: [id, facilityAddress, imageCount, status, recordedAt]
      properties:
        id: { type: string, example: "1024" }
        facilityAddress: { type: string, example: "서울시 강남구 테헤란로 123" }
        imageCount: { type: integer, example: 12 }
        status: { $ref: "#/components/schemas/AnalysisJobStatus" }
        durationLabel: { type: string, nullable: true, example: "03:12" }
        recordedAt: { type: string, example: "2026-08-04 10:20:00" }

    AnalysisJobQueueSummaryResponse:
      type: object
      required: [inProgress, completed, failed]
      properties:
        inProgress: { type: integer, format: int64, example: 2 }
        completed: { type: integer, format: int64, example: 40 }
        failed: { type: integer, format: int64, example: 0 }

    AnalysisJobQueueResponse:
      type: object
      required: [summary, jobs]
      properties:
        summary: { $ref: "#/components/schemas/AnalysisJobQueueSummaryResponse" }
        jobs:
          type: array
          items: { $ref: "#/components/schemas/AnalysisJobQueueItemResponse" }

    ServerResourceUsageResponse:
      type: object
      description: Actuator MetricsEndpoint로 조회한 현재 시점(라이브) 값 — 시계열 아님.
      required: [cpuUsagePercent, memoryUsagePercent, diskUsagePercent]
      properties:
        cpuUsagePercent: { type: number, example: 34.2 }
        memoryUsagePercent: { type: number, example: 61.5 }
        diskUsagePercent: { type: number, example: 45.0 }

    ErrorLogLevel:
      type: string
      enum: [ERROR, WARN]

    ErrorLogItemResponse:
      type: object
      description: service는 로그를 발생시킨 로거 이름의 단순 클래스명.
      required: [id, timestamp, level, service, message]
      properties:
        id: { type: string, example: "log-9931" }
        timestamp: { type: string, description: "yyyy-MM-dd HH:mm:ss (Asia/Seoul)", example: "2026-08-04 10:20:00" }
        level: { $ref: "#/components/schemas/ErrorLogLevel" }
        service: { type: string, example: PlatformAdminUserService }
        message: { type: string, example: "Connection timeout" }

    SystemMonitoringResponse:
      type: object
      description: >
        분석 잡 큐는 AI 자동 분석 파이프라인 도입 전까지 jobQueue.jobs가 항상 빈 값일 수 있다(스킬
        미도입 구간 폴백, PlatformAdminMonitoringController 설명 참고).
      required: [serverHealth, jobQueue, resourceUsage, errorLogs]
      properties:
        serverHealth:
          type: array
          items: { $ref: "#/components/schemas/ServerHealthItemResponse" }
        jobQueue: { $ref: "#/components/schemas/AnalysisJobQueueResponse" }
        resourceUsage: { $ref: "#/components/schemas/ServerResourceUsageResponse" }
        errorLogs:
          type: array
          items: { $ref: "#/components/schemas/ErrorLogItemResponse" }

    SystemMonitoringApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/SystemMonitoringResponse" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    # ── counsel·채팅 세션 ──
    BotScenarioButtonResponse:
      type: object
      description: 시나리오 버튼(노드) 요약 — 목록·자식 버튼 렌더링용.
      properties:
        id: { type: integer, format: int64, example: 1 }
        category: { type: string, example: INSPECTION_REPORT }
        buttonLabel: { type: string, example: 점검 보고서 문의 }
        leadsToCounselor:
          type: boolean
          description: true 면 이 노드가 리프이며 상담원 연결(POST /api/counsel/tickets)로 이어진다
          example: false

    BotScenarioButtonListApiResponse:
      type: object
      description: 성공 envelope — data=BotScenarioButtonResponse[]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/BotScenarioButtonResponse" }
        error: { type: object, nullable: true, example: null }

    BotScenarioNodeResponse:
      type: object
      description: 시나리오 노드 상세 — 응답 텍스트 + 자식 버튼 목록.
      properties:
        id: { type: integer, format: int64, example: 5 }
        parentId: { type: integer, format: int64, nullable: true, example: 1 }
        category: { type: string, example: INSPECTION_REPORT }
        buttonLabel: { type: string, example: 분석 결과가 이상해요 }
        responseText:
          type: string
          nullable: true
          description: 이 노드 선택 시 챗봇이 보여주는 안내 텍스트(리프가 아니면 null 일 수 있음)
          example: 분석 결과 관련 문의는 상담원 연결을 통해 도와드릴게요.
        leadsToCounselor: { type: boolean, example: true }
        children:
          type: array
          items: { $ref: "#/components/schemas/BotScenarioButtonResponse" }

    BotScenarioNodeApiResponse:
      type: object
      description: 성공 envelope — data=BotScenarioNodeResponse
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/BotScenarioNodeResponse" }
        error: { type: object, nullable: true, example: null }

    CounselTicketSummaryListApiResponse:
      type: object
      description: >
        성공 envelope — data=CounselTicketSummaryResponse[] (페이지네이션 없는 단순 목록, 고객
        상담 이력 GET /api/counsel/tickets/{id}/customer-history 전용). customer* 4필드는 이
        경로에서 항상 null.
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/CounselTicketSummaryResponse" }
        error: { type: object, nullable: true, example: null }

    CounselAttachmentResponse:
      type: object
      description: >
        채팅 이미지 업로드 응답 — 저장키와 MIME. 프론트는 attachmentKey 를 WS SEND 메시지 바디에
        실어 보낸다(서버가 저장키 확장자로 MIME 을 재도출하므로 mimeType 은 표시용 참고값).
      properties:
        attachmentKey:
          type: string
          description: FileStorageService 저장키(counsel-attachment/ 접두, 원본 URL 아님)
          example: counsel-attachment/2026/07/27/9f1c2e.jpg
        mimeType: { type: string, example: image/jpeg }

    CounselAttachmentApiResponse:
      type: object
      description: 성공 envelope — data=CounselAttachmentResponse
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/CounselAttachmentResponse" }
        error: { type: object, nullable: true, example: null }

    ChatSessionType:
      type: string
      description: PostgreSQL chat_session_type 과 일치하는 채팅 세션 유형.
      enum: [RAG, SCENARIO_BOT, COUNSEL]

    ChatSessionCreateRequest:
      type: object
      description: >
        채팅 세션 생성 요청(#1467/HAJA-647). 소유자(userId)는 요청 바디에서 받지 않고
        인증 컨텍스트에서만 취득한다 — 바디로 받으면 임의 사용자 명의 세션 생성이 가능해진다.
      required: [sessionType]
      properties:
        sessionType: { $ref: "#/components/schemas/ChatSessionType" }

    ChatSessionResponse:
      type: object
      description: >
        채팅 세션 생성 응답(#1467/HAJA-647). 소유자 userId 는 응답에 노출하지 않는다(요청자 본인
        것이 자명하므로).
      properties:
        sessionId: { type: integer, format: int64, example: 42 }
        sessionType: { $ref: "#/components/schemas/ChatSessionType" }
        startedAt: { type: string, format: date-time, example: "2026-07-27T10:00:00Z" }

    ChatSessionApiResponse:
      type: object
      description: 성공 envelope — data=ChatSessionResponse
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/ChatSessionResponse" }
        error: { type: object, nullable: true, example: null }

    ChatSessionMessageCitation:
      type: object
      description: >
        RAG 답변 1건이 인용한 근거. Chroma 청크 식별자(chunkRef)는 PostgreSQL FK 가 아니다.
      properties:
        documentId: { type: integer, format: int64, nullable: true, example: 12 }
        chunkRef: { type: string, nullable: true, example: "doc-12#chunk-3" }
        locator: { type: string, nullable: true, example: "3장 2절" }
        snippet: { type: string, nullable: true, example: "균열 폭 0.3mm 이상은 정밀안전점검 대상이다." }

    ChatSessionMessageResponse:
      type: object
      description: >
        채팅 세션 이력 메시지 응답(#1467/HAJA-647). citations 는 인용 저장 로직이 후속 이슈 범위라
        현재는 빈 배열이 정상이다.
      properties:
        id: { type: integer, format: int64, example: 901 }
        sessionId: { type: integer, format: int64, example: 42 }
        sender: { $ref: "#/components/schemas/ChatSenderType" }
        content: { type: string, example: "균열 보수 기준은 무엇인가요?" }
        citations:
          type: array
          items: { $ref: "#/components/schemas/ChatSessionMessageCitation" }
        createdAt: { type: string, format: date-time, example: "2026-07-27T10:00:05" }

    ChatSessionMessageListApiResponse:
      type: object
      description: 성공 envelope — data=ChatSessionMessageResponse[]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/ChatSessionMessageResponse" }
        error: { type: object, nullable: true, example: null }

    # ── facilities·inspections·defects 보강 ──
    AssignableUserResponse:
      type: object
      additionalProperties: false
      required: [id, name, role]
      description: >
        배정 가능한 담당자 후보(#690 PR머신 P3) — UserResponse와 달리 email을 포함하지 않는 경량
        DTO다("같은 회사 구성원이면 누구나 조회 가능"한 배정 피커 응답이라 개인정보 노출 표면을
        줄인다).
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        role: { type: string, enum: [ADMIN, INSPECTOR, USER, COUNSELOR, PLATFORM_ADMIN], example: INSPECTOR }

    AssignableUserListApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          type: array
          items: { $ref: "#/components/schemas/AssignableUserResponse" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    FacilityStatusResponse:
      type: object
      additionalProperties: false
      required: [facilityId, facilityName]
      description: >
        시설물 현황 전용 목록 항목(#540 ⑥, HAJA-378) — 대시보드 스타일 현황 테이블 화면 전용이라
        FacilityResponse(CRUD 상세)와 별도 DTO다. initialGrade는 시설물 등록 시 입력한 정적 초기
        등급이며, 점검 이력 기반으로 계산되는 하자 등급(DefectGrade)과는 다른 개념이다.
      properties:
        facilityId: { type: integer, format: int64 }
        facilityName: { type: string }
        initialGrade:
          type: string
          nullable: true
          enum: [A, B, C, D, E]
          description: 시설물 등록 시 입력한 정적 초기 등급 — 미입력이면 null(DefectGrade와 별개 개념)
        nextInspectionDueAt: { type: string, format: date, nullable: true }
        dDay:
          type: integer
          format: int64
          nullable: true
          description: 오늘(KST) 기준 nextInspectionDueAt까지 잔여일 — nextInspectionDueAt이 없으면 null
        assigneeUserId: { type: integer, format: int64, nullable: true }
        assigneeName: { type: string, nullable: true, description: 담당자 미배정 시 null }
        lastInspectedAt: { type: string, format: date, nullable: true, description: 점검 이력이 없으면 null }
        inspectionCycleMonths: { type: integer, nullable: true }
        inspectionType:
          nullable: true
          description: 가장 최근 점검 회차의 유형(근사값) — 점검 이력이 없으면 null
          oneOf:
            - { $ref: "#/components/schemas/InspectionTypeCode" }

    FacilityStatusListApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          type: array
          items: { $ref: "#/components/schemas/FacilityStatusResponse" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    FacilityInspectionGradeCount:
      type: object
      additionalProperties: false
      required: [grade, count]
      properties:
        grade: { $ref: "#/components/schemas/DefectGradeCode" }
        count: { type: integer, format: int64, minimum: 0 }

    FacilityInspectionHistoryItem:
      type: object
      additionalProperties: false
      required: [id, status, imageCount, defectGradeBreakdown, thumbnailUrls]
      properties:
        id: { type: integer, format: int64 }
        roundNo: { type: integer, nullable: true, minimum: 1 }
        inspectionDate: { type: string, format: date, nullable: true }
        inspectorName: { type: string, nullable: true }
        status: { type: string, description: InspectionStatusCode 문자열 표현 }
        imageCount: { type: integer, format: int64, minimum: 0 }
        defectGradeBreakdown:
          type: array
          items: { $ref: "#/components/schemas/FacilityInspectionGradeCount" }
        changeNote:
          type: string
          nullable: true
          description: 이전 회차 대비 변화 메모 — 최신 회차에만 존재(비교 가능한 상태일 때만), 그 외 null
        thumbnailUrls:
          type: array
          items: { type: string }
          description: 미리보기 썸네일 URL(최대 2장) — 최신 회차에만 채워짐(#1549), 이전 회차는 빈 배열

    FacilityInspectionOverviewResponse:
      type: object
      additionalProperties: false
      required: [totalRounds, cumulativeDefectCount, unresolvedDefectCount, history]
      description: >
        시설물 상세 "점검 이력" 탭 응답(#1359/HAJA-616). overallGrade는 facilities.initial_grade(등록
        시 입력값)와 완전히 다른 개념이다 — 최신 회차 하자 중 최악 등급의 계산값이며, null이면 최신
        회차에 등급이 매겨진 하자가 없다는 뜻이다.
      properties:
        overallGrade:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/DefectGradeCode" }
        totalRounds: { type: integer, minimum: 0 }
        cumulativeDefectCount: { type: integer, format: int64, minimum: 0 }
        unresolvedDefectCount: { type: integer, format: int64, minimum: 0 }
        history:
          type: array
          items: { $ref: "#/components/schemas/FacilityInspectionHistoryItem" }

    FacilityInspectionOverviewApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/FacilityInspectionOverviewResponse" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    AnalysisFileProgress:
      type: object
      additionalProperties: false
      required: [mediaId, fileName, status]
      properties:
        mediaId: { type: integer, format: int64 }
        fileName: { type: string }
        status:
          type: string
          enum: [waiting, analyzing, completed, failed]
        defectCount: { type: integer, nullable: true }
        elapsedOrEta: { type: string, nullable: true }

    AnalysisStatusResponse:
      type: object
      additionalProperties: false
      required:
        [inspectionId, stage, progressPercent, totalFileCount, analyzedFileCount, files,
         detectedDefectCount, riskyCrackCount, severityDistribution, failedCount, updatedAt]
      description: >
        AI 분석 실행/상태 폴링 응답(dev-05-04, API 명세서 v0.3 AP-006 연장). stage는 프론트 5단계
        트래커 키(upload/frameExtraction/aiDetection/postProcessing/done)에 실패 표시용 failed를
        더한 값이다. severityDistribution은 등급별(A~E) "개수"이며 퍼센트 변환은 프론트가 total로
        나눠 계산한다. updatedAt은 이 진행률이 마지막으로 갱신된 시각(하트비트) — 15분 이상 갱신이
        없으면 고착으로 간주해 stage=failed로 노출된다.
      properties:
        inspectionId: { type: integer, format: int64 }
        stage:
          type: string
          enum: [upload, frameExtraction, aiDetection, postProcessing, done, failed]
        progressPercent: { type: integer, minimum: 0, maximum: 100 }
        totalFileCount: { type: integer, minimum: 0 }
        analyzedFileCount: { type: integer, minimum: 0 }
        files:
          type: array
          items: { $ref: "#/components/schemas/AnalysisFileProgress" }
        detectedDefectCount: { type: integer, minimum: 0 }
        riskyCrackCount:
          type: integer
          minimum: 0
          description: type=CRACK이면서 grade가 D 또는 E인 하자 건수
        severityDistribution:
          type: object
          description: 등급(A~E)별 하자 개수 — 5개 키 항상 포함
          additionalProperties: { type: integer, minimum: 0 }
          example: { A: 0, B: 2, C: 1, D: 0, E: 0 }
        failedCount: { type: integer, minimum: 0 }
        updatedAt: { type: string, format: date-time }

    AnalysisStatusApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/AnalysisStatusResponse" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    DefectStatusUpdateRequest:
      type: object
      additionalProperties: false
      required: [status]
      description: >
        하자 상태 전이 요청(HAJA-26 2차). 정방향 한 단계 전이(DETECTED→CONFIRMED→IN_PROGRESS→RESOLVED)는
        reason 없이 허용되고, 역행/건너뛰기 전이는 reason이 없으면 400으로 거부된다.
      properties:
        status: { $ref: "#/components/schemas/DefectStatusCode" }
        reason:
          type: string
          nullable: true
          maxLength: 500
          description: 역행/건너뛰기 전이 시 필수(정방향 한 단계 전이는 생략 가능)
          example: 재점검 결과 조치가 미흡해 재작업 필요

    DefectActionLogResponse:
      type: object
      additionalProperties: false
      required: [id, photoUrl, actionContent, actionDate, actionAssigneeId, createdAt]
      description: >
        조치 등록 제출 이력 1건(#1193/HAJA-569). photoUrl은 DefectResponse.actionPhotoUrl과 동일
        패턴으로 인가된 썸네일 엔드포인트를 재사용한다.
      properties:
        id: { type: integer, format: int64 }
        photoUrl: { type: string, example: /api/media/4821/thumbnail }
        actionContent: { type: string }
        actionDate: { type: string, format: date }
        actionAssigneeId: { type: integer, format: int64 }
        actionAssigneeName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    DefectActionLogListApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          type: array
          items: { $ref: "#/components/schemas/DefectActionLogResponse" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    DefectRevisionResponse:
      type: object
      additionalProperties: false
      required: [id, revisedBy, fieldChanged, createdAt]
      description: >
        하자 활동 기록(변경 이력) 1건(HAJA-314) — defect_revisions를 그대로 노출하는 조회 전용
        DTO. fieldChanged는 "grade"/"isDeleted"/"status" 등 변경된 컬럼명 문자열이다.
      properties:
        id: { type: integer, format: int64 }
        revisedBy: { type: integer, format: int64, description: 변경을 수행한 user id }
        fieldChanged: { type: string, example: status }
        oldValue: { type: string, nullable: true }
        newValue: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    DefectRevisionPage:
      type: object
      description: >
        global.common.PageResponse<DefectRevisionResponse> 매핑(content/page/totalElements 3필드 —
        size/totalPages는 이 envelope에 없음, InspectionListItemPage와 동일 패턴).
      required: [content, page, totalElements]
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/DefectRevisionResponse" }
        page: { type: integer, minimum: 0, example: 0 }
        totalElements: { type: integer, format: int64, minimum: 0, example: 5 }

    DefectRevisionPageApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/DefectRevisionPage" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    # ── statistics·dashboard·menus·plans·마이페이지·reports 보강 ──
    # ── 통계 (구현됨, backend/core/statistics, StatisticsController) ──
    StatisticsKpiSummaryResponse:
      type: object
      description: >
        로그인 사용자의 회사 시설물 기준 통계 KPI. period(기본 6개월)로 잡은 현재 구간과 그 직전
        동일 길이 구간을 비교해 changeRate 를 계산한다(StatisticsService.changeRate) — 직전 구간
        값이 0이면 현재 값이 0보다 클 때만 100%, 그 외 0%로 처리한다.
      required:
        - totalDefects
        - totalDefectsChangeRate
        - avgResolutionDays
        - avgResolutionDaysChangeRate
        - actionCompletionRate
        - actionCompletionRateChangeRate
        - progressingDefects
        - progressingDefectsChangeRate
      properties:
        totalDefects: { type: integer, format: int64, minimum: 0 }
        totalDefectsChangeRate: { type: number, format: double, description: "직전 동일 길이 구간 대비 증감률(%)" }
        avgResolutionDays: { type: number, format: double, description: "RESOLVED 하자의 평균 조치 소요일(생성~조치일)" }
        avgResolutionDaysChangeRate: { type: number, format: double }
        actionCompletionRate: { type: number, format: double, description: "전체 하자 중 RESOLVED 비율(%)" }
        actionCompletionRateChangeRate: { type: number, format: double }
        progressingDefects: { type: integer, format: int64, minimum: 0, description: "총 하자 - RESOLVED 하자" }
        progressingDefectsChangeRate: { type: number, format: double }

    StatisticsKpiSummaryApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/StatisticsKpiSummaryResponse" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    StatisticsGradeDistributionItem:
      type: object
      description: >
        하자가 한 건이라도 있으면 A~E 5개 항목 전부(집계 없는 등급은 percent=0), 등급 분류된 하자가
        0건이면 빈 목록(dashboard GradeDistributionItem 과 동일한 "데이터 없음" vs "전 등급 0%" 구분 원칙, #347).
      required: [grade, percent]
      properties:
        grade: { type: string, enum: [A, B, C, D, E] }
        percent: { type: number, format: double, minimum: 0, maximum: 100 }

    StatisticsGradeDistributionListApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          type: array
          items: { $ref: "#/components/schemas/StatisticsGradeDistributionItem" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    DefectTypeDistributionItem:
      type: object
      description: >
        프론트 계약상 노출되는 하자 유형은 균열/박리·박락/철근노출 3종으로 고정한다
        (StatisticsService.FRONTEND_CONTRACT_TYPES) — 그 외 DefectType 값은 집계에서 제외된다.
      required: [type, count]
      properties:
        type: { type: string, description: "하자 유형 한글 라벨", example: 균열 }
        count: { type: integer, format: int64, minimum: 0 }

    DefectTypeDistributionListApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          type: array
          items: { $ref: "#/components/schemas/DefectTypeDistributionItem" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    MonthlyDefectTrendItem:
      type: object
      required: [month, defectCount]
      properties:
        month: { type: string, description: "YearMonth 문자열(yyyy-MM)", example: "2026-05" }
        defectCount: { type: integer, format: int64, minimum: 0 }

    MonthlyDefectTrendListApiResponse:
      type: object
      description: >
        period 로 정해진 개월 수(기본 6개월)만큼의 월 라벨을 빠짐없이 반환한다(하자 0건인 달도 포함,
        StatisticsService.scope 의 monthLabels).
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          type: array
          items: { $ref: "#/components/schemas/MonthlyDefectTrendItem" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    FacilitySummaryItem:
      type: object
      required: [facilityId, facilityName, facilityType, totalDefects, latestGrade, lastInspectedAt]
      properties:
        facilityId: { type: integer, format: int64 }
        facilityName: { type: string }
        facilityType: { type: string }
        totalDefects: { type: integer, format: int64, minimum: 0, description: "조회 구간(period) 내 하자 건수" }
        latestGrade:
          type: string
          nullable: true
          enum: [A, B, C, D, E]
          description: "조회 구간 내 점검들 중 가장 나쁜(worst) 등급 — 하자가 없으면 null"
        lastInspectedAt:
          type: string
          nullable: true
          description: "ISO date(yyyy-MM-dd) 문자열 — 전체 기간 기준 최근 점검일(구간 제한 없음), 점검 이력 없으면 null"

    FacilitySummaryListApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          type: array
          items: { $ref: "#/components/schemas/FacilitySummaryItem" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    FacilityTypeHeatmapItem:
      type: object
      description: >
        시설물 type 문자열 접두("건물"/"교량"/"도로")로 categoryOf 가 분류하고, 매칭되지 않으면 "기타"로
        묶는다(StatisticsService.categoryOf). facilityTypeCategory·month 오름차순 정렬, 하자 0건인
        (카테고리, 월) 조합은 반환하지 않는다(있는 조합만).
      required: [facilityTypeCategory, month, defectCount]
      properties:
        facilityTypeCategory: { type: string, enum: [건물, 교량, 도로, 기타] }
        month: { type: string, description: "YearMonth 문자열(yyyy-MM)", example: "2026-05" }
        defectCount: { type: integer, format: int64, minimum: 0 }

    FacilityTypeHeatmapListApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          type: array
          items: { $ref: "#/components/schemas/FacilityTypeHeatmapItem" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    # ── 대시보드 최근 점검 전체보기(검색+페이지네이션, DashboardController.searchRecentInspections) ──
    RecentInspectionPage:
      type: object
      description: >
        global.common.PageResponse<RecentInspectionResponse> 매핑(content/page/totalElements 3필드 —
        size/totalPages 는 이 envelope 에 없음, InspectionListItemPage 와 동일 패턴). content 항목 구조는
        /api/dashboard/recent-inspections(위젯)의 RecentInspectionItem 과 동일하다.
      required: [content, page, totalElements]
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/RecentInspectionItem" }
        page: { type: integer, minimum: 0 }
        totalElements: { type: integer, format: int64, minimum: 0 }

    RecentInspectionPageApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/RecentInspectionPage" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    # ── 메뉴 (구현됨, backend/menu, #1003) ──
    MenuTreeItem:
      type: object
      description: >
        GROUP 은 path/activePathPattern 이 null 이고 children 이 채워지며, 리프(INTERNAL/EXTERNAL)는
        children 이 빈 배열인 얕은 2단 트리(그룹→리프)다. enabled=false 항목은 표시는 하되 클릭 시
        "아직 구현되지 않은 페이지입니다" 안내로 이어져야 한다(#1003 팔로우업).
      required: [code, name, menuType, iconKey, opensNewTab, enabled, children]
      properties:
        code: { type: string }
        name: { type: string }
        menuType: { type: string, enum: [GROUP, INTERNAL, EXTERNAL] }
        iconKey: { type: string, nullable: true }
        path: { type: string, nullable: true }
        activePathPattern: { type: string, nullable: true }
        opensNewTab: { type: boolean }
        enabled: { type: boolean }
        children:
          type: array
          items: { $ref: "#/components/schemas/MenuTreeItem" }

    MenuTreeListApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          type: array
          items: { $ref: "#/components/schemas/MenuTreeItem" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    # ── 공개 요금제 (구현됨, backend/membership, PublicPlanController) ──
    PublicPlanItem:
      type: object
      required:
        - id
        - name
        - maxFacilities
        - maxMonthlyAnalyses
        - maxSeats
        - hasPdfWatermark
        - hasCounselorAccess
        - hasAiAddon
        - priceMonthly
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, description: "Plan.PlanName enum 값(FREE/BASIC/PRO 등)" }
        maxFacilities: { type: integer, nullable: true }
        maxMonthlyAnalyses: { type: integer, nullable: true }
        maxSeats: { type: integer, nullable: true }
        hasPdfWatermark: { type: boolean }
        hasCounselorAccess: { type: boolean }
        hasAiAddon: { type: boolean }
        priceMonthly: { type: number, format: double }

    PublicPlanCatalogResponse:
      type: object
      required: [plans]
      properties:
        plans:
          type: array
          items: { $ref: "#/components/schemas/PublicPlanItem" }

    PublicPlanCatalogApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/PublicPlanCatalogResponse" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    # ── 마이페이지(#844, HAJA-442, backend/mypage) ──
    MyInspectionsSummaryResponse:
      type: object
      description: >
        issuedReportCount 는 "그 점검들에 연결된 Report 중 FINALIZED 건수"라 participatedCount 와 합이
        맞지 않는 것이 정상이다(점검 하나에 보고서가 여러 버전 존재 가능, ANALYZED 상태는 검수대기라
        reviewConfirmedCount/inProgressCount 어느 쪽에도 포함되지 않는다).
      required: [participatedCount, reviewConfirmedCount, issuedReportCount, inProgressCount]
      properties:
        participatedCount: { type: integer, format: int64, minimum: 0, description: "assignedInspectorId 또는 createdBy가 본인인 점검 총 건수" }
        reviewConfirmedCount: { type: integer, format: int64, minimum: 0, description: "REVIEWED 또는 REPORTED 상태" }
        issuedReportCount: { type: integer, format: int64, minimum: 0 }
        inProgressCount: { type: integer, format: int64, minimum: 0, description: "CREATED/UPLOADING/ANALYZING 또는 ANALYZED 상태" }

    MyInspectionsSummaryApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/MyInspectionsSummaryResponse" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    MyInspectionRole:
      type: string
      enum: [INSPECTOR, OWNER]
      description: "assignedInspectorId == 요청자면 INSPECTOR, 아니면(=createdBy만 일치) OWNER — 둘 다 해당하면 INSPECTOR 우선"

    MyInspectionDisplayStatus:
      type: string
      enum: [REVIEW_DONE, REVIEW_PENDING, ANALYZING]
      description: "실 InspectionStatus(6종)를 화면 3종으로 백엔드에서 매핑: REVIEWED/REPORTED→REVIEW_DONE, ANALYZED→REVIEW_PENDING, CREATED/UPLOADING/ANALYZING→ANALYZING"

    MyInspectionRowItem:
      type: object
      description: >-
        roundNo·inspectionDate 는 조립/포맷 없이 그대로 반환한다 — '24-03' 또는 '2024.03.15' 같은
        화면 표기는 프론트 책임이다.
      required: [id, facilityName, roundNo, inspectionDate, role, defectCount, status]
      properties:
        id: { type: integer, format: int64 }
        facilityName: { type: string }
        roundNo: { type: integer, minimum: 1 }
        inspectionDate: { type: string, format: date }
        role: { $ref: "#/components/schemas/MyInspectionRole" }
        defectCount: { type: integer, format: int64, minimum: 0 }
        status: { $ref: "#/components/schemas/MyInspectionDisplayStatus" }

    MyInspectionRowPage:
      type: object
      description: >
        global.common.PageResponse<MyInspectionRowResponse> 매핑(content/page/totalElements 3필드 —
        size/totalPages 는 이 envelope 에 없음, InspectionListItemPage 와 동일 패턴).
      required: [content, page, totalElements]
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/MyInspectionRowItem" }
        page: { type: integer, minimum: 0 }
        totalElements: { type: integer, format: int64, minimum: 0 }

    MyInspectionRowPageApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/MyInspectionRowPage" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    ReportGradeDotColor:
      type: string
      enum: [RED, ORANGE, GREEN]
      description: "DefectGrade(A~E)를 3색으로 축약: E·D→RED, C→ORANGE, B·A→GREEN"

    MyReportRowItem:
      type: object
      description: >
        title 은 반환하지 않는다 — Report 엔티티에 제목 컬럼이 없어 화면 제목은 프론트가 조립한다.
        issuedAt 은 Report.updatedAt(finalize 시점 근사, 별도 발급 timestamp 컬럼 없음).
        fileSizeBytes 는 PDF 조회 실패 시 예외 대신 null. gradeDots 는 존재하는 색만 심각도순
        (RED→ORANGE→GREEN)으로 중복 없이 반환한다.
      required: [id, inspectionId, facilityName, roundNo, issuedAt, gradeDots, pdfUrl]
      properties:
        id: { type: integer, format: int64 }
        inspectionId: { type: integer, format: int64 }
        facilityName: { type: string }
        roundNo: { type: integer, nullable: true, minimum: 1 }
        issuedAt: { type: string, format: date-time }
        fileSizeBytes: { type: integer, format: int64, nullable: true }
        gradeDots:
          type: array
          items: { $ref: "#/components/schemas/ReportGradeDotColor" }
        pdfUrl: { type: string, nullable: true }

    MyReportRowListApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          type: array
          items: { $ref: "#/components/schemas/MyReportRowItem" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    # ── auth 진위확인·사업자등록증 파일·AI 프록시/내부 ──
    BusinessVerificationRequest:
      type: object
      description: >
        회원가입 전(비로그인) [진위확인] 버튼 요청(#648). CompanySignupRequest와 검증 규칙(형식·길이)을
        동일하게 맞춘다.
      required: [businessRegistrationNumber, representativeName, businessStartDate]
      properties:
        businessRegistrationNumber:
          type: string
          pattern: "\\d{3}-?\\d{2}-?\\d{5}"
          example: "123-45-67890"
        representativeName: { type: string, maxLength: 100, example: 김대표 }
        businessStartDate: { type: string, format: date, example: "2020-01-01" }

    BusinessVerificationResponse:
      type: object
      description: >
        사용자 대면 결과. message는 결과 코드별 고정 문구이며 개인정보(사업자번호·대표자명·개업일자)를
        포함하지 않는다. 내부 판정 SKIPPED(fail-open)는 이 API에서 UNAVAILABLE로 번역된다.
      required: [result, message]
      properties:
        result:
          type: string
          enum: [VERIFIED, NOT_REGISTERED, MISMATCH, SUSPENDED, CLOSED, UNAVAILABLE]
          example: VERIFIED
        message: { type: string, example: 사업자 정보가 국세청 등록정보와 일치합니다. }

    BusinessVerificationApiResponse:
      type: object
      description: 성공 envelope — data=BusinessVerificationResponse(UNAVAILABLE 포함 fail-open도 success=true)
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/BusinessVerificationResponse" }
        error: { type: object, nullable: true, example: null }

    RagChatProxyRequest:
      type: object
      description: >
        POST /api/ai/rag-chat 요청 바디(HAJA-32, #467/#1467). 내부 FastAPI 계약의 question과 필드명이
        달라(query) AiProxyService가 변환해 전달한다. sessionId는 선택 값 — 있으면 세션 소유·
        sessionType=RAG를 검증하고 최근 3턴 이력을 함께 전달한다.
      required: [query]
      properties:
        query: { type: string, maxLength: 2000, example: "균열 보수 기준은 무엇인가요?" }
        sessionId:
          type: integer
          format: int64
          nullable: true
          description: POST /api/chat-sessions로 만든 채팅 세션 식별자. 없으면 기존과 동일한 단발 질의.
          example: 42

    RagChatApiResponse:
      type: object
      description: >
        POST /api/ai/rag-chat 전용 Spring ApiResponse envelope — data 형태는 내부 AIResponse.data
        (RagAnswerData, answer/sources[])와 동일.
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/RagAnswerData" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/ApiError" }

    # ── /ai/detect-defects (구현됨, ai-server/ai/chains/defect_detection_chain.py) ──
    DetectDefectsRequest:
      type: object
      description: >
        이미지 1장당 1회 호출(dev-05-04, AP-006). image_base64 max_length는 점검 미디어 업로드 상한
        20MB의 base64 상당치(DoS 방지).
      required: [image_base64]
      properties:
        image_base64: { type: string, minLength: 1 }

    DetectedDefect:
      type: object
      description: >
        탐지 1건 — bbox_*는 원본 이미지 대비 0~1 정규화 비율, grade는 area_ratio(세그멘테이션 마스크
        기반 면적비율 또는 bbox 근사치) 기반 A~E. area_px/length_px/width_px는 보고서 표기용 물리
        측정값(픽셀 단위)이며 균열이 아니면 null, 등급 판정에는 쓰이지 않는다.
      required: [type, bbox_x, bbox_y, bbox_w, bbox_h, confidence, grade, area_ratio]
      properties:
        type: { type: string, enum: [CRACK, SPALLING, REBAR_EXPOSURE], example: CRACK }
        bbox_x: { type: number, format: float, example: 0.12 }
        bbox_y: { type: number, format: float, example: 0.34 }
        bbox_w: { type: number, format: float, example: 0.08 }
        bbox_h: { type: number, format: float, example: 0.05 }
        confidence: { type: number, format: float, maximum: 0.9999, example: 0.87 }
        grade: { type: string, enum: [A, B, C, D, E], example: C }
        area_ratio: { type: number, format: float, example: 0.0031 }
        area_px: { type: number, format: float, nullable: true }
        length_px: { type: number, format: float, nullable: true, description: 균열만 — 면적/폭 근사 }
        width_px: { type: number, format: float, nullable: true, description: 균열만 — 2×면적/둘레 근사 }

    DetectDefectsData:
      type: object
      description: AIResponse.data 의 실제 형태(성공 시)
      required: [detections]
      properties:
        detections:
          type: array
          items: { $ref: "#/components/schemas/DetectedDefect" }

    DetectDefectsAIResponse:
      type: object
      description: 내부 /ai/detect-defects 전용 AIResponse envelope(추론 실패 시 error.code=VISION_INFERENCE_FAILED)
      required: [success, data, error]
      properties:
        success: { type: boolean, example: true }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/DetectDefectsData" }
        usage:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/AIUsage" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/AIError" }

    # ── /ai/rag-documents/* (구현됨, #22/HAJA-35, #1328, #1394) ──
    RagDocumentEmbedRequest:
      type: object
      description: Spring RagDocumentService가 PDF에서 추출한 텍스트와 문서 메타데이터를 그대로 실어 보낸다.
      required: [doc_id, title, doc_type, target_collection, text]
      properties:
        doc_id: { type: string, pattern: "^[1-9][0-9]*$", example: "42" }
        title: { type: string, minLength: 1, example: "시설물의 안전 및 유지관리에 관한 특별법" }
        doc_type: { type: string, minLength: 1, example: regulation }
        target_collection: { type: string, enum: [regulations, defect_kb], example: regulations }
        text: { type: string, minLength: 1 }
        effective_date: { type: string, nullable: true, example: "2020-01-01" }
        publisher: { type: string, nullable: true }
        authored_at: { type: string, nullable: true }
        verification_status: { type: string, nullable: true }

    RagDocumentEmbedData:
      type: object
      description: >
        AIResponse.data — 청킹만 동기 완료된 시점의 결과. 실제 임베딩은 BackgroundTasks로 진행 중이며
        embed_batch_id는 /ai/rag-documents/{doc_id}/embedding-status 완료 판정에 쓰인다(#1393).
      required: [chunk_count, embed_batch_id]
      properties:
        chunk_count: { type: integer, example: 12 }
        embed_batch_id: { type: string, example: "a1b2c3d4e5f6" }

    RagDocumentEmbedAIResponse:
      type: object
      description: 내부 /ai/rag-documents/embed 전용 AIResponse envelope
      required: [success, data, error]
      properties:
        success: { type: boolean, example: true }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/RagDocumentEmbedData" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/AIError" }

    RagEmbeddingStatusData:
      type: object
      description: >
        AIResponse.data — Chroma에 실제 적재된 청크 수. embed_batch_id는 적재된 청크 전부가 같은
        배치일 때만 값이 있고, 재임베딩 도중처럼 신·구 배치가 섞여 있으면 null(#1393).
      required: [chunk_count, embed_batch_id]
      properties:
        chunk_count: { type: integer, example: 12 }
        embed_batch_id: { type: string, nullable: true, example: "a1b2c3d4e5f6" }

    RagEmbeddingStatusAIResponse:
      type: object
      description: 내부 /ai/rag-documents/{doc_id}/embedding-status 전용 AIResponse envelope
      required: [success, data, error]
      properties:
        success: { type: boolean, example: true }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/RagEmbeddingStatusData" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/AIError" }

    RagDeleteData:
      type: object
      description: AIResponse.data — 삭제 요청한 doc_id를 그대로 반환(idempotent 확인용)
      required: [doc_id]
      properties:
        doc_id: { type: string, example: "42" }

    RagDeleteAIResponse:
      type: object
      description: 내부 DELETE /ai/rag-documents/{doc_id} 전용 AIResponse envelope
      required: [success, data, error]
      properties:
        success: { type: boolean, example: true }
        data:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/RagDeleteData" }
        error:
          nullable: true
          oneOf:
            - { $ref: "#/components/schemas/AIError" }
