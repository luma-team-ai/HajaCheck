          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: ADMIN 아님 / 회사 없는 관리자 (FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/admin/analysis-jobs:
    get:
      summary: AI 분석 작업 현황 조회 (관리자 콘솔)
      description: >
        요청 관리자 소속 회사의 점검 회차를 AI 분석 진행 상태(PENDING/ANALYZING/COMPLETED) 기준으로
        조회한다(ADMIN 전용). `jobId` 는 별도 "분석 실행" 테이블이 없어 점검 회차 id(inspectionId)를
        그대로 재사용한다. `progressPercent` 는 status=ANALYZING일 때만 값이 있을 수 있고, 그마저도
        AnalysisProgressStore(Redis, TTL 있음) 캐시가 없으면 null이다(fail-soft). PENDING은 "아직
        시작 안 함"과 "직전 시도가 실패해 대기로 롤백됨"을 구분하지 않는다(1차 스코프 제외).
        `AdminAnalysisJobController.list` 구현됨.
      security:
        - SessionCookie: []
      tags: [admin]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, ANALYZING, COMPLETED] } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, description: "1~100(초과 시 100으로 clamp)", schema: { type: integer, default: 10 } }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAnalysisJobItemPageApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: ADMIN 아님 / 회사 없는 관리자 (FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/admin/rag-documents:
    get:
