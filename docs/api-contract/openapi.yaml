  /api/admin/invite-codes:
    post:
      summary: 초대 코드 발급 (관리자 콘솔, #794)
      description: >
        요청 관리자 소속 회사로 스코프된 1회용 초대 코드를 발급한다(ADMIN 전용). 코드는
        InviteCodeStore(Redis)에만 존재하며 TTL 경과 시 자동 만료된다(app.auth.invite-code-ttl,
        `ttlSeconds` 는 프론트 카운트다운 초기값). 발급 전 `QuotaService#hasAvailableSeat` 로 좌석
        여유를 advisory 선검사하며, 여유가 없으면 코드를 만들지 않고 즉시 실패한다
        (PLAN_SEAT_QUOTA_EXCEEDED, 403) — 최종 방어선은 redeem 시점의 `reserveSeat` 다.
        `AdminInviteCodeController.issue` 구현됨.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [admin]
      responses:
        "201":
          description: 발급 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteCodeIssueApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: ADMIN 아님 / 회사 없는 관리자(FORBIDDEN) / 좌석 한도 초과(PLAN_SEAT_QUOTA_EXCEEDED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "500":
          description: 연속 코드 충돌(최대 5회 재시도 소진, 사실상 불가능한 확률) — INTERNAL_ERROR
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/admin/invite-codes/revoke:
    post:
      summary: 초대 코드 폐기 (관리자 콘솔, #794, PR머신 리뷰 P3)
      description: >
        발급 모달을 닫을 때 호출한다(ADMIN 전용). 코드를 URL 경로가 아니라 바디로 받는다 — 배선
        권한을 가진 1회용 크레덴셜이 nginx/서블릿 액세스 로그·브라우저 히스토리에 평문으로 남는 것을
        막기 위함. 요청 관리자 소속 회사가 발급한 코드만 삭제되고, 그 외(미존재·만료·타 회사 소유)는
        모두 조용히 무시한다(멱등 삭제 + 존재 여부 열거 방지). 응답은 `ResponseEntity<Void>`+204가
        아니라 `ApiResponse` 봉투로 200을 내린다(프론트 axios 인터셉터가 항상 response.data.data를
        읽어 204 본문 없음이면 크래시하기 때문, AuthController.logout과 동일 패턴).
        `AdminInviteCodeController.revoke` 구현됨.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [admin]
      requestBody:
