servers:
  - url: /api
    description: Spring Boot (백엔드)
  - url: /ai
    description: >
      FastAPI (ai-server) — **내부 전용**. 외부 공개 안 됨(nginx 공개 `/ai/` 제거, #236).
      스프링 `/api/ai/*` 프록시만 호출하며 `X-Internal-Key`(env `AI_INTERNAL_KEY`) 검증(설정 시 불일치 401, `/health` 제외).
      프론트는 이 서버를 직접 호출하지 않음 → `/api/ai/*`(세션 인증) 경유. 상세 `contract.md` §접근 모델.

paths:
  /health:
    get:
      summary: 헬스체크
      tags: [common]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /ai/ping:
    get:
      summary: AI 서버 envelope 동작 확인
      tags: [ai]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIResponse" }

  /ai/defect-explain:
    post:
      summary: AI 하자 원인·조치방안 설명 (FR-4 P1, 점검관리B)
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DefectExplainRequest" }
      responses:
        "200":
          description: 성공/실패 모두 200 — success 필드로 구분(AI_개발_컨벤션.md §4 표준 폴백)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIResponse" }

  /ai/grounding-check:
    post:
      summary: 환각 방어 게이트 — 생성물 주장 수치·등급을 실측 defects와 코드로 대조 (HAJA-117)
      description: >
        LLM 호출 없음 — 결정론적 코드 대조. `ai-server/routers/ai_router.py` 구현됨(약 58~65행).
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroundingCheckRequest" }
      responses:
        "200":
          description: 성공/실패 모두 200 — success 필드로 구분
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIResponse" }

  /ai/briefing:
    post:
      summary: 대시보드 AI 주간 브리핑 (대시보드 P1)
      description: >
        현황 데이터(코드 집계) → 자연어 요약. 전주 대비 변화율·추세는 코드로 계산해 프롬프트에 주입하고
        LLM은 자연어만 생성(수치 환각 방지). `ai-server/routers/ai_router.py` 구현됨(약 68~75행).
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DashboardStats" }
      responses:
        "200":
          description: 성공/실패 모두 200 — success 필드로 구분
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIResponse" }

  /ai/report:
    post:
      summary: AI 보고서 4개 섹션 병렬 생성 및 Grounding Check (FR-5, 로그인/보고서 담당)
      description: >
        구현된 내부 전용 FastAPI 라우트다. 외부 클라이언트용 Spring `/api/ai/report` 프록시는 삭제되었으며,
        Spring `ReportService`가 이 라우트를 내부 전용 키(InternalKey)로만 직접 호출한다.
        grounding_request_id, inspection_id, report_version은 모두 제공하거나
        모두 생략해야 한다. 모두 생략하면 기존 호환 경로로 처리되어 응답의 correlation 필드와
        content_hash도 생략된다. 모두 제공하면 같은 correlation 값과 보고서 본문의 canonical JSON
        SHA-256 content_hash를 반환한다. 현재 Spring 프록시는 이 값을 서버에서 강제 생성하지 않고
        요청 값을 전달하므로, correlation은 선택적 무결성 대조 계약이며 권한·귀속 보장은 아니다.
      x-internal: true
      security:
        - InternalKey: []
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportGenerateRequest" }
      responses:
        "200":
          description: 성공 또는 AI/보고서 검증 실패 — success 필드로 구분
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportAIResponse" }
        "422":
          description: >
            요청 모델 검증 실패. correlation 필드 일부 입력, 빈 grounding_request_id,
            1 미만 inspection_id/report_version 등이 해당하며 FastAPI detail[] 형식으로 반환한다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FastApiValidationError" }

  /ai/rag-chat:
    post:
      summary: RAG 챗봇 질의 (FR-6, 고객지원)
      description: >
        (계획/미구현, 내부 전용) Spring Boot가 인증 사용자 소유이면서 session_type=RAG인
        세션인지 검증한 뒤 호출한다. 존재하지 않거나 타인 소유인 세션은 Spring Boot가
        동일하게 404로 처리하며 FastAPI를 호출하지 않는다. 프론트엔드는 이 엔드포인트를
        직접 호출하지 않는다. Spring Boot는 환경변수로 주입된 내부 서비스 토큰을
        X-Internal-Service-Token 헤더로 전달하고 FastAPI는 누락 또는 불일치 요청을 거부한다.
        운영 nginx는 이 경로를 FastAPI로 직접 프록시하지 않는다. 성공 시 AIResponse.data는 RagAnswerData(answer, sources[])
        형태이며, sources[]는 문서명·컬렉션·표시 라벨·원문 발췌·Chroma 청크 참조를 포함한다.
      x-internal: true
      security:
        - InternalServiceToken: []
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, session_id]
              properties:
                question: { type: string, example: "균열 보수 기준은 무엇인가요?" }
                session_id:
                  type: integer
                  format: int64
                  description: Spring Boot가 소유권과 RAG 세션 유형을 검증한 서버 관리 식별자
                  example: 42
                company_id:
                  type: integer
                  format: int64
                  minimum: 1
                  nullable: true
                  description: >
                    요청자의 회사 식별자(#1584). Spring Boot가 @AuthenticationPrincipal에서만
                    취득해 전달한다(요청 바디에서 받지 않는다). 시맨틱 캐시의 조회·저장 스코프
                    키이며, 회사 미소속 개인회원은 null이라 시맨틱 캐시를 조회도 저장도 하지 않는다.
                  example: 7
      responses:
        "200":
          description: 성공/실패 모두 200 — success 필드로 구분
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIResponse" }

  /ai/nl-search:
    post:
      summary: 자연어 질의를 하자 필터로 변환 (HAJA-120, 계획/미구현)
      description: >
        Spring Boot의 공개 POST /api/defects/nl-search 게이트웨이만 호출하는 내부 전용 경로다.
        FastAPI는 X-Internal-Service-Token이 누락되거나 일치하지 않으면 LLM 호출 전에 거부한다.
        DB를 조회하지 않고 질의를 NlSearchResult로 변환하며, 입력 검증 및 LLM 실패도 공통
        AIResponse envelope으로 반환한다. 운영 nginx는 이 경로를 외부에 직접 노출하지 않는다.
      x-internal: true
      security:
        - InternalServiceToken: []
      tags: [ai, defect]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NlSearchInternalRequest" }
      responses:
        "200":
          description: 성공 또는 VALIDATION_ERROR/LLM 오류 — success 필드로 구분
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NlSearchAIResponse" }
        "401":
          description: X-Internal-Service-Token 누락 또는 불일치
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIResponse" }

  /ai/business-license-ocr:
    post:
      summary: 사업자등록증 OCR (RapidOCR 실구현, #552 / HAJA-321)
      description: >
        `image_base64`(사업자등록증 이미지)를 RapidOCR(ONNXRuntime, 한국어 PP-OCR 인식 모델)로
        텍스트 추출 후 LLM structured output 으로 {businessRegistrationNumber, companyName,
        representativeName} 을 파싱해 반환한다. `image_base64` 필수(없으면 VALIDATION_ERROR),
        `file_ref` 는 아직 미구현(값이 와도 무시). OCR/모델로드/LLM 파싱 실패는 예외를 삼키지 않고
        서버 로그에 스택만 남긴 뒤(OCR 원문·개인정보는 로깅하지 않음) LLM_INVALID_OUTPUT 으로 반환 →
        클라이언트는 수동 입력으로 폴백한다. 내부 전용이며 X-Internal-Key 검증 대상이다.
      x-internal: true
      x-status: implemented
      security:
        - InternalKey: []
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessLicenseOcrRequest" }
      responses:
        "200":
          description: >
            OCR 성공 시 success=true + 추출 필드(인식 실패한 필드는 null). 입력 검증/처리 실패 시
            success=false + error(VALIDATION_ERROR·LLM_INVALID_OUTPUT).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessLicenseOcrAIResponse" }

  /api/ai/defect-explain:
    post:
      summary: 하자 원인·조치방안 설명 (인증 프록시, #228 / HAJA-188)
      description: >
        로그인 사용자 요청을 세션 인증 프록시로 내부 FastAPI `/ai/defect-explain` 에 전달한다(내부 호출은
        X-Internal-Key 부착). 요청 JSON 키는 FastAPI 계약과 동일하게 snake_case 유지
        (defect_type/severity_grade/location/facility_type). `AiProxyController.defectExplain` 구현됨.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DefectExplainRequest" }
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefectExplainApiResponse" }
        "400":
          description: INVALID_INPUT | AI_REQUEST_REJECTED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "502":
          description: AI_INVALID_RESPONSE | AI_SERVER_ERROR — 내부 FastAPI 오류를 그대로 전달하지 않고 이 코드로 통일
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "503":
          description: AI_SERVER_UNREACHABLE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "504":
          description: AI_SERVER_TIMEOUT
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/ai/briefing:
    post:
      summary: AI 주간 브리핑 (인증 프록시, 대시보드 P1, #248 / HAJA-197)
      description: >
        로그인 사용자 소유 범위로 대시보드 현황(BriefingStatsService)을 집계해 세션 인증 프록시로 내부
        FastAPI `/ai/briefing` 에 전달하고 자연어 브리핑 카드를 반환한다. 요청 바디 없음(집계는 서버가
        인증 주체 기준으로 수행 — cross-owner IDOR 방지). `AiProxyController.briefing` 구현됨.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [ai, dashboard]
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BriefingApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "502":
          description: AI_INVALID_RESPONSE | AI_SERVER_ERROR
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "503":
          description: AI_SERVER_UNREACHABLE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "504":
          description: AI_SERVER_TIMEOUT
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/auth/companies:
    post:
      summary: 기업 회원가입 (multipart/form-data)
      description: >
        User(passwordHash·ACTIVE·ADMIN) + Company(APPROVED + VERIFIED) + CompanyMembership(오너 APPROVED)
        + UserConsent(약관 2건) 원자 생성 — 관리자 승인 대기 없이 즉시 자동승인(#1324).
        `CompanySignupController.signup` 구현됨. 검증 실패는 401 금지(400/404/409만 사용).
      tags: [auth]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/CompanySignupRequest" }
      responses:
        "201":
          description: 가입 신청 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanySignupApiResponse" }
        "409":
          description: AUTH_EMAIL_DUPLICATED | AUTH_BUSINESS_NUMBER_DUPLICATED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "400":
          description: FILE_REQUIRED | FILE_INVALID_TYPE | FILE_TOO_LARGE | INVALID_INPUT
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/auth/business-license/ocr:
    post:
      summary: 사업자등록증 OCR (공개 프록시, multipart/form-data)
      description: >
        기업 가입 전(비로그인) 화면에서 사업자등록증 이미지를 업로드하면 사업자번호·상호·대표자명을 인식해
        자동채움용으로 반환한다. 파일검증(jpeg/png 매직바이트·10MB) 후 base64로 내부 ai-server
        `/ai/business-license-ocr`(X-Internal-Key)에 프록시한다. `BusinessLicenseOcrController.ocr` 구현됨.
        보조 기능이라 인식 실패해도 가입은 수동 입력으로 진행 가능. `/api/auth/**` permitAll(비로그인).
        rate-limit(전역 분당 + 일일 절대캡) 적용.
      tags: [auth]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [businessRegistrationFile]
              properties:
                businessRegistrationFile:
                  type: string
                  format: binary
                  description: 사업자등록증 이미지(jpeg/png, 최대 10MB)
      responses:
        "200":
          description: 인식 성공(인식 실패한 필드는 null — FE 수동 입력 폴백)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessLicenseOcrProxyApiResponse" }
        "400":
          description: FILE_REQUIRED | FILE_INVALID_TYPE | FILE_TOO_LARGE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "429":
          description: AUTH_TOO_MANY_REQUESTS (분당/일일 rate-limit 초과)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "5XX":
          description: >
            ai-server 실패 — AI_INVALID_RESPONSE·AI_SERVER_ERROR(502) | AI_SERVER_UNREACHABLE(503)
            | AI_SERVER_TIMEOUT(504). FE 수동 입력 폴백.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/auth/email-availability:
    get:
      summary: 이메일(아이디) 중복확인
      description: "`CompanySignupController.checkEmailAvailability` 구현됨."
      tags: [auth]
      parameters:
        - name: email
          in: query
          required: true
          schema: { type: string, format: email }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailAvailabilityApiResponse" }

  /api/auth/companies/status:
    get:
      summary: 가입 상태 조회
      description: >
        `CompanySignupController.getSignupStatus` 구현됨. token=signupToken(불투명 문자열).
        #1324 이후 신규 가입은 항상 APPROVED 를 반환한다(자동승인) — 승인 대기 스테퍼는 프론트에서 제거됨.
      tags: [auth]
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignupStatusApiResponse" }
        "404":
          description: AUTH_SIGNUP_TOKEN_INVALID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/auth/id-inquiry:
    post:
      summary: 아이디(이메일) 찾기
      description: >
        사업자등록번호 + (대표자명|상호명 최소 1개) 매칭 → 마스킹 이메일. 계정 열거 방지를 위해
        무매칭 시 통일 메시지. `AccountRecoveryController.findId` 구현됨.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FindIdRequest" }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindIdApiResponse" }
        "404":
          description: AUTH_ACCOUNT_NOT_FOUND
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/auth/password-reset-request:
    post:
      summary: 비밀번호 재설정 링크 발송 요청 (1단계, #194 / HAJA-172)
      description: >
        계정 존재 여부와 무관하게 항상 동일한 200 {requested:true}를 반환한다(계정 열거 방지). 계정이
        존재하고 비밀번호 로그인이 가능한 상태(hasPassword && !suspended)일 때만 실제로 메일을 비동기
        발송하며, 그 사실은 응답에 드러나지 않는다. resetToken은 응답에 절대 포함하지 않고 메일로만
        전달한다. `AccountRecoveryController.requestPasswordResetLink` 구현됨.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetLinkRequest" }
      responses:
        "200":
          description: 요청 접수 성공(계정 존재 여부와 무관하게 항상 동일)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordResetLinkApiResponse" }
        "400":
          description: INVALID_INPUT(이메일 형식 오류)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "429":
          description: AUTH_TOO_MANY_REQUESTS(이메일 축 또는 전역 상한 초과)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/auth/password-reset:
    post:
      summary: 새 비밀번호 설정 (2단계, #194 / HAJA-172)
      description: >
        메일 링크의 1회용 토큰을 소비해 비밀번호를 변경한다. 토큰은 조회 즉시 삭제되며(Redis 원자적
        consume), 무효·만료·이미 사용됨·발급 후 계정 상태 변경(정지·소셜 전용 전환) 모두 구분 없이
        AUTH_RESET_TOKEN_INVALID(400)로 통일 응답한다. 비밀번호 정책 위반(DTO 검증 실패)은 토큰을
        소비하지 않고 INVALID_INPUT(400)만 반환한다. `AccountRecoveryController.resetPassword` 구현됨.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "200":
          description: 재설정 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordResetApiResponse" }
        "400":
          description: INVALID_INPUT(비밀번호 정책 위반) | AUTH_RESET_TOKEN_INVALID(토큰 무효·만료·사용됨)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  # ── 아래는 계획 단계(경로안) — 각 담당자가 구현 시 requestBody/responses 채울 것 ──

  /api/auth/login:
    post:
      summary: 기업 화면 로그인 (email/password)
      description: >
        기업 화면(/login) 전용(#1514). loginId(=email)/password 로 인증. 성공 시 세션 쿠키(SESSION) 발급.

        허용 role = **ADMIN / INSPECTOR / USER**. PLATFORM_ADMIN·COUNSELOR 계정은 자격증명이 맞아도
        403 AUTH_ROLE_NOT_ALLOWED 로 거절되며 **세션이 발급되지 않는다**(세션 생성·ID 회전 자체가
        일어나지 않아, 실패 응답의 세션으로 GET /api/users/me 를 호출해도 401).

        인증 실패는 계정 열거 방지를 위해 id/pw/미존재/잠금 구분 없이 401 AUTH_INVALID_CREDENTIALS 로
        통일하며, role 게이트보다 먼저 걸린다(비밀번호를 모르면 403을 볼 수 없다).
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserApiResponse" }
        "400":
          description: loginId/password 누락·공백 (INVALID_INPUT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 인증 실패 (AUTH_INVALID_CREDENTIALS)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: 이 화면으로는 로그인할 수 없는 role (AUTH_ROLE_NOT_ALLOWED) — 세션 미발급
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/auth/platform-admin/login:
    post:
      summary: 플랫폼 관리자 화면 로그인 (email/password)
      description: >
        플랫폼 관리자 화면(/platform-admin/login) 전용(#1514). 허용 role = **PLATFORM_ADMIN** 만.
        그 외 role 은 자격증명이 맞아도 403 AUTH_ROLE_NOT_ALLOWED 로 거절되며 **세션이 발급되지 않는다**.
        요청/성공 응답 스키마와 인증 실패(401) 정책은 POST /api/auth/login 과 동일하다.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserApiResponse" }
        "400":
          description: loginId/password 누락·공백 (INVALID_INPUT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 인증 실패 (AUTH_INVALID_CREDENTIALS)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: 이 화면으로는 로그인할 수 없는 role (AUTH_ROLE_NOT_ALLOWED) — 세션 미발급
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/auth/counselor/login:
    post:
      summary: 상담원 콘솔 로그인 (email/password)
      description: >
        상담원 콘솔(/counsel-console/login) 전용(#1514). 허용 role = **COUNSELOR** 만.
        그 외 role 은 자격증명이 맞아도 403 AUTH_ROLE_NOT_ALLOWED 로 거절되며 **세션이 발급되지 않는다**.
        요청/성공 응답 스키마와 인증 실패(401) 정책은 POST /api/auth/login 과 동일하다.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserApiResponse" }
        "400":
          description: loginId/password 누락·공백 (INVALID_INPUT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 인증 실패 (AUTH_INVALID_CREDENTIALS)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: 이 화면으로는 로그인할 수 없는 role (AUTH_ROLE_NOT_ALLOWED) — 세션 미발급
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/auth/demo-login:
    post:
      summary: 데모 원클릭 로그인 (요청 바디 없음)
      description: >
        라이브 데모 방문자용(#1626). 요청 바디 없이 서버가 보관한 데모 계정(기업 ADMIN) 크레덴셜로
        인증해 **POST /api/auth/login 과 동일한 UserResponse + 동일한 세션(SESSION 쿠키)** 을 발급한다.
        크레덴셜은 프론트에 절대 노출되지 않는다(응답에도 없음).

        데모 기능이 꺼진 환경(`app.demo.enabled=false`, 기본값) 또는 크레덴셜(env DEMO_ADMIN_PASSWORD)
        미설정 시 **404 AUTH_DEMO_DISABLED** 로 fail-closed 한다 — 기능 존재 자체를 드러내지 않는다.
        전역 rate-limit(기본 분당 10회, IP 축 없음 — 전역축만) 초과 시 **429 AUTH_TOO_MANY_REQUESTS**.
        데모 계정이 아직 시드되지 않았거나 크레덴셜이 어긋나면 기존 통일 401 AUTH_INVALID_CREDENTIALS.

        role 화이트리스트는 기업 로그인과 동일(ADMIN/INSPECTOR/USER) — 설정 오류로 데모 loginId 가
        PLATFORM_ADMIN 을 가리켜도 403 AUTH_ROLE_NOT_ALLOWED 로 세션이 발급되지 않는다.
      tags: [auth]
      responses:
        "200":
          description: 로그인 성공 — 기업 로그인과 동일 envelope(UserResponse.isDemo=true)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserApiResponse" }
        "401":
          description: 서버 보관 크레덴셜 인증 실패 — 시드 미실행/비밀번호 불일치 (AUTH_INVALID_CREDENTIALS)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 데모 기능 비활성 (AUTH_DEMO_DISABLED — app.demo.enabled=false 또는 크레덴셜 미설정)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "429":
          description: 전역 rate-limit 초과 (AUTH_TOO_MANY_REQUESTS — 기본 분당 10회)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/auth/logout:
    post:
      summary: 로그아웃
      description: 세션 무효화 + SecurityContext clear
      tags: [auth]
      responses:
        "200":
          description: 로그아웃 성공 (data=null)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoidApiResponse" }

  /api/auth/oauth2/{provider}:
    get:
      summary: 소셜 로그인 시작 (Kakao/Google)
      description: >
        브라우저를 이 경로로 이동시키면 제공자 인가 화면으로 302 리다이렉트된다.
        인가 완료 후 서버가 콜백(/login/oauth2/code/{provider})을 처리하고,
        성공 시 app.oauth2.success-redirect, 실패 시 failure-redirect(프론트)로 리다이렉트한다.
      tags: [auth]
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [kakao, google] }
      responses:
        "302": { description: 제공자 인가 화면 또는 프론트로 리다이렉트 }

  /api/users/me:
    get:
      summary: 내 정보 조회
      description: 세션의 인증 사용자 정보 반환. 미인증 시 401 UNAUTHORIZED(JSON).
      tags: [auth]
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/users/me/password:
    patch:
      summary: 비밀번호 변경 (로그인 상태, #1315 / HAJA-601)
      description: >
        로그인한 본인의 비밀번호를 변경한다. 대상 사용자는 **세션 principal 로만** 식별하며 바디·경로·쿼리
        어디서도 userId 를 받지 않는다(IDOR 차단). newPassword 정책은 가입(CompanySignupRequest.password)·
        재설정(PasswordResetRequest.newPassword)과 **동일**하다 — 이 경로가 느슨하면 정책 우회로가 된다.


        검사 순서는 `rate-limit → 계정 조회 → 비밀번호 보유(소셜 전용 차단) → 현재 비밀번호 일치 → 신·구 동일`
        이다. "신·구 동일"(400)을 현재 비밀번호 검증(401) **뒤에** 두어, 현재 비밀번호를 모르는 호출자가
        응답 차이로 그것을 알아내는 오라클을 막는다. currentPassword 에는 형식 제약을 걸지 않는다 —
        400/401 차이가 "저장된 비밀번호가 현행 정책을 만족하는가"를 흘리기 때문이며, 불일치는 항상 401 하나다.


        ⚠️ **성공 시 현재 세션이 종료된다**(세션 무효화 + SESSION 쿠키 만료 + CSRF 토큰 회전) — 클라이언트는
        재로그인시켜야 한다. **다른 기기의 기존 세션은 무효화되지 않는다**(알려진 한계 — non-indexed Redis
        세션 제약, 후속 #1318). 401 은 두 종류(미인증 `UNAUTHORIZED` / 현재 비밀번호 불일치
        `AUTH_INVALID_CREDENTIALS`)이므로 **클라이언트는 status 가 아니라 code 로 분기**해야 한다.
        `UserController.changePassword` 구현됨.
      security:
        - SessionCookie: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChangeRequest" }
      responses:
        "200":
          description: 변경 성공 (현재 세션 종료됨 — 재로그인 필요)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoidApiResponse" }
        "400":
          description: >
            INVALID_INPUT(비밀번호 정책 위반) | AUTH_PASSWORD_NOT_SET(소셜 전용 계정 — 비밀번호 미보유) |
            AUTH_PASSWORD_UNCHANGED(새 비밀번호가 현재와 동일)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증(UNAUTHORIZED) | 현재 비밀번호 불일치(AUTH_INVALID_CREDENTIALS)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: CSRF 토큰 누락·불일치 | AUTH_ACCOUNT_WAITING(초대 코드 미입력) | AUTH_ACCOUNT_SUSPENDED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "429":
          description: >
            AUTH_TOO_MANY_REQUESTS — userId 축 한도 초과(변경 **성공 시 카운터 즉시 해제**). 축이 userId 라
            세션이 탈취된 계정에서는 공격자가 한도를 소모해 피해자의 비밀번호 변경(복구 경로)을 봉쇄할 수
            있다 — 그때의 탈출 경로는 축이 완전히 다른 비로그인 재설정(`POST /api/auth/password-reset-request`)이다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/me/plan:
    get:
      summary: 내 플랜 + 사용량 조회 (마이페이지, HAJA-177)
      description: >
        구독 소유 판별은 companyId 있으면 회사 구독(user_plans.company_id), 없으면 개인 구독(user_plans.user_id).
        "현재 구독"은 ACTIVE 우선, 없으면 UPGRADE_REQUESTED 순으로 조회하고 둘 다 없으면(EXPIRED 만 존재)
        PLAN_NOT_FOUND(404)다. limits.* 는 plans.max_* 가 null(무제한)이면 null 을 그대로 반환한다.
        `MembershipController.getMyPlan` 구현됨.
      security:
        - SessionCookie: []
      tags: [membership]
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyPlanApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 활성 구독 없음 (PLAN_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/me/seats:
    get:
      summary: 좌석 현황 조회 (마이페이지, HAJA-177)
      description: >
        개인 사용자(companyId=null)는 본인 1인만 담은 좌석 목록을 반환한다. 회사 소속 사용자는 회사 소속
        ACTIVE 사용자 목록(최대 200건, MEMBERSHIP_SEATS_MAX)을 반환하되 used(총원 수)는 이 상한과 무관하게
        정확한 count 쿼리로 산출한다. 이메일은 비마스킹(동일 회사 소속만 조회 가능한 내부 명부이므로).
        `MembershipController.getSeats` 구현됨.
      security:
        - SessionCookie: []
      tags: [membership]
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeatsApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 활성 구독 없음 (PLAN_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/me/plan/orders:
    post:
      summary: 결제 주문 생성 (토스페이먼츠 3-step 1단계, #988 / HAJA-489, 잔여기간 크레딧 #1146 / HAJA-550)
      description: >
        결제창을 열기 전에 서버가 주문을 선등록한다. **금액은 서버가 결정한다** — 요청 바디에 금액 필드가
        없고, 대상 플랜 정가(`plans.price_monthly`)에서 **현재 플랜의 잔여 기간 크레딧을 차감한 금액**을
        `payments`(status=READY) 행에 스냅샷으로 저장한다(#1146, B안 — 잔여 크레딧 차감 + 주기 리셋. 승인
        후 주기는 항상 `now ~ now+1개월`로 리셋된다). 크레딧 = 현재 플랜 정가 × 잔여일/주기일수(KST 기준
        달력일, 원 단위 내림) — `current_period_end` 가 없거나(FREE→유료 등) 만료가 지났으면 크레딧 0(정가
        청구). 차감 후 금액이 토스 최소 결제금액(100원) 미만이면 100원으로 올린다. 이 저장값이 이후 승인
        단계의 금액 위변조 대조 기준이며, **승인 시 재계산하지 않는다**(응답의 `listPrice`/`credit`/`amount`
        3필드가 안내 금액과 청구 금액을 일치시킨다).
        대상 플랜은 STANDARD/ENTERPRISE만 허용(FREE 는 INVALID_INPUT 400). 회사 구독은
        company.ownerUserId만, 개인 구독은 그 구독의 소유 사용자만 요청할 수 있다.
        이미 대상 플랜을 이용 중이면 청구 전에 PLAN_ACTIVE_SUBSCRIPTION_CONFLICT(409)로 거절한다.
        동일 소유주체·동일 플랜의 **유효한 READY 주문이 이미 있으면 새로 만들지 않고 그 주문을 반환**한다
        (주문 난립·중복 청구 방지) — 이때 `amount` 는 기존 스냅샷 그대로이고 `listPrice`/`credit` 만 현재
        정가 기준으로 다시 계산해 보여준다. READY 주문의 유효기간은 30분(`toss-payments.order-ttl`)이며
        만료분은 승인 단계에서 CANCELED 처리된다 — 요금 인상 전 주문을 쟁여두고 구가격으로 결제하는 것을
        막는다.
        `PaymentController.createOrder` 구현됨.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [membership]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planName]
              properties:
                planName: { type: string, enum: [STANDARD, ENTERPRISE], example: ENTERPRISE }
      responses:
        "200":
          description: 주문 생성(또는 유효 주문 재사용) 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentOrderApiResponse" }
        "400":
          description: FREE 대상 요청 등 잘못된 입력 (INVALID_INPUT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: >
            구독 소유자 아님 (PLAN_FORBIDDEN) 또는 상향이 아닌 전환 요청 (PLAN_CHANGE_NOT_PAYABLE) —
            하향·동일가 전환은 결제 대상이 아니므로 관리자 콘솔로 유도한다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 활성 구독 없음 (PLAN_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "409":
          description: >
            이미 대상 플랜 이용 중 (PLAN_ACTIVE_SUBSCRIPTION_CONFLICT) 또는 하향으로 한도를 넘는
            구성원·시설물이 생김 (PLAN_DOWNGRADE_CONFIRMATION_REQUIRED, #890) — 셀프 결제에는 확인
            단계가 없어 거절만 하고 관리자 콘솔의 change-preview → confirmOverflow 경로로 유도한다.
            데모 계정 요청도 여기서 거절한다 (DEMO_ACCOUNT_PROTECTED, #1626 — 읽기 위주 데모라 결제 차단).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "502":
          description: 결제 게이트웨이 미설정·호출 불가 (PAYMENT_GATEWAY_ERROR)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/me/payments/confirm:
    post:
      summary: 결제 승인 확정 (토스페이먼츠 3-step 3단계, #988 / HAJA-489)
      description: >
        결제창 성공 리다이렉트 후 프론트가 호출한다. 처리 순서는 ① 주문 조회·소유자 검증 ②
        **저장된 금액과 요청 금액 대조**(불일치 시 PG 호출 **전에** PAYMENT_AMOUNT_MISMATCH 400)
        ③ 토스 승인 API 호출 ④ PAID 기록 ⑤ UserPlan 전이 + 당월 사용량 이월(#851).
        토스로 전송되는 금액은 요청값이 아니라 **서버 저장 스냅샷**이다.


        **멱등** — 이미 PAID 인 orderId 재요청은 PG 재호출 없이 기존 결과를 200으로 반환한다(결제창
        리다이렉트 새로고침·중복 전송 대비). 승인은 성공했으나 응답을 받지 못한 경우(타임아웃·역직렬화
        실패)는 **FAILED 로 확정하지 않고 READY 를 유지**해 같은 orderId 재확정으로 복구할 수 있게 한다 —
        PG 가 명시적 실패 코드를 준 경우에만 FAILED 다.


        **PAYMENT_PLAN_APPLY_PENDING(409)** 은 "결제는 성공했고 플랜 반영만 남은 상태"다. 결제 실패로
        오인해 **재결제를 유도하면 중복 청구**가 되므로(환불은 범위 밖) 프론트는 반드시 안내 전용으로
        처리해야 한다.
        `PaymentController.confirm` 구현됨.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [membership]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentKey, orderId, amount]
              properties:
                paymentKey: { type: string, maxLength: 200, description: 토스 결제 키 }
                orderId: { type: string, maxLength: 64, description: 주문 생성 단계에서 서버가 발급한 값 }
                amount: { type: integer, description: 결제창에 표시된 금액(서버 저장값과 대조용, 청구에는 미사용) }
      responses:
        "200":
          description: 승인·전이 성공(또는 멱등 재요청) — 갱신된 내 플랜 반환
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyPlanApiResponse" }
        "400":
          description: 저장 금액과 불일치 (PAYMENT_AMOUNT_MISMATCH) — PG 호출 전 차단
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: >
            주문 없음·타인 주문·만료·이미 실패 처리된 주문 (PAYMENT_ORDER_NOT_FOUND) — 존재 여부를
            흘리지 않도록 타인 주문도 404 로 통일한다(FACILITY_NOT_FOUND 관례).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "409":
          description: >
            이미 대상 플랜 이용 중 (PLAN_ACTIVE_SUBSCRIPTION_CONFLICT — 청구 전 거절) 또는
            결제 성공·플랜 반영 대기 (PAYMENT_PLAN_APPLY_PENDING — **재결제 유도 금지**) 또는
            데모 계정 요청 (DEMO_ACCOUNT_PROTECTED, #1626 — PG 호출 전 거절).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "502":
          description: >
            PG 승인 거절·호출 실패 (PAYMENT_GATEWAY_ERROR). 결과 불명(타임아웃)인 경우 주문은 READY 로
            남아 같은 orderId 로 재확정할 수 있다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/me/payments:
    get:
      summary: 내 결제 이력 조회 (마이페이지 "결제 내역", #988 / HAJA-489)
      description: >
        본인이 생성한 주문만 최신순으로 반환한다(최대 `toss-payments.history-max-size`건).
        `paymentKey` 는 응답에 포함하지 않는다. `PaymentController.getPayments` 구현됨.
      security:
        - SessionCookie: []
      tags: [membership]
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentHistoryApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/me/plan/upgrade-inquiry:
    post:
      summary: 업그레이드 문의 (마이페이지, HAJA-177)
      description: >
        PG 실결제 대체 — 구독 상태를 UPGRADE_REQUESTED 로 전이한다(멱등). 회사 구독은 회사 대표
        (company.ownerUserId)만, 개인 구독은 그 구독의 소유 사용자만 요청할 수 있다(PLAN_FORBIDDEN).
        `MembershipController.requestUpgrade` 구현됨.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [membership]
      responses:
        "200":
          description: 문의 접수 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpgradeInquiryApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: 구독 소유자 아님 (PLAN_FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 활성 구독 없음 (PLAN_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/admin/plans:
    get:
      summary: 요금제 카탈로그 조회 (관리자 플랜·쿼터, FR-8-A #507)
      description: >
        제공 중인 전체 요금제 목록(플랜 변경 선택지). ADMIN 전용 — `/api/admin/**` 는 SecurityConfig 필터에서
        hasRole(ADMIN) 로 강제한다. `AdminPlanController.getPlanCatalog` 구현됨.
      security:
        - SessionCookie: []
      tags: [admin]
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPlanCatalogApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: ADMIN 아님 (FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/admin/plan:
    get:
      summary: 현재 회사 플랜 + 사용량 조회 (관리자 플랜·쿼터, FR-8-A #507)
      description: >
        요청 관리자 회사(company_id)의 현재 구독 요금제·한도와 이번 달 사용량(월 분석 장수 등). 회사 스코프는
        서비스가 company_id 로 강제하며, 그 회사에 유효한 승인 멤버십이 없으면(§2.6 미승인 멤버십은 상속 대상
        아님) 회사 플랜을 상속하지 않아 PLAN_NOT_FOUND(404)다. companyId 없는 관리자는 PLAN_FORBIDDEN(403).
        `AdminPlanController.getCurrentPlan` 구현됨.
      security:
        - SessionCookie: []
      tags: [admin]
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPlanApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: ADMIN 아님 / 회사 없는 관리자 (FORBIDDEN / PLAN_FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 상속 가능한 활성 구독 없음 (PLAN_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
    patch:
      summary: 회사 플랜 변경 (관리자 플랜·쿼터, FR-8-A #507)
      description: >
        요청 관리자 회사의 구독 요금제를 변경한다 — 기존 ACTIVE(또는 UPGRADE_REQUESTED) 구독을 EXPIRED 로
        내리고 신규 ACTIVE 구독을 발급하는 단일 트랜잭션 전이(table_design.md §user_plans). 변경 이력은
        user_plans 행으로 보존되어 `/api/admin/plan/history` 로 조회한다. 대상이 현재와 같고 이미 ACTIVE 면
        멱등 no-op(200, 이력 추가 없음). 동시 변경 경합은 PLAN_ACTIVE_SUBSCRIPTION_CONFLICT(409).
        하향(#890)으로 한도를 넘는 구성원·시설물이 생기면 `confirmOverflow=true` 없이는
        PLAN_DOWNGRADE_CONFIRMATION_REQUIRED(409)로 거절하고 **아무것도 바꾸지 않는다** — 무엇이
        정지·읽기전용이 되는지는 `/api/admin/plan/change-preview` 로 먼저 확인한다. 확인 후 전환하면
        초과 좌석이 SUSPENDED 로 전환되고(owner 제외, id 오름차순 유지) 초과 시설물은 읽기 전용이 된다
        (조회·기존 점검 이력은 유지, 신규 점검 생성만 차단). 월 분석 사용량은 되돌리지 않는다.
        `AdminPlanController.changePlan` 구현됨.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminPlanChangeRequest" }
      responses:
        "200":
          description: 변경 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPlanApiResponse" }
        "400":
          description: 잘못된 요금제명 (INVALID_INPUT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: ADMIN 아님 / 회사 없는 관리자 (FORBIDDEN / PLAN_FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 상속 가능한 활성 구독 없음 (PLAN_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "409":
          description: >
            동시 변경 경합 (PLAN_ACTIVE_SUBSCRIPTION_CONFLICT) 또는 하향 초과분 확인 필요
            (PLAN_DOWNGRADE_CONFIRMATION_REQUIRED, #890) — 후자는 confirmOverflow=true 로 재시도하면 해소된다.
            데모 계정 요청도 여기서 거절한다 (DEMO_ACCOUNT_PROTECTED, #1626 — 즉시/예약 변경 모두 차단).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/admin/plan/change-preview:
    get:
      summary: 회사 플랜 변경 미리보기 (#890)
      description: >
        이 요금제로 바꾸면 어떤 구성원이 정지되고 시설물 몇 개가 읽기 전용이 되는지 **부작용 없이**
        계산한다. requiresConfirmation=true 면 PATCH /api/admin/plan 에 confirmOverflow=true 를 실어야
        실제 변경된다. 인가는 PATCH 와 동일하게 회사 owner 한정 — 구성원 이름·이메일을 반환하므로
        조회 권한을 변경 권한보다 넓게 두지 않는다. `AdminPlanController.previewChange` 구현됨.
      security:
        - SessionCookie: []
      tags: [admin]
      parameters:
        - in: query
          name: planName
          required: true
          schema: { type: string, enum: [FREE, STANDARD, ENTERPRISE] }
        - in: query
          name: keepUserIds
          required: false
          description: >
            유지할 구성원 선택(#890 Phase 2) — **반복 쿼리 키**로 전달한다
            (`?planName=FREE&keepUserIds=1&keepUserIds=2`, 대괄호 없음). PATCH 바디의 keepUserIds 와
            같은 값을 넘겨야 미리보기와 실제 결과가 일치한다.
          schema:
            type: array
            items: { type: integer, format: int64 }
          style: form
          explode: true
      responses:
        "200":
          description: 미리보기 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPlanChangePreviewApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: >
            ADMIN 아님 / 회사 owner 아님 (FORBIDDEN / PLAN_FORBIDDEN) · keepUserIds 에 요청자 회사의
            ACTIVE 구성원이 아닌 id 포함 (PLAN_KEEP_USER_INVALID) · 선택 인원이 대상 요금제 좌석 수
            초과 (PLAN_SEAT_QUOTA_EXCEEDED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 상속 가능한 활성 구독 없음 (PLAN_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "409":
          description: >
            정지 후 ACTIVE 관리자가 한 명도 남지 않는 산출 (ADMIN_PROTECTED_ACCOUNT) — 회사가 관리
            불능이 되는 결과를 만들지 않기 위한 방어선이다. owner 는 항상 유지되므로 현행 경로에서는
            발화하지 않지만, 계약상 가능한 응답으로 명시한다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/admin/plan/scheduled-change:
    post:
      summary: 회사 플랜 하향 예약 (관리자 플랜·쿼터, #1105 / HAJA-526)
      description: >
        하향을 **즉시 적용하지 않고 다음 결제 주기에 적용**하도록 예약한다. 예약 시점에는 아무것도 바뀌지
        않는다 — 요금제도 좌석도 그대로이고, `current_period_end`에 도달하면 스케줄러가 무결제 전이 +
        초과 좌석 정지를 수행한다. 이미 낸 요금 기간을 온전히 쓰게 하려는 것이 목적이다.


        ⚠️ **유료→유료 하향은 킬 스위치로 게이팅된다**(#1177). 기본값은 **닫힘**이며 닫힌 상태에서는
        `PLAN_SCHEDULE_PAID_TARGET_UNSUPPORTED`(403)로 거절한다. 프론트가 유예 안내 UI(결제 마감·유예
        배너·결제 유도)를 갖추기 전까지는 이 스위치를 열지 않는다 — API 로만 진입하면 사용자가 **결제
        마감 안내를 받지 못한 채** 유예 만료 시 좌석 정지·FREE 강등을 맞기 때문이다.


        **스위치를 연 경우의 동작(미결제 유예, C안)**: 적용 시점에 대상 유료 요금제로 전환하되
        `payment_pending_until`(유예 마감)을 세운다. 유예 중에는 **한도·기능 플래그가 모두 FREE 기준**이라
        무결제로 얻는 유료 혜택이 없고, 마감 전에 정산 결제를 하면 정상 주기가 시작되며, 결제하지 않으면
        **FREE 로 강등**된다. 빌링키(정기결제)가 없어 무인 배치가 청구할 수단이 없다는 제약을 이렇게 우회한다
        — 새 유료 주기를 그냥 열면 **무결제로 유료 요금제가 발급**되는 결제 경로 우회가 된다
        (`PLAN_UPGRADE_REQUIRES_PAYMENT`와 같은 근거).


        ⚠️ **유예 진입 시점에 초과 좌석이 FREE 기준(1석)으로 정지**되고, 이후 결제해도 정지된 구성원은
        자동 복구되지 않는다(재활성화 필요). 유예 중 재예약은 `PLAN_SCHEDULE_PAYMENT_PENDING`(409)로 막는다.


        **상향도 이 경로로 받지 않는다** — 즉시 적용 + 결제가 필요하므로 `PLAN_SCHEDULE_NOT_DOWNGRADE`(403).
        상향 결제(`POST /api/me/plan/orders`)·관리자 즉시 변경(`PATCH /api/admin/plan`)·만료 강등(#1145)이
        일어나면 대기 중인 예약은 자동으로 무효화된다.


        ⚠️ `keepUserIds`는 실행 시점까지 보관되므로, 그 사이 퇴사·정지·타사 이동한 id는 실행 시 드롭한다.
        **드롭이 발생한 경우에만 그 수만큼** 자동 보충하며(owner는 항상 유지되므로 보충 예산을 쓰지 않는다),
        드롭이 없으면 신청 시점 선택을 그대로 존중한다 — 미리보기로 확인한 정지 규모가 보존된다.


        신청 시점에 확인한 정지 인원 수가 예약 행에 스냅샷된다. 실행 시점 정지 대상이 그 수를 초과하면
        (예약 이후 구성원이 늘어난 경우) 적용하지 않고 **FAILED로 종료**하며 상위 요금제를 유지한다
        (`PLAN_SCHEDULE_CONFIRMED_OVERFLOW_EXCEEDED`) — 확인받지 않은 규모로 사람을 정지시키지 않는다.
        FAILED 종료 시 owner에게 알림(`PLAN_DOWNGRADE_FAILED`)이 발행된다.
      security:
        - SessionCookie: []
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminScheduledPlanChangeRequest" }
      responses:
        "200":
          description: 예약 생성됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminScheduledPlanChangeApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: >
            ADMIN 아님 / 회사 owner 아님 (FORBIDDEN / PLAN_FORBIDDEN) · 상향은 예약 대상이 아님
            (PLAN_SCHEDULE_NOT_DOWNGRADE) · keepUserIds 에 요청자 회사의 ACTIVE 구성원이 아닌 id 포함
            (PLAN_KEEP_USER_INVALID) · 선택 인원이 대상 요금제 좌석 수 초과 (PLAN_SEAT_QUOTA_EXCEEDED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 상속 가능한 활성 구독 없음 (PLAN_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "409":
          description: >
            이미 대기 중인 예약 존재 (PLAN_SCHEDULED_CHANGE_EXISTS) · `current_period_end` 가 없어 실행
            기준일을 정할 수 없음 (PLAN_SCHEDULE_PERIOD_END_MISSING — FREE 무기한 구독 등) · 한도 초과를
            확인하지 않음 (PLAN_DOWNGRADE_CONFIRMATION_REQUIRED) · **미결제 유예 중이라 재예약 불가**
            (PLAN_SCHEDULE_PAYMENT_PENDING, #1177 — 유예→유예 사슬 방지. 먼저 정산 결제하거나 FREE 로
            즉시 변경해 유예를 벗어나야 한다)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
    delete:
      summary: 회사 플랜 하향 예약 취소 (관리자 플랜·쿼터, #1105 / HAJA-526)
      description: "대기 중인(PENDING) 하향 예약을 취소한다. 이미 적용·실패한 예약은 대상이 아니다."
      security:
        - SessionCookie: []
      tags: [admin]
      responses:
        "200":
          description: 예약 취소됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminScheduledPlanChangeApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: ADMIN 아님 / 회사 owner 아님 (FORBIDDEN / PLAN_FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 대기 중인 예약 없음 (PLAN_SCHEDULED_CHANGE_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

