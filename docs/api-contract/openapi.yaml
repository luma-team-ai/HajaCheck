              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: ADMIN 아님 / 회사 없는 관리자 (FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

    post:
      summary: 사용자 등록 (관리자 콘솔, #405, Figma node-id 1147-2649)
      description: >
        관리자가 직접 사용자 계정을 생성한다(ADMIN 전용). 등록된 계정은 요청한 관리자와 같은 회사에
        배선되고 role은 화이트리스트(ADMIN/INSPECTOR/USER)만 허용된다(그 외는
