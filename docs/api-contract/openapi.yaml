  /api/users/me/invite-code:
    post:
      summary: 초대 코드 적용 (#794)
      description: >
        발급받은 초대 코드를 입력해 회사 소속으로 전환한다(WAITING 상태 전용). WAITING이 아닌 계정의
        redeem 시도는 코드를 소비하지 않고 즉시 거부한다(AUTH_ACCOUNT_WAITING 아닌 상태 전이 예외 —
        griefing 방지, 정당한 WAITING 사용자가 코드를 계속 쓸 수 있도록). 코드가 유효하지 않거나
        만료됐으면 400(AUTH_INVITE_CODE_INVALID) — 발급 회사가 이미 삭제된 경우도 동일 응답으로
        통일한다(회사 존재 여부 비열거). 활성화 직전 좌석을 원자적으로 예약하므로 좌석이 가득 찬
        회사의 코드는 403(PLAN_SEAT_QUOTA_EXCEEDED)으로 거절된다. redeem 시도는 사용자당 rate-limit이
        걸려 있다(429). `UserController.redeemInviteCode` 구현됨.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteCodeRedeemRequest" }
      responses:
        "200":
          description: 적용 성공(회사 소속·ACTIVE로 전환된 사용자 정보)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserApiResponse" }
        "400":
          description: >
            입력값 검증 실패(INVALID_INPUT) | 유효하지 않거나 만료된 초대 코드(AUTH_INVITE_CODE_INVALID)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: 좌석 한도 초과 (PLAN_SEAT_QUOTA_EXCEEDED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 사용자 미존재 (USER_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "409":
          description: WAITING 상태가 아닌 계정의 redeem 시도 (INVALID_STATE_TRANSITION)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "429":
          description: 사용자당 redeem 시도 rate-limit 초과 (AUTH_TOO_MANY_REQUESTS)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }


  # ── platform-admin (플랫폼 관리자) ──
  /api/platform-admin/users:
    get:
      summary: 사용자 목록 조회 (플랫폼 관리자, #576)
      description: >
        검색(이름·이메일·기업명 부분일치, keyword)/필터(role·plan·status)/서버 페이징 + 전사 통계
        (PLATFORM_ADMIN 전용). AdminUserController(#405, "/api/admin/users")와 완전히 분리된 별도
        라우트로, companyId 스코프 없이 전사 사용자를 다룬다(PLATFORM_ADMIN 자신은 항상 목록에서
        제외). ⚠️ page는 0부터 시작한다(다른 platform-admin 목록 API 다수가 1부터 시작하는 것과
        다름 — PlatformAdminUserController 구현 그대로). stats(totalMembers/active/suspended/
        newThisWeek/newThisWeekGrowthRate)는 검색어·필터와 무관하게 전사 기준(PLATFORM_ADMIN 제외)으로
        집계하며, newThisWeek는 조회 시각 기준 롤링 7일 윈도우다. `PlatformAdminUserController.list`
        구현됨.
      security:
        - SessionCookie: []
      tags: [platform-admin]
      parameters:
        - name: keyword
          in: query
          description: 사용자 이름·이메일·소속 기업명 부분일치 검색(대소문자 무시)
          schema: { type: string }
        - name: role
          in: query
          schema: { type: string, enum: [ADMIN, INSPECTOR, USER, COUNSELOR, PLATFORM_ADMIN] }
        - name: plan
          in: query
          schema: { type: string, enum: [FREE, STANDARD, ENTERPRISE] }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, SUSPENDED, WAITING] }
        - name: page
          in: query
          description: 0부터 시작
          schema: { type: integer, default: 0, minimum: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 10, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformAdminUserListApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: PLATFORM_ADMIN 아님 (FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
    post:
      summary: 사용자 등록 (플랫폼 관리자, #576)
      description: >
        플랫폼 관리자가 사용자 계정을 직접 생성한다(PLATFORM_ADMIN 전용). companyId가 null이면 회사
        미소속(개인 계정)으로 등록된다. companyId를 지정하면 그 회사가 심사 승인(APPROVED) 상태여야
        하고(그 외는 리소스 존재 여부 열거 방지를 위해 미존재와 동일하게 404 COMPANY_NOT_FOUND), 회사
        좌석이 원자적으로 예약된다(잔여 좌석 없으면 409). role은 화이트리스트(ADMIN/INSPECTOR/USER/
        COUNSELOR)만 허용 — PLATFORM_ADMIN은 이 화면 밖의 축이라 지정 시 400. skill은 role=COUNSELOR일
        때만 의미가 있고(즉시 스킬 배정), 그 외 role이면 서버가 조용히 무시한다.
        `PlatformAdminUserController.create` 구현됨.
      security:
        - SessionCookie: []
        - XsrfToken: []
      tags: [platform-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformAdminUserCreateRequest" }
      responses:
        "201":
          description: 등록 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformAdminUserApiResponse" }
        "400":
          description: 입력값 오류(INVALID_INPUT) 또는 화이트리스트 밖 역할(ADMIN_ROLE_NOT_ASSIGNABLE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: PLATFORM_ADMIN 아님 (FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 지정한 companyId의 승인된 기업 없음 (COMPANY_NOT_FOUND)
