  /api/dashboard/upcoming-inspections:
    get:
      summary: 다가오는 점검 예정 시설물 조회 (대시보드 위젯, dev-03-02)
      description: >
        인증 사용자의 회사가 소유한(company_id) 시설물 중 next_inspection_due_at 이 오늘 이후이며 오늘부터
        days 일 이내로 임박한 것을 nextInspectionDueAt 오름차순으로 최대 limit 건 반환한다. 접근
        범위는 기존 대시보드 엔드포인트와 동일한 company_id 단일 스코프이며 companyId 는 세션 인증
        주체에서만 취득한다(요청 파라미터로 받지 않음, IDOR 방지). next_inspection_due_at 이 null 인
        시설물은 제외한다. 조회 결과가 0건이면 200 빈 배열.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [dashboard]
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 30, minimum: 1, maximum: 365 }
          description: 오늘부터 N일 이내 도래분 (기본 30, 최대 365)
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 5, minimum: 1 }
          description: 최대 반환 개수 (기본 5)
      responses:
        "200":
          description: 성공 (조회 0건이면 빈 배열)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpcomingInspectionListApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/inspections:
    post:
      summary: 점검(회차) 생성
      description: >
        인증 사용자의 유효 회사가 소유한 시설에만 점검 회차를 생성하고 담당 점검자를 지정한다.
        assignedInspectorId는 같은 회사 소속이며 ACTIVE인 INSPECTOR 또는 ADMIN만 허용하며,
        관리자와 담당 점검자에게도 타회사 시설 접근 예외는 없다.
        createdBy는 요청 바디가 아니라 인증 주체에서 서버가 기록한다.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [inspection]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InspectionCreateRequest" }
      responses:
        "201":
          description: 점검 회차 생성 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InspectionApiResponse" }
        "400":
          description: 입력값 또는 담당 점검자 상태/역할 오류
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: 시설 접근 권한 없음
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
    get:
      summary: 점검(회차) 목록 조회 (#725/HAJA-393, PR #891로 실구현 완료·PR#1032 사람검수 P2-3로 소급 계약화)
      description: >
        인증 사용자 소유 회사(회사 스코프)의 시설물에 속한 점검 회차를 상태/유형/점검일/회차/전체
        하자 건수/하자 조건으로 필터링해 페이지 단위로 반환한다. 배열 축은 배열 내부 OR, 서로 다른
        축은 AND다. defectType/defectGrade/defectStatus는 같은 비삭제 하자 하나가 주어진 조건을
        전부 만족해야 한다. defectCount는 하자 조건과 무관하게 해당 점검의 deleted=false 전체 하자
        건수이며 응답 defectCount와 동일한 집계다.
      security:
        - SessionCookie: []
      tags: [inspection]
      parameters:
        - name: facilityId
          in: query
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          description: 점검 진행 상태(복수 가능, 반복 키). 기존 단일 status 요청도 동일하게 동작한다.
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/InspectionStatusCode" }
        - name: inspectionType
          in: query
          description: 점검 유형(복수 가능, 반복 키)
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/InspectionTypeCode" }
        - name: inspectionDateFrom
          in: query
          description: 점검일 시작일(포함)
          schema: { type: string, format: date }
        - name: inspectionDateTo
          in: query
          description: 점검일 종료일(포함)
          schema: { type: string, format: date }
        - name: roundNoMin
          in: query
          description: 시설물 기준 점검 회차 하한(포함)
          schema: { type: integer, minimum: 1 }
        - name: roundNoMax
          in: query
          description: 시설물 기준 점검 회차 상한(포함)
          schema: { type: integer, minimum: 1 }
        - name: defectCountMin
          in: query
          description: 비삭제 전체 하자 건수 하한(포함)
          schema: { type: integer, format: int64, minimum: 0 }
        - name: defectCountMax
          in: query
          description: 비삭제 전체 하자 건수 상한(포함)
          schema: { type: integer, format: int64, minimum: 0 }
        - name: defectType
          in: query
          description: 하자 유형 필터(복수 가능, 반복 키 defectType=A&defectType=B — 대괄호 없는 형태)
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/DefectTypeCode" }
        - name: defectGrade
          in: query
          description: 하자 등급 필터(복수 가능, 반복 키)
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/DefectGradeCode" }
        - name: defectStatus
          in: query
          description: 하자 상태 필터(복수 가능, 반복 키)
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/DefectStatusCode" }
        - name: page
          in: query
          description: 0부터 시작하는 페이지 번호
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          description: 페이지 크기
          schema: { type: integer, minimum: 1, default: 20 }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InspectionListItemPageApiResponse" }
        "400":
          description: enum/날짜 형식/하한 또는 역전된 범위가 올바르지 않음(INVALID_INPUT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/inspections/{id}/media:
    post:
      summary: 촬영 데이터 업로드
      description: >
        점검 회차에 이미지(JPG/PNG)를 다중 업로드한다(dev-05-03). 업로드는 동기 처리(매직바이트 검증
        → 원본 저장 → 썸네일 재인코딩 → EXIF/GPS 추출 → DB 저장까지 한 요청 안에서 완료)되므로
        202(Accepted)이 아니라 201(Created)로 확정한다. 영상(VIDEO)·프레임 자동 추출은 후속 PR 범위.
        원본은 어떤 응답에도 직접 노출되지 않는다 — thumbnailUrl은 인가된 다운로드 API 경로다.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [media]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { type: string, format: binary }
      responses:
        "201":
          description: 업로드 성공(업로드된 각 파일에 대응하는 미디어 목록)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaListApiResponse" }
        "400":
          description: 파일 누락/형식 불일치(매직바이트 검증 실패)/용량 초과/개수 초과
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 점검 회차 미존재 또는 타인 소유(존재 여부 열거 방지 통일 응답)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
    get:
      summary: 점검 회차별 촬영 데이터(미디어) 목록 조회
      description: >
        점검 회차(inspection)에 업로드된 미디어 전체를 반환한다(하자 유무 무관, 분석 결과 뷰어 전용,
        #803). 결과뷰어가 하자 목록에서 역으로 이미지를 그룹핑하던 기존 방식은 하자가 0건인 사진을
        노출할 수 없었던 문제를 이 엔드포인트로 해소한다. 소유권은 점검 회차를 통해 검증하며,
        미존재와 타인 소유를 구분하지 않고 404로 통일한다(IDOR 방지).
      security:
        - SessionCookie: []
      tags: [media]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: 조회 성공(빈 배열 포함)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaListApiResponse" }
        "401":
          description: 미인증
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 점검 회차 미존재 또는 타인 소유(INSPECTION_NOT_FOUND, 존재 여부 열거 방지 통일 응답)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/media/{id}/thumbnail:
    get:
      summary: 미디어 썸네일 조회
      description: >
        재인코딩된 썸네일(JPEG, 그리드·지도팝업·리스트카드용, 400px 상한) 바이트를 반환한다. 원본은
        어떤 엔드포인트로도 직접 서빙하지 않는다(PRD FR-2 업로드 보안 검증). 분석 결과 뷰어(상세검수)
        전용 더 큰 해상도는 /api/media/{id}/detail 참조(#788/#789).
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [media]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: 썸네일 이미지(JPEG)
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401":
          description: 미인증
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 미디어 미존재 또는 타인 소유(존재 여부 열거 방지 통일 응답)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/media/{id}/detail:
    get:
      summary: 미디어 상세 이미지 조회
      description: >
        분석 결과 뷰어(상세검수) 전용 — 그리드용 썸네일(400px 상한)보다 큰 해상도(기본 1600px 상한)로
        재인코딩된 JPEG 바이트를 반환한다(#788/#789). 원본은 이 엔드포인트로도 직접 서빙하지 않는다
        (PRD FR-2). 업로드 시 생성해 저장한 상세 이미지를 그대로 읽어 반환하며, 그 이전(V13 마이그레이션
        전)에 업로드된 행은 저장된 상세 이미지가 없어 조회 시점에 원본에서 즉석 재인코딩한다.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [media]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: 상세 이미지(JPEG)
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401":
          description: 미인증
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 미디어 미존재 또는 타인 소유(존재 여부 열거 방지 통일 응답)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "503":
          description: >
            레거시(V13 이전) 행 즉석 생성 동시 처리 상한 초과(MEDIA_DETAIL_GENERATION_BUSY) — 잠시 후 재시도
            (PR머신 리뷰 P1, #789).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/inspections/{id}/analyze:
    post:
      summary: AI 분석 시작
      description: >
        점검 회차에 업로드된 이미지 전체에 대해 AI 하자 탐지를 비동기로 시작한다(202 즉시 반환, 본문
        없음 — 진행률은 GET 폴링). 소유권은 점검 회차를 통해 검증하며 미존재/타인 소유 모두 404로
        통일한다. `InspectionAnalysisController.analyze` 구현 완료 — 구 TODO 스텁을 실구현 기준으로
        갱신(2026-08-05 계약 전수 최신화).
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [inspection]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "202":
          description: 분석 시작 수락(비동기, 본문 없음)
        "400":
          description: 분석할 이미지가 없음 (ANALYSIS_NO_MEDIA)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 점검 회차 미존재 또는 타인 소유 (INSPECTION_NOT_FOUND, 존재 여부 열거 방지 통일 응답)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "409":
          description: 이미 분석 진행 중 (ANALYSIS_ALREADY_RUNNING) 또는 검수 완료·보고서화 회차 재분석 (ANALYSIS_NOT_ALLOWED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "503":
          description: 분석 큐 포화 (ANALYSIS_QUEUE_FULL) / 회사별 동시 실행 제한 (ANALYSIS_COMPANY_CONCURRENCY_LIMIT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
    get:
      summary: AI 분석 진행 상태 조회
      description: >
        점검 회차의 AI 분석 진행률을 폴링용으로 반환한다(dev-05-04, API 명세서 v0.3 AP-006 연장).
        Redis 진행률 캐시를 우선 쓰고 캐시가 없으면(TTL 만료·서버 재기동 등) DB(defects 실측치)로
        최선 재구성한다 — 분석이 끝난 적 없는 회차는 stage=upload/progressPercent=0으로, 완료 이력이
        있으면 stage=done/progressPercent=100으로 재구성한다. 캐시는 있지만 하트비트(updatedAt)가
        15분 넘게 갱신되지 않았으면 워커 크래시로 보고 stage=failed로 바꿔 반환한다(읽기 전용이라
        DB/Redis 실제 상태는 건드리지 않음 — 실제 복구는 POST 재시작에서 일어난다). 소유권은 점검
        회차를 통해 검증하며 미존재/타인 소유 모두 404로 통일한다.
      security:
        - SessionCookie: []
      tags: [inspection]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalysisStatusApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: 회사 멤버십 없음/회수·만료 (FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 점검 회차 미존재 또는 타인 소유 (INSPECTION_NOT_FOUND, 존재 여부 열거 방지 통일 응답)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
    delete:
      summary: AI 분석 취소
      description: >
        진행 중인 AI 분석을 취소한다("한 번에 하나만" 정책, 2026-07-27 팀 결정) — 분석 실행/상태 화면
        이탈 확인창의 "나가기" 클릭 시 호출된다. 세대 토큰을 새로 발급해 워커를 펜싱하는 방식으로
        구현되며(워커의 다음 DB 쓰기 직전 토큰 불일치를 감지해 스스로 중단, successCount==0이면 월
        분석 사용량도 보상), 이 메서드 자체는 워커 종료를 기다리지 않고 즉시 반환한다. 회차 상태가
        ANALYZING이 아니면(이미 완료/실패로 종료됐거나 애초에 시작 전) 아무 효과 없이 성공 처리한다
        (멱등). 소유권은 점검 회차를 통해 검증하며 미존재/타인 소유 모두 404로 통일한다.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [inspection]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204":
          description: 취소 성공 또는 이미 ANALYZING이 아니어서 멱등하게 무시됨(본문 없음)
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: 회사 멤버십 없음/회수·만료 (FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 점검 회차 미존재 또는 타인 소유 (INSPECTION_NOT_FOUND, 존재 여부 열거 방지 통일 응답)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/inspections/{id}/defects/deleted:
    get:
      summary: 오탐 삭제된 하자 목록 조회
      description: >
        점검 회차에서 **검수자가 오탐으로 삭제한** 하자와 그 사유·일시·삭제자를 반환한다(#1399).
        삭제 사유는 삭제 시점에 1~500자 필수로 받아 `defect_revisions`에 저장돼 있었으나, 모든 하자
        조회가 `is_deleted=false` 필터라 어느 화면에서도 읽을 수 없었다 — PRD FR-4의 "감사용
        defect_revisions 화면 노출"을 오탐 삭제분까지 확장한다.
        ⚠️ `is_deleted=true` 에는 두 종류가 섞여 있다: ⓐ 검수자 오탐 판정 ⓑ 재분석 시
        통째로 소프트삭제된 구버전. **ⓐ만 반환한다** — ⓑ를 되살리면 이미 대체된 유령 하자가
        화면·통계에 부활한다. 구분 기준은 `defect_revisions`에 `field_changed='is_deleted'`,
        `new_value='true'` 이력이 있는지다(ⓑ는 이력이 없다).
        소유권은 본인 회사 시설물만 허용하며 미존재와 타인 소유를 404로 통일한다(IDOR 방지).
        정렬은 `id ASC`, 페이지네이션 없음(일반 하자 목록과 동일 가정).
      security:
        - SessionCookie: []
      tags: [defect]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: 조회 성공(빈 배열 포함)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletedDefectListApiResponse" }
        "401":
          description: 미인증
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 점검 회차 미존재 또는 타인 소유(INSPECTION_NOT_FOUND, 존재 여부 열거 방지 통일 응답)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/inspections/{id}/defects:
    get:
      summary: 분석 결과(하자 목록) 조회
      description: >
        점검 회차(inspection) 하나에 속한 하자 전체를 반환한다(뷰어·검수 공용, FR-4). 소유권은
        본인 소유 시설물만 허용하며, 미존재와 타인 소유를 구분하지 않고 404로 통일한다(IDOR 방지).
        `defects.is_deleted=false`만 반환하고(오탐 삭제된 항목 제외), 정렬은 `id ASC`로 고정한다
        (프론트 오버레이 번호가 탐지 순서와 어긋나지 않도록). 페이지네이션 없음 — 한 회차의 하자
        수는 뷰어가 한 화면에 그릴 수 있는 범위로 가정(대량이면 후속 별도 이슈).
      security:
        - SessionCookie: []
      tags: [defect]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: 조회 성공(빈 배열 포함)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefectDetailListApiResponse" }
        "401":
          description: 미인증
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 점검 회차 미존재 또는 타인 소유(INSPECTION_NOT_FOUND, 존재 여부 열거 방지 통일 응답)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
    post:
      summary: 수동 하자 생성
      description: >
        AI 분석 누락된 하자를 검수자가 직접 등록한다(FR-4, HAJA-344 #622). 소유권은 점검 회차(inspection)를
        통해 검증하며, 미존재와 타인 소유를 구분하지 않고 404로 통일한다(IDOR 방지). type은 필수이며,
        bbox는 선택적이나 4개(bboxX, Y, W, H) 모두 지정하거나 모두 미지정해야 한다. grade는 선택적이며
        미지정 시 미검수 상태(isReviewed=false)로 저장된다. 생성된 하자는 항상 status=DETECTED,
        confidence=1.0(사람 확인 = 최고 신뢰도), isDeleted=false로 초기화된다.
      security:
        - SessionCookie: []
      tags: [defect]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DefectCreateRequest" }
      responses:
        "200":
          description: 생성 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefectApiResponse" }
        "400":
          description: 입력 오류 (type 누락, bbox 불완전 등)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 점검 회차 미존재 또는 타인 소유(INSPECTION_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/defects:
    get:
      summary: 하자 목록 검색·필터 (FR-012, 계획/미구현)
      description: >
        서버가 인증 주체의 companyId와 일치하는 회사 소유 시설물(facilities.company_id) 범위를 먼저 계산한다.
        요청자 자신의 companyId가 없거나 현재 DB 기준 회사·멤버십 소속이 유효하지 않으면 시설 경유 접근을
        거부한다. 관리자 전체 조회와 assigned_inspector_id 기반 타회사 접근 예외는 없다. 모든 역할에서
        defects.is_deleted=false를 강제한다. 아래 쿼리
        파라미터는 이 서버 유도 소유권 범위를 좁히는 용도로만 사용하며 클라이언트 입력으로 범위를 확장할 수
        없다. 정렬은 created_at DESC, id DESC로 고정해 페이지 간 결과 순서를 안정적으로 유지한다.
      security:
        - SessionCookie: []
      tags: [defect]
      parameters:
        - name: type
          in: query
          description: 하자 유형 코드 목록(콤마 구분)
          style: form
          explode: false
          schema:
            type: array
            uniqueItems: true
            items: { $ref: "#/components/schemas/DefectTypeCode" }
        - name: grade
          in: query
          description: 하자 등급 코드 목록(콤마 구분)
          style: form
          explode: false
          schema:
            type: array
            uniqueItems: true
            items: { $ref: "#/components/schemas/DefectGradeCode" }
        - name: status
          in: query
          description: 하자 상태 코드 목록(콤마 구분)
          style: form
          explode: false
          schema:
            type: array
            uniqueItems: true
            items: { $ref: "#/components/schemas/DefectStatusCode" }
        - name: confidenceMin
          in: query
          description: AI 탐지 신뢰도 하한(0~1)
          schema: { type: number, format: double, minimum: 0, maximum: 1 }
        - name: page
          in: query
          description: 0부터 시작하는 페이지 번호
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          description: 페이지 크기(최대 100)
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: 소유권·논리 삭제·필터 조건을 모두 만족하는 하자 페이지
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefectListApiResponse" }
        "401":
          description: 미인증
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: >
            인증됐지만 이 엔드포인트를 사용할 역할이 아님. 허용된 역할이지만 소유·배정 범위에
            결과가 없거나 필터/논리 삭제 조건 적용 후 0건이면 403이 아니라 200 빈 페이지를 반환한다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/defects/nl-search:
    post:
      summary: 하자 자연어 검색 공개 게이트웨이 (FR-013, 계획/미구현)
      description: >
        세션 인증과 점검자 또는 회사 관리자 역할을 검사하고 has_ai_addon=true인 활성 플랜만 허용한다.
        회사 플랜은 회사 status=APPROVED, verification_status=VERIFIED 및 company_memberships의
        유효한 승인 멤버십(status=APPROVED, 미회수, 미만료, users.company_id 일치)을 모두 검증하며
        users.company_id만으로 상속하지 않는다. 게이트 실패 시 내부
        FastAPI를 호출하지 않는다. 성공한 요청만 내부 POST /ai/nl-search로 전달하고 내부 오류 코드에서
        예외·토큰 값을 제거한 뒤 Spring ApiResponse로 보존한다.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [defect, ai]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NlSearchRequest" }
      responses:
        "200":
          description: 변환 성공 또는 전달된 LLM 오류 — success 필드로 구분
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NlSearchApiResponse" }
        "400":
          description: 빈 질의 또는 trim 후 500자 초과(INVALID_INPUT/VALIDATION_ERROR)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: 점검자·회사 관리자 권한 없음 또는 AI 부가 기능 미보유(AI_ADDON_REQUIRED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "502":
          description: AI 응답의 필터 enum·배열 고유성·범위 제약 위반(AI_INVALID_RESPONSE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/defects/{id}:
    patch:
      summary: 검수 — 오탐 수정·등급 조정 (defect_revisions append-only)
      description: >
        점검자가 하자를 검수한다(FR-4, 휴먼 인 더 루프). `grade`(등급 조정) 또는 `isDeleted`(오탐 삭제,
        Soft Delete) 중 **정확히 하나**만 지정한다 — 둘 다 지정하거나 둘 다 생략하면 400. 각 변경은
        `defects` 테이블을 직접 덮어쓰지 않고 `defect_revisions`에 append-only 이력(누가·언제·무엇을·왜)을
        별도로 남긴다. `revisedBy`는 세션 사용자로 서버가 채우며 요청 바디에 포함하지 않는다.
        이미 RESOLVED 상태인 하자는 등급을 더 바꿀 수 없다(Defect.review 도메인 가드 — 409). **상태(status)
        전이는 이 엔드포인트의 책임이 아니다** — 검수확정 이후 상태 흐름은 #17 전용 API가 담당한다.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [defect]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DefectRevisionRequest" }
      responses:
        "200":
          description: 검수 반영된 하자 상세
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefectApiResponse" }
        "400":
          description: grade/isDeleted 둘 다 지정 또는 둘 다 누락, reason 누락 등(INVALID_INPUT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 하자 미존재 또는 타인 소유(DEFECT_NOT_FOUND, 존재 여부 열거 방지 통일 응답)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "409":
          description: RESOLVED 상태인 하자의 등급 변경 시도(INVALID_STATE_TRANSITION)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
    get:
      summary: 하자 상세 조회
      description: >
        하자 1건 상세를 반환한다(`DefectController.get` 구현됨 — 실구현은 있었으나 미문서였던 것을
        #970/HAJA-437 계약화 시 소급 반영). 인가는 `companyScopeGuard.requireEffectiveMembership` +
        `findByIdAndCompanyId`(회사 스코프 + 소프트삭제 제외) 조합이며, 미존재·타사 소유 모두
        404(DEFECT_NOT_FOUND) 통일 응답이다(존재 여부 열거 방지). 상세 조회에서만
        `assigneeName`(시설물 담당자)·`actionAssigneeName`을 채우고, 목록(GET /api/defects)은 N+1 방지를
        위해 두 이름을 조회하지 않는다.
      security:
        - SessionCookie: []
      tags: [defect]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: 하자 상세
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefectResponseApiResponse" }
        "401":
          description: 미인증
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: 회사 멤버십 없음/회수·만료(회사 스코프 가드)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 하자 미존재 또는 타사 소유(DEFECT_NOT_FOUND, 통일 응답)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/defects/{id}/location:
    patch:
      summary: 하자 위치 사후 편집 (#970 갭3)
      description: >
        검수자가 하자 위치 텍스트를 사후에 편집한다(조치 등록 흐름과 별개). 빈 문자열/공백은 서버가
        null로 정규화하므로 "위치 지우기"도 같은 엔드포인트로 처리한다. 상태 전이 규칙과 무관하며
        소프트삭제된 하자만 거부된다. 인가는 GET /api/defects/{id}와 동일(회사 스코프 + 404 통일).
        ⚠️ 이 응답은 `assigneeName`/`actionAssigneeName`이 채워지지 않는다(후속 #1107/HAJA-528에서 정정 예정).
        `DefectController.updateLocation` 구현됨.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [defect]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DefectLocationUpdateRequest" }
      responses:
        "200":
          description: 편집 반영된 하자 상세
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefectResponseApiResponse" }
        "400":
          description: location 300자 초과(VALIDATION_ERROR)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: 회사 멤버십 없음/회수·만료(회사 스코프 가드)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 하자 미존재 또는 타사 소유(DEFECT_NOT_FOUND, 통일 응답)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/defects/{id}/action:
    patch:
      summary: 조치 결과 등록 (HAJA-393/#725, targetStatus 도입 #1128)
      description: >
        하자 상세 모달 조치 등록 폼("상태 저장" 버튼)의 제출 대상. 조치 후 사진(actionMediaId)·조치 내용·
        조치일·담당자 4개 필드를 한 번에 저장하면서 **targetStatus로 상태를 전이**한다.

        - targetStatus 허용 값은 **IN_PROGRESS / RESOLVED** 두 개뿐이다. DETECTED·CONFIRMED는 조치 등록의
          타겟이 될 수 없어 400(INVALID_INPUT)으로 거부된다.
        - 실제 전이 가능 여부는 기존 정방향 한 단계 규칙(Defect#changeStatus)을 그대로 따른다 —
          **CONFIRMED→IN_PROGRESS**, **IN_PROGRESS→RESOLVED** 만 사유 없이 허용되고, 건너뛴 전이
          (예: CONFIRMED→RESOLVED)나 종료 상태(RESOLVED)에서의 재등록은 거부된다(폼에 사유 입력란이 없음).
        - actionAssigneeId는 `GET /api/facilities/assignable-users`(#690)와 동일 자격 조건
          (활성·INSPECTOR/ADMIN·유효 승인 멤버십)으로 검증하고, actionMediaId는 **해당 하자와 같은 점검 소속
          media인지** 확인해 타 점검/타사 media 연결과 cross-company IDOR을 차단한다.
        - 전이가 성공하면 defect_revisions에 `status` 변경 이력(이전 상태 → **실제 전이된 상태**)을 남긴다.

        `DefectController.registerActionResult` 구현됨.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [defect]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DefectActionResultRequest" }
      responses:
        "200":
          description: 조치 결과가 반영된 하자 상세(actionAssigneeName 포함)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefectResponseApiResponse" }
        "400":
          description: >
            필수 필드 누락·조치 내용 2000자 초과(VALIDATION_ERROR), targetStatus가 IN_PROGRESS/RESOLVED가
            아님, 또는 건너뛴 전이(INVALID_INPUT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: 회사 멤버십 없음/회수·만료(회사 스코프 가드) 또는 담당자 자격 불충족
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: >
            하자 미존재 또는 타사 소유(DEFECT_NOT_FOUND) · 조치 후 사진이 해당 점검 소속이 아님
            (MEDIA_NOT_FOUND) — 둘 다 통일 응답
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "409":
          description: 종료 상태(RESOLVED)에서의 재전이 등 상태 전이 가드 위반(INVALID_STATE_TRANSITION)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/defects/{id}/previous-defect:
    patch:
      summary: 회차 간 대응 하자 확정 (HAJA-437)
      description: >
        검수자가 화면에서 확인한 **이전 회차의 대응 하자 id**를 확정 저장한다(자동 매칭 알고리즘은 이번
        스코프 밖 — 사람이 확정한 것만 저장). previousDefectId는 (a) 같은 회사 스코프 (b) 같은 시설물
        (c) 현재 하자보다 더 이전 회차(roundNo가 더 작음)를 모두 만족해야 하며, 하나라도 어긋나면
        **미존재·타사 소유까지 포함해 전부 400(DEFECT_PREVIOUS_DEFECT_INVALID)** 으로 통일 응답한다
        (어느 조건이 깨졌는지 노출하지 않아 타사 하자 id 존재 여부 추정을 차단). 자기 자신 지정은
        회차 비교(같은 회차는 "더 이전"이 아님)로 자연 거부된다.
        ⚠️ 이 응답은 `assigneeName`/`actionAssigneeName`이 채워지지 않는다(후속 #1107/HAJA-528에서 정정 예정).
        `DefectController.confirmPreviousDefect` 구현됨.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [defect]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DefectPreviousDefectUpdateRequest" }
      responses:
        "200":
          description: 확정 반영된 하자 상세
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefectResponseApiResponse" }
        "400":
          description: >
            previousDefectId 누락(VALIDATION_ERROR) 또는 대응 하자 조건 불충족·미존재·타사 소유
            (DEFECT_PREVIOUS_DEFECT_INVALID)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: 회사 멤버십 없음/회수·만료(회사 스코프 가드)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 대상 하자 미존재 또는 타사 소유(DEFECT_NOT_FOUND, 통일 응답)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/inspections/{inspectionId}/reports:
    parameters:
      - name: inspectionId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      summary: 보고서 초안 생성 (#446 / HAJA-283)
      description: >
        점검의 확정 하자(CONFIRMED/IN_PROGRESS/RESOLVED, DETECTED 제외)를 근거로
        AiProxyService(`/api/ai/report`)를 호출해 AI 보고서 초안(DRAFT)을 생성한다. 확정 하자가 0건이어도
        빈 목록으로 정상 진행한다(결함 없는 정상 점검도 유효한 보고서 유스케이스). 소유권 검증은
        InspectionService.getInspection 에 위임 — 미존재/타인 소유 모두 404 통일 응답.
        grounding 결과가 즉시 기록되며(비동기 아님) `passed=false`여도 초안 자체는 생성된다(확정만 차단).
        `ReportController.generateDraft` 구현됨.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [report]
      responses:
        "201":
          description: 초안 생성 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportDetailApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 점검 미존재 또는 타인 소유 (INSPECTION_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "502":
          description: REPORT_GENERATION_FAILED(내부 AI 프록시가 논리적으로 생성을 거부)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
    get:
      summary: 보고서 버전 목록 (#446 / HAJA-283)
      description: >
        점검에 속한 보고서를 버전 내림차순으로 반환한다. 소유권 검증은 InspectionService.getInspection 에
        위임(미존재/타인 소유 모두 404). `ReportController.listReports` 구현됨.
      security:
        - SessionCookie: []
      tags: [report]
      responses:
        "200":
          description: 조회 성공(0건이면 빈 배열)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportSummaryListApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 점검 미존재 또는 타인 소유 (INSPECTION_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/reports:
    get:
      summary: 회사 보고서 목록
      description: >
        현재 인증 사용자가 소속된 회사의 보고서를 필터·페이지·정렬 조건으로 조회한다.
        page는 0부터 시작하며 기본 size는 10, 기본 정렬은 updatedAt 내림차순이다.
      security:
        - SessionCookie: []
      tags: [report]
      parameters:
        - name: facilityId
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ReportStatusCode" }
        - name: query
          in: query
          required: false
          description: 시설물명·보고서 검색어
          schema: { type: string, default: "" }
        - name: period
          in: query
          required: false
          description: 기간 필터. 미지정 시 ALL
          schema: { type: string, default: ALL }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 10 }
        - name: sort
          in: query
          required: false
          description: "Spring Pageable 정렬 표현식(예: updatedAt,desc)"
          schema: { type: string, default: "updatedAt,desc" }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyReportListApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/reports/summary:
    get:
      summary: 회사 보고서 요약
      description: 현재 인증 사용자가 소속된 회사의 보고서 상태별 KPI를 조회한다.
      security:
        - SessionCookie: []
      tags: [report]
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyReportSummaryApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/reports/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: 보고서 상세 조회 (#446 / HAJA-283)
      description: >
        보고서 단건을 콘텐츠(JSON, 파싱된 구조)와 함께 조회한다. 미존재/타인 소유(점검 기준 소유권) 모두
        REPORT_NOT_FOUND(404)로 통일 응답한다(MediaService.getThumbnail 과 동일 패턴).
        `ReportController.getReport` 구현됨.
      security:
        - SessionCookie: []
      tags: [report]
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportDetailApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 미존재 또는 타인 소유 (REPORT_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
    patch:
      summary: 보고서 본문 수정 (#446 / HAJA-283)
      description: >
        DRAFT 상태 보고서의 본문(JSON 문자열)을 수정한다. 이미 확정(FINALIZED)된 보고서는
        INVALID_STATE_TRANSITION(409)로 거부한다. 수정 시 이전 콘텐츠에 대한 grounding 판정
        (groundingCheckPassed/groundingWarnings)은 항상 null 로 초기화된다 — 바뀐 본문은 재검증 전까지
        확정할 수 없다(finalizeReport 는 groundingCheckPassed=true 를 요구). `ReportController.updateContent` 구현됨.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [report]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateReportContentRequest" }
      responses:
        "200":
          description: 수정 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportDetailApiResponse" }
        "400":
          description: INVALID_INPUT(빈 값 또는 유효하지 않은 JSON)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 미존재 또는 타인 소유 (REPORT_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "409":
          description: 이미 확정된 보고서 (INVALID_STATE_TRANSITION)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
    delete:
      summary: 보고서 초안 삭제 (ReportController, #446 / HAJA-283)
      description: >
        DRAFT 상태 보고서만 soft delete 처리한다. 이미 확정(FINALIZED)된 보고서는
        INVALID_STATE_TRANSITION(409)로 거부한다(Report.markDeleted → requireDraft).
        미존재/타인 소유(점검 기준 소유권) 모두 REPORT_NOT_FOUND(404)로 통일 응답한다.
        `ReportController.deleteDraftReport` 구현됨.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [report]
      responses:
        "200":
          description: 삭제 성공 (data=null)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoidApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 미존재 또는 타인 소유 (REPORT_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "409":
          description: DRAFT 가 아님(이미 확정된 보고서) (INVALID_STATE_TRANSITION)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/reports/{id}/grounding-recheck:
    post:
      summary: 보고서 근거 재검증(구조 검증) (#680 / HAJA-374)
      description: >
        AI 서버 재호출 없이 본문(detail.items)과 확정 하자 목록을 유형+등급 기준으로 대조해
        grounding 판정을 복구한다 — 편집(PATCH) 후 확정이 막힌 DRAFT 보고서에만 사용한다.
        `ReportController.recheckGrounding` 구현됨.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [report]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 재검증 완료 및 보고서 상세 반환
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportDetailApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 미존재 또는 타인 소유 (REPORT_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "409":
          description: 이미 확정된 보고서 (INVALID_STATE_TRANSITION)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/reports/{id}/finalize:
    post:
      summary: 보고서 확정 (#446 / HAJA-283)
      description: >
        근거 검증(groundingCheckPassed=true)을 통과한 DRAFT 보고서만 pdfUrl과 함께 FINALIZED로 확정한다.
        groundingCheckPassed 가 true 가 아니면(false 또는 아직 미기록) INVALID_STATE_TRANSITION(409).
        pdfUrl 은 이 보고서의 업로드 엔드포인트(`/api/reports/{id}/pdf/{storageKey}`) prefix 로 시작해야
        하며(#455 P2-2, 임의 문자열·타 보고서 pdfUrl 재사용 차단), 아니면 REPORT_PDF_URL_INVALID(400).
        확정 후 재요청은 이미 FINALIZED 상태이므로 INVALID_STATE_TRANSITION(409)로 거부된다(비멱등).
        `ReportController.finalizeReport` 구현됨.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [report]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinalizeReportRequest" }
      responses:
        "200":
          description: 확정 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportDetailApiResponse" }
        "400":
          description: REPORT_PDF_URL_INVALID(pdfUrl이 이 보고서의 업로드 경로가 아님)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 미존재 또는 타인 소유 (REPORT_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "409":
          description: 근거 검증 미통과 또는 이미 확정됨 (INVALID_STATE_TRANSITION)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/reports/{id}/pdf:
    post:
      summary: 보고서 PDF 업로드 (#446 / HAJA-283, #455 P2-3)
      description: >
        확정용 PDF 파일을 저장하고 접근 URL(`/api/reports/{id}/pdf/{storageKey}`)을 반환한다(별도로
        `/finalize` 요청에 전달). content-type이 application/pdf가 아니면 거부하고, 실제 바이트도 PDF
        매직넘버(%PDF-)로 시작하는지 검증한다(content-type 헤더 스푸핑 방지). 업로드 전 보고서 소유권을
        검증한다(존재하지 않거나 타인 소유 보고서에 대한 업로드 차단). `ReportController.uploadPdf` 구현됨.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [report]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: 업로드 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportPdfApiResponse" }
        "400":
          description: FILE_REQUIRED | FILE_INVALID_TYPE(PDF 아님, 매직넘버 불일치 포함) | FILE_TOO_LARGE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 보고서 미존재 또는 타인 소유 (REPORT_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/reports/{id}/pdf/{storageKey}:
    get:
      summary: 보고서 PDF 다운로드 (#446 / HAJA-283, #455 P2-1)
      description: >
        업로드된 보고서 PDF를 소유권 검증 후 스트리밍한다. 정적 리소스 핸들러로 직접 서빙하지 않는
        이유가 이 소유권 검증(IDOR 방지)을 강제하기 위함이다 — 미존재/타인 소유 모두 REPORT_NOT_FOUND(404),
        저장된 파일 자체가 없으면 FILE_NOT_FOUND(404). `ReportController.downloadPdf` 구현됨.
      security:
        - SessionCookie: []
      tags: [report]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: storageKey
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PDF 파일 다운로드 성공
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 보고서 미존재/타인 소유 (REPORT_NOT_FOUND) 또는 저장된 파일 없음 (FILE_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/notifications:
    get:
      summary: 알림 목록 조회
      description: >
        AP-020(#25 / HAJA-38 FR-9). 로그인 사용자에게 온 알림을 읽음/미읽음 모두 포함해(센터는 이력 표시)
        생성일 최신순(동률 시 id desc) 상위 30건으로 반환한다. 수신자(userId)는 인증 주체에서만 취득하며
        요청 파라미터/바디로 받지 않는다(cross-owner IDOR 방지). 이 엔드포인트는 조회만 다룬다 —
        읽음처리는 PATCH /api/notifications/{id}/read(HAJA-274), 삭제는 DELETE /api/notifications/{id},
        이벤트 발행(트리거)은 별도 계약(후속).
      security:
        - SessionCookie: []
      tags: [notification]
      responses:
        "200":
          description: 조회 성공(알림이 없으면 빈 배열)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationListApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/notifications/{id}/read:
    patch:
      summary: 알림 읽음 처리
      description: >
        HAJA-274(FR-9). 로그인 사용자 소유의 알림을 읽음 상태로 전환한다. 이미 읽은 알림에 대한
        재요청도 200으로 성공 처리하는 멱등 연산이다. 수신자(userId)는 인증 주체에서만 취득하며,
        미존재 또는 타인 소유 알림은 리소스 존재 열거(cross-user IDOR)를 막기 위해 모두 404로 통일 응답한다.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [notification]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 읽음 처리 성공(멱등 — 이미 읽음도 200)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoidApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 미존재 또는 타인 소유 (NOTIFICATION_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/notifications/{id}:
    delete:
      summary: 알림 삭제
      description: >
        FR-9. 알림 센터에서 개별 알림의 닫기(X)를 누르면 해당 알림을 삭제한다(notifications 행 물리 삭제 —
        알림은 파생 통지라 보존하지 않는다). 읽음 여부와 무관하게 삭제하며, 수신자(userId)는 인증 주체에서만
        취득한다. 미존재 또는 타인 소유 알림은 리소스 존재 열거(cross-user IDOR)를 막기 위해 모두 404로
        통일 응답한다(읽음 처리와 동일 원칙).
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [notification]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 삭제 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoidApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 미존재 또는 타인 소유 (NOTIFICATION_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/counsel/tickets:
    post:
      summary: 상담 티켓 생성
      description: >
        FR-7(#20/HAJA-33). 시나리오 리프(leadsToCounselor=true)에서 상담원 연결을 요청하면 WAITING 상태의
        티켓을 생성한다. `has_counselor_access=true` 활성 플랜 게이트를 통과해야 하며(회사 소속이면 유효한
        승인 멤버십까지 확인), category/title 은 시나리오 트리를 타고 올라가 스냅샷으로 저장한다(트리 변경과
        무관하게 이력 고정). `CounselTicketController.createTicket` 구현됨.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [counsel]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CounselTicketCreateRequest" }
      responses:
        "201":
          description: 생성 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CounselTicketApiResponse" }
        "400":
          description: 유효하지 않은 scenarioId 형식 (INVALID_INPUT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: >
            has_counselor_access 플랜 미보유/미승인 멤버십 (COUNSEL_PLAN_REQUIRED) 또는
            leadsToCounselor=false 리프로 진입 (COUNSEL_TICKET_FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 시나리오 노드 없음 (COUNSEL_SCENARIO_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "500":
          description: >
            category→counselType 매핑 누락 (COUNSEL_TYPE_MAPPING_NOT_FOUND) 또는 참조 Plan 행 없음
            (PLAN_DATA_INVALID) — 둘 다 데이터 정합성 오류.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

    get:
      summary: 상담 대기열 조회
      description: >
        FR-7(#20/HAJA-33). 상태별 티켓 목록(생성순 FIFO, 기본 WAITING), 페이지네이션. **COUNSELOR/
        PLATFORM_ADMIN 전용**(SecurityConfig requestMatchers — 대기열 조회는 role 게이트로 엔드포인트
        레벨에서 강제). `CounselTicketController.getQueue` 구현됨.
      security:
        - SessionCookie: []
      tags: [counsel]
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/CounselTicketStatus"
            default: WAITING
        - name: page
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CounselTicketSummaryPageApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: COUNSELOR/PLATFORM_ADMIN 아님 (FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/counsel/tickets/mine:
    get:
      summary: 내 상담 이력 조회
      description: >
        FR-7(#20/HAJA-33). 요청자 본인의 상담 티켓 목록(최신순). `status=ALL`(기본) 또는 특정 상태 필터.
        userId 는 인증 주체(세션)에서만 취득하며 요청 파라미터로 받지 않는다(cross-owner IDOR 방지).
        `CounselTicketController.getMyTickets` 구현됨.
      security:
        - SessionCookie: []
      tags: [counsel]
      parameters:
        - name: status
          in: query
          description: "\"ALL\"(기본, 필터 없음) 또는 CounselTicketStatus 값"
          schema: { type: string, default: ALL }
        - name: page
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CounselTicketSummaryPageApiResponse" }
        "400":
          description: status 가 ALL 도, 유효한 CounselTicketStatus 도 아님 (INVALID_INPUT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/counsel/tickets/admin:
    get:
      summary: 플랫폼 관리자 날짜별 상담 목록
      description: >
        #1168. 접수일(`createdAt`) 기준 특정 날짜에 접수된 상담 티켓 전체를 최신순으로 반환한다
        (고객 프로필 4필드 포함). **PLATFORM_ADMIN 전용** — 컨트롤러에서 role 을 확인해 그 외 역할은
        COUNSEL_TICKET_FORBIDDEN(403). 날짜 경계는 서버 JVM 기본 타임존 기준
        `[date 00:00:00.000000, date 23:59:59.999999]`(다음날 자정 -1μs) 폐구간으로 계산한다 — PG
        timestamp 가 마이크로초 정밀도라 -1ns 로 끊으면 저장 시 자정으로 올림돼 다음날 티켓이 섞인다.
        `CounselTicketController.getAdminTicketsByDate` 구현됨.
      security:
        - SessionCookie: []
      tags: [counsel]
      parameters:
        - name: date
          in: query
          required: true
          description: "조회할 접수일(YYYY-MM-DD). 누락·형식 오류 모두 400 INVALID_INPUT."
          schema: { type: string, format: date, example: "2026-07-30" }
        - name: page
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
        - name: size
          in: query
          description: "상한 100 — 초과 시 100으로 클램프(거부 아님). 0 이하는 기본값 20."
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: >
            조회 성공. `content[]` 는 CounselTicketSummaryResponse 이며 이 경로에서만 고객 프로필 4필드
            (customerName/customerEmail/customerPlan/customerJoinedAt)가 채워진다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CounselTicketSummaryPageApiResponse" }
        "400":
          description: date 누락 또는 YYYY-MM-DD 형식 아님 (INVALID_INPUT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: PLATFORM_ADMIN 아님 (COUNSEL_TICKET_FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/counsel/tickets/{id}/messages:
    get:
      summary: 상담 대화 조회
      description: >
        FR-7(#20/HAJA-33). 티켓의 전체 대화 이력(시간순). 당사자(사용자 본인/담당 상담원) 또는
        PLATFORM_ADMIN — 비당사자·미존재 모두 열거 방지를 위해 통일된 404로 응답한다.
        (PLATFORM_ADMIN 우회는 #1168/PR #1205 에서 관리자 콘솔 드릴다운을 위해 추가됐다.)
        `CounselTicketController.getMessages` 구현됨.
      security:
        - SessionCookie: []
      tags: [counsel]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 조회 성공(대화 없으면 빈 배열)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessageListApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 미존재 또는 비당사자 (COUNSEL_TICKET_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/counsel/tickets/{id}/export:
    get:
      summary: 대화 내보내기
      description: >
        FR-7(#20/HAJA-33). 티켓의 전체 대화를 평문 텍스트(.txt, UTF-8)로 다운로드한다. 당사자
        (사용자 본인/담당 상담원)만 — 비당사자·미존재 모두 통일된 404. 응답은 JSON envelope 이 아니라
        `Content-Disposition: attachment` 가 붙은 원시 바이트 스트림이다. `CounselTicketController.
        exportTranscript` 구현됨.
      security:
        - SessionCookie: []
      tags: [counsel]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 다운로드 성공
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="C-20260727-1.txt"' }
          content:
            text/plain:
              schema: { type: string, format: binary }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 미존재 또는 비당사자 (COUNSEL_TICKET_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/counsel/tickets/{id}/assign:
    post:
      summary: 상담 티켓 셀프-클레임 배정
      description: >
        FR-7(#20/HAJA-33). 대기(WAITING) 티켓에 자기 자신을 배정하고 COUNSEL 세션을 생성한다(자동 push-배정
        대신 상담원이 대기열에서 직접 집는 pull 모델). **COUNSELOR/PLATFORM_ADMIN 전용**. 스킬 기반 라우팅
        (#743/#772)으로 `counselor_skills`에 티켓 counselType 처리 자격이 없으면 거부한다. 동시 클레임 경합은
        `@Version` 낙관적 락이 감지해 한쪽만 성공하고 다른 쪽은 409(COUNSEL_SESSION_ASSIGNMENT_CONFLICT)로
        표면화한다 — 티켓이 이미 WAITING 이 아닌 경우도 동일 코드. 성공 시 티켓 사용자에게
        `/user/queue/counsel/assigned` 로 실시간 알림을 보낸다(§ WS 서술 참조).
        `CounselTicketController.assign` 구현됨.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [counsel]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 배정 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CounselTicketApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: >
            COUNSELOR/PLATFORM_ADMIN 아님 (FORBIDDEN), 상담사 미존재 (COUNSEL_TICKET_FORBIDDEN) 또는
            해당 counselType 처리 자격 없음 (COUNSEL_SKILL_MISMATCH)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 티켓 없음 (COUNSEL_TICKET_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "409":
          description: >
            이미 WAITING 이 아니거나(선점됨) 동시 클레임 경합으로 낙관적 락 충돌
            (COUNSEL_SESSION_ASSIGNMENT_CONFLICT) — 클라이언트는 대기열을 새로고침해 재시도한다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/counsel/tickets/{id}/resolve:
    post:
      summary: 상담 종료
      description: >
        FR-7(#20/HAJA-33). 담당 상담원 본인 또는 PLATFORM_ADMIN 이 상담을 종료한다(RESOLVED 전이 + 세션
        종료). 성공 시 티켓 사용자에게 `/user/queue/counsel/ended` 로 실시간 알림을 보낸다(§ WS 서술 참조).
        `CounselTicketController.resolve` 구현됨.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [counsel]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 종료 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CounselTicketApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: 담당 상담원 본인도 PLATFORM_ADMIN 도 아님 (COUNSEL_TICKET_FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 티켓 없음 (COUNSEL_TICKET_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/counsel/tickets/{id}/leave-offline:
    post:
      summary: 오프라인 이탈
      description: >
        FR-7(#20/HAJA-33). 티켓 소유 사용자 본인만 허용 — WAITING/IN_PROGRESS 티켓을 OFFLINE_LEFT 로
        전이하고 세션을 종료한다. 타인 소유 티켓은 미존재와 통일된 404(cross-user IDOR 열거 방지).
        `CounselTicketController.leaveOffline` 구현됨.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [counsel]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 이탈 처리 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CounselTicketApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 미존재 또는 타인 소유 (COUNSEL_TICKET_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/counsel/tickets/{id}/note:
    get:
      summary: 상담원 비공개 메모 조회
      description: >
        #1021/HAJA-503. 고객에게 노출되지 않는 상담원 전용 메모(티켓당 1개)를 조회한다. **담당 상담원
        본인만** — 요청자가 티켓의 counselorId 와 다르거나 아직 아무에게도 배정되지 않은 티켓
        (counselorId=null)이면 403(COUNSEL_TICKET_FORBIDDEN). 아직 메모가 없으면 200 + content=null
        (빈 메모)로 응답한다(404 아님). SecurityConfig 의 role 게이트는 COUNSELOR/PLATFORM_ADMIN 이지만
        실질 인가는 서비스의 담당자 검증이므로 PLATFORM_ADMIN 도 담당 상담원이 아니면 403이다.
        `CounselTicketController.getNote` 구현됨.
      security:
        - SessionCookie: []
      tags: [counsel]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 조회 성공(메모 없으면 content=null)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CounselTicketNoteApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: >
            COUNSELOR/PLATFORM_ADMIN 아님 (FORBIDDEN) 또는 담당 상담원 본인 아님/미배정 티켓
            (COUNSEL_TICKET_FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 티켓 없음 (COUNSEL_TICKET_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
    put:
      summary: 상담원 비공개 메모 저장
      description: >
        #1021/HAJA-503. 상담원 전용 메모를 저장한다 — upsert(없으면 생성, 있으면 갱신). **담당 상담원
        본인만**(403 규칙은 조회와 동일). content 는 null/빈 문자열도 허용해 메모 초기화에 쓰며, 4000자를
        넘으면 400. `CounselTicketController.saveNote` 구현됨.
      security:
        - SessionCookie: []
          XsrfToken: []
