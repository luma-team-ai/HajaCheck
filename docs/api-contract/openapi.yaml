      description: >
        로그인 사용자 소유 시설물의 점검을 시설물/상태(한글 라벨)/텍스트(시설물명·담당자명)로
        필터링해 페이지 단위로 반환한다. /api/dashboard/recent-inspections(위젯, 상위 10건 고정)와
        별개 엔드포인트다 — 위젯 호출 경로에는 영향이 없다. status 는 "분석중"/"검수대기"/"검수확정"/"완료"
        4개 한글 라벨만 인식하며(RECENT_STATUS_LABEL_GROUPS), 그 외 값은 INVALID_INPUT(400). size 는
        최대 100으로 캡되고(RECENT_SEARCH_MAX_SIZE), page 는 상한이 없지만 offset(page*size)이
        int 범위를 넘으면 500 대신 빈 페이지를 반환한다(PR머신 검수 P3 반영). query 는 시설물명 또는
        담당자명 부분일치(LIKE, 와일드카드 문자는 리터럴로 이스케이프)다. `DashboardController.searchRecentInspections` 구현됨.
