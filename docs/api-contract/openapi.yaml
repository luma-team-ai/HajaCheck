        전월/전주 대비 변화율을 반환한다. 스냅샷 테이블이 없어 changeRate 는 근사치로 계산한다 —
        totalFacilitiesChangeRate 는 누적 시설물 수 기준, 나머지는 점검/하자 생성시각 기준 이번 달·주
        vs 지난 달·주 비교. 분모가 0이면 분자>0일 때만 100%, 그 외 0%로 처리한다. companyId 는 인증
        주체에서만 취득한다(cross-company IDOR 방지). `DashboardController.getSummary` 구현됨.
