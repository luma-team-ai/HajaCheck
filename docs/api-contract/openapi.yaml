        companyId 스코프 없이 플랫폼 전체를 집계한다. kpi.analysisRequests와 monthlySummary[].
        analysisCount는 필드명은 "요청"이지만 실제 값은 분석한 이미지 장수다(#1407 후속, frontend
        라벨과 정합). counselTypeDistribution은 현재 항상 빈 배열이다(counsel_tickets에 유형 분류
        컬럼이 아직 없음 — 사용자 지시로 범위 밖, 후속 이슈에서 채움). analysisRequests/counselCount는
        "이번 기간"(최근 6개월 추이 윈도우) 누적치로 monthlySummary 각 행의 analysisCount/counselCount
        합계와 항상 일치한다. `PlatformAdminStatsController.getStats` 구현됨.
      security:
        - SessionCookie: []
      tags: [platform-admin]
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformAdminServiceStatsApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: PLATFORM_ADMIN 아님 (FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/platform-admin/monitoring:
    get:
      summary: 시스템 모니터링 조회 (플랫폼 관리자, #728)
      description: >
        서버 헬스체크(API 서버/AI 분석 서버/DB) + 서버 자원(CPU/메모리/디스크, Actuator MetricsEndpoint
        기준 현재 시점 라이브 값 — 시계열 아님) + 최근 에러 로그(PLATFORM_ADMIN 전용). jobQueue는
        inspections 테이블 기준 최근 N건 실데이터(#1408) — status 매핑은 CREATED/UPLOADING/ANALYZING
        → IN_PROGRESS, ANALYZED/REVIEWED/REPORTED → COMPLETED이며 FAILED/WAITING은 DB에 대응
        상태가 아직 없어 현재는 나오지 않는다(계약 값 자체는 프론트 호환을 위해 유지). errorLogs[].
        timestamp는 "yyyy-MM-dd HH:mm:ss"(Asia/Seoul) 포맷 문자열이다. `PlatformAdminMonitoringController
        .getMonitoring` 구현됨.
      security:
        - SessionCookie: []
      tags: [platform-admin]
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemMonitoringApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: PLATFORM_ADMIN 아님 (FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }


  # ── counsel·채팅 세션 ──
  /api/counsel/scenarios/roots:
    get:
      summary: 최상위 시나리오 버튼 목록
      description: >
        FR-7(#20/HAJA-33). 버튼 선택형 챗봇 첫 화면의 최상위 버튼 목록(parent_id IS NULL,
        sortOrder 오름차순)을 반환한다. 로그인 사용자면 누구나 접근 가능(SecurityConfig
        anyRequest().authenticated()). 시나리오 트리는 조회 전용이며 관리자 시드로만 관리한다.
        `BotScenarioController.getRoots` 구현됨.
      security:
        - SessionCookie: []
      tags: [counsel]
      responses:
        "200":
          description: 조회 성공(트리가 비어 있으면 빈 배열)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BotScenarioButtonListApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/counsel/scenarios/{id}:
    get:
      summary: 시나리오 노드 상세
      description: >
        FR-7(#20/HAJA-33). 노드의 응답 텍스트(responseText)와 자식 버튼 목록(sortOrder 오름차순)을
        반환한다. leadsToCounselor=true 인 리프 노드는 프론트에서 "상담원 연결"
        (POST /api/counsel/tickets)로 이어진다. `BotScenarioController.getNode` 구현됨.
      security:
        - SessionCookie: []
      tags: [counsel]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BotScenarioNodeApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 노드 없음 (COUNSEL_SCENARIO_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/counsel/tickets/{id}:
    get:
      summary: 상담 티켓 단건 조회(#1506)
      description: >
        FR-7(#20/HAJA-33). WS 재연결 등으로 놓친 상태 변경을 REST로 백필하기 위한 폴백. 당사자
        (사용자 본인/담당 상담원) 또는 PLATFORM_ADMIN — 비당사자·미존재 모두 열거 방지를 위해 통일된
        404로 응답한다(PLATFORM_ADMIN 은 미존재만 404). `CounselTicketController.getTicket` 구현됨.
      security:
        - SessionCookie: []
      tags: [counsel]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CounselTicketApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 미존재 또는 비당사자 (COUNSEL_TICKET_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/counsel/tickets/{id}/customer-history:
    get:
      summary: 고객 상담 이력
      description: >
        FR-7(#20/HAJA-33, #1001 후속). 이 티켓(id)의 담당 상담원 본인 또는 PLATFORM_ADMIN이 그
        고객(ticket.userId)의 과거 상담 이력을 조회한다(최신순 최대 20건, 현재 조회 중인 티켓 자신은
        제외). userId만으로 임의 고객의 이력을 열람하지 못하게 "지금 담당 중인 티켓"이라는 정당한
        접점을 요구한다(resolve와 동일한 인가 패턴). `CounselTicketController.getCustomerHistory`
        구현됨.
      security:
        - SessionCookie: []
      tags: [counsel]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 조회 성공(이력 없으면 빈 배열)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CounselTicketSummaryListApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: 담당 상담원 본인도 PLATFORM_ADMIN 도 아님 (COUNSEL_TICKET_FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 티켓 없음 (COUNSEL_TICKET_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/counsel/tickets/{id}/customer-history/{historyId}/messages:
    get:
      summary: 고객 이력 티켓 대화 조회
      description: >
        FR-7(#20/HAJA-33, #1001 후속). customer-history 목록에 나온 과거 티켓(historyId)의 대화
        내용을 조회한다. historyId 티켓의 담당자가 요청자와 달라도(과거에 다른 상담원이 처리),
        "지금 담당 중인 id 티켓과 같은 고객(userId)의 티켓인가"로 접근을 허용한다 — 다른 고객의
        티켓 id 를 끼워 넣으면 미존재와 통일된 404. `CounselTicketController.getCustomerHistoryMessages`
        구현됨.
      security:
        - SessionCookie: []
      tags: [counsel]
      parameters:
        - name: id
          in: path
          required: true
          description: 현재 담당 중인 앵커 티켓 id
          schema: { type: integer, format: int64 }
        - name: historyId
          in: path
          required: true
          description: 조회할 과거 상담 티켓 id
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 조회 성공(대화 없으면 빈 배열)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessageListApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: 앵커 티켓(id)의 담당 상담원 본인도 PLATFORM_ADMIN 도 아님 (COUNSEL_TICKET_FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: >
            앵커 티켓 없음 또는 historyId 티켓이 없거나 앵커와 같은 고객 소유가 아님
            (COUNSEL_TICKET_NOT_FOUND — 열거 방지 통일 응답)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/counsel/tickets/{ticketId}/attachments:
    post:
      summary: 상담 첨부 업로드
      description: >
        FR-7(#20/HAJA-33). 이미지(JPG/PNG) 1건을 업로드하고 저장키(attachmentKey)를 반환한다.
        티켓 당사자(사용자 본인/담당 상담원)만 — 비당사자·미존재 모두 통일된 404. 매직바이트(파일
        시그니처)로 선언된 Content-Type 을 재검증하며 불일치 시 400. 프론트는 이 저장키를 WS
        `/app/counsel/{ticketId}/send` 메시지 바디에 실어 보내고, 서버가 `chat_messages`에 직접
        스냅샷한다(Media 도메인 테이블에는 기록하지 않음). `CounselAttachmentController.upload`
        구현됨.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [counsel]
      parameters:
        - name: ticketId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 업로드할 이미지(JPG/PNG, 최대 20MB — MediaUploadProperties 공용 정책)
      responses:
        "201":
          description: 업로드 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CounselAttachmentApiResponse" }
        "400":
          description: >
            파일 미첨부 (FILE_REQUIRED), 매직바이트 불일치·허용 외 형식 (FILE_INVALID_TYPE) 또는
            용량 초과 (FILE_TOO_LARGE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 미존재 또는 비당사자 (COUNSEL_TICKET_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/counsel/tickets/{ticketId}/messages/{messageId}/attachment:
    get:
      summary: 상담 첨부 조회
      description: >
        FR-7(#20/HAJA-33). 메시지에 첨부된 이미지 원본 바이트를 반환한다. 티켓 당사자(사용자
        본인/담당 상담원)만 — 원본을 정적 URL 로 노출하지 않고 매 요청 인가한다. messageId 가
        이 ticketId 의 세션 소속이 아니면(다른 티켓 메시지 id 대입) 열거 방지를 위해 첨부 없음과
        동일한 404. 개인 대화라 `Cache-Control: no-store, private` 로 공유 캐시(프록시/CDN)를
        금지한다. `CounselAttachmentController.getAttachment` 구현됨.
      security:
        - SessionCookie: []
      tags: [counsel]
      parameters:
        - name: ticketId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: messageId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 조회 성공 — 원본 이미지 바이트(Content-Type=image/jpeg 또는 image/png)
          headers:
            Cache-Control:
              schema: { type: string, example: "no-store, private" }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: >
            티켓 미존재·비당사자, 메시지가 이 티켓 세션 소속이 아님, 또는 메시지에 첨부 없음
            (COUNSEL_TICKET_NOT_FOUND 또는 FILE_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/chat-sessions:
    post:
      summary: 채팅 세션 생성
      description: >
        #1467/HAJA-647. 로그인 사용자 소유의 채팅 세션을 생성한다(RAG 챗봇은 sessionType=RAG). 소유자
        (userId)는 `@AuthenticationPrincipal` 에서만 취득하며 요청 바디로 받지 않는다 — 임의 사용자
        명의 세션 생성을 막기 위함. `ChatSessionController.createSession` 구현됨.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [counsel]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatSessionCreateRequest" }
      responses:
        "201":
          description: 생성 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSessionApiResponse" }
        "400":
          description: sessionType 누락/유효하지 않은 값 (VALIDATION_ERROR)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/chat-sessions/{sessionId}/messages:
    get:
      summary: 채팅 세션 이력 조회
      description: >
        #1467/HAJA-647. 세션의 메시지를 생성순으로 반환하며, RAG 답변이 인용한 근거
        (chat_message_citations)를 메시지별로 함께 실어 새로고침 후에도 출처를 복원할 수 있게 한다.
        세션 식별자는 요청자가 보내는 입력값이므로 신뢰하지 않고 (id, userId) 복합 조건으로 조회한다
        — 세션 소유자만 조회 가능하며, 타인 세션·미존재 세션은 모두 동일하게 403(열거 방지 통일
        응답, COUNSEL_TICKET_FORBIDDEN 관례와 동일). `ChatSessionController.findMessages` 구현됨.
      security:
        - SessionCookie: []
      tags: [counsel]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 조회 성공(메시지 없으면 빈 배열)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSessionMessageListApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: 미존재 또는 타인 소유 (CHAT_SESSION_FORBIDDEN — 열거 방지 통일 응답)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }


  # ── facilities·inspections·defects 보강 ──
  /api/facilities/assignable-users:
    get:
      summary: 배정 가능한 담당자 목록 조회 (#690)
      description: >
        로그인 사용자의 회사 소속 사용자 중 시설물/점검/조치 담당자로 배정 가능한(활성·INSPECTOR
        또는 ADMIN이며 유효한 승인 멤버십을 보유) 목록을 반환한다. email은 노출하지 않는 경량 DTO다
        (배정 피커 UI는 id/name/role만 필요 — PR머신 리뷰 P3, #690). 점검 생성(assignedInspectorId)·
        조치 담당자(actionAssigneeId) 지정 폼이 공통으로 사용하는 옵션 소스다. ⚠️ 요청자 자신이 이
        회사의 유효 승인 멤버십을 갖고 있지 않으면(companyId 없음 포함) 400 AUTH_INVALID_INSPECTOR로
        거부한다(다른 엔드포인트의 companyScopeGuard 403 FORBIDDEN 패턴과 다름 — 실 구현 그대로 반영).
      security:
        - SessionCookie: []
      tags: [facility]
      responses:
        "200":
          description: 조회 성공(빈 배열 포함)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssignableUserListApiResponse" }
        "400":
          description: 요청자 본인이 이 회사의 유효 승인 멤버십이 없음 (AUTH_INVALID_INSPECTOR)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/facilities/status:
    get:
      summary: 시설물 현황 목록 조회 (#540 ⑥, HAJA-378)
      description: >
        로그인 사용자의 회사가 소유한 시설물의 현황(초기등급·다음점검일·D-day·담당자·최근점검일·
        점검주기·최근 점검유형)을 반환한다 — 대시보드 스타일 현황 테이블 화면 전용. initialGrade는
        시설물 등록 시 입력한 정적 값으로 점검 이력 기반 동적 등급과는 별개 개념이다. dDay는 호출
        시점(today, KST) 기준 nextInspectionDueAt까지 잔여일이며 다음 점검일이 없으면 null이다.
        inspectionType은 Facility 자체에 "기본 점검유형" 컬럼이 없어 가장 최근 점검 회차의 유형을
        근사값으로 재사용한다(점검 이력 없으면 null). 회사당 최대 500건까지만 반환하며(FACILITY_LIST_MAX,
        초과분은 서버 로그로만 경고) 시설물이 없으면 빈 배열을 반환한다.
      security:
        - SessionCookie: []
      tags: [facility]
      responses:
        "200":
          description: 조회 성공(빈 배열 포함)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FacilityStatusListApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: 회사 멤버십 없음/회수·만료 (FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/facilities/{id}/inspections:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: 시설물 점검 이력 조회 (#1359/HAJA-616)
      description: >
        로그인 사용자의 회사가 소유한 시설물의 전체 점검 회차 이력과 집계(전체 등급/회차수/누적
        하자/미조치 건수)를 반환한다 — 시설물 상세 "점검 이력" 탭 전용. overallGrade는
        facilities.initial_grade와 완전히 다른 개념으로, 최신 회차 하자 중 최악 등급의 계산값이며
        null이면 최신 회차에 등급이 매겨진 하자가 없다는 뜻이다. 점검 이력이 없으면
        overallGrade=null, totalRounds=0, history=[]로 응답한다. 최신 회차에만 이전 회차 대비 변화
        메모(changeNote, 비교 가능한 상태일 때만)와 미리보기 썸네일(최대 2장)이 채워진다. 미존재/타인
        소유 모두 404 FACILITY_NOT_FOUND로 통일한다.
      security:
        - SessionCookie: []
      tags: [facility]
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FacilityInspectionOverviewApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: 회사 멤버십 없음/회수·만료 (FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 미존재 또는 타인 소유 (FACILITY_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/facilities/{facilityId}/media:
    parameters:
      - { name: facilityId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: 시설물 대표 사진 목록 조회 (#632/#652)
      description: >
        시설물에 등록된 대표 사진을 id 오름차순으로 반환한다. 점검 회차 미디어와 같은 MediaResponse를
        재사용하지만, 이 목록의 각 항목은 point-in-time 점검이 아니라 시설물에 직접 귀속되므로
        inspectionId는 항상 null이다. 소유권은 FacilityService.get()과 동일하게 회사 스코프로
        검증하며, 미존재/타인 소유 모두 404 FACILITY_NOT_FOUND로 통일한다.
      security:
        - SessionCookie: []
      tags: [media]
      responses:
        "200":
          description: 조회 성공(빈 배열 포함)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaListApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: 회사 멤버십 없음/회수·만료 (FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 미존재 또는 타인 소유 (FACILITY_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
    post:
      summary: 시설물 대표 사진 업로드 (#632/#652)
      description: >
        시설물 대표 사진(JPG/PNG)을 다중 업로드한다. 시설물당 최대 4장까지만 허용하며(기존 보유분 +
        이번 업로드 합계 기준, 애플리케이션 레벨 카운트) 초과 시 파일을 하나도 저장하지 않고
        400(FACILITY_PHOTO_COUNT_EXCEEDED)으로 거부한다. 전체 파일을 먼저 매직바이트로 검증한 뒤
        all-or-nothing으로 저장한다(하나라도 실패하면 아무것도 저장하지 않음). 원본은 어떤 응답에도
        직접 노출되지 않는다 — thumbnailUrl/detailUrl은 인가된 다운로드 API 경로다.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [media]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  items: { type: string, format: binary }
                  description: >
                    JPG/PNG만 허용(매직바이트 검증). 기존 보유분 + 이번 업로드 합계가 시설물당 4장을
                    넘으면 전체 요청이 거부된다.
      responses:
        "201":
          description: 업로드 성공(업로드된 각 파일에 대응하는 미디어 목록)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaListApiResponse" }
        "400":
          description: >
            파일 누락(FILE_REQUIRED)/형식 불일치(매직바이트 검증 실패, FILE_INVALID_TYPE)/용량 초과
            (FILE_TOO_LARGE)/시설물당 4장 초과(FACILITY_PHOTO_COUNT_EXCEEDED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: 회사 멤버십 없음/회수·만료 (FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 미존재 또는 타인 소유 (FACILITY_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/inspections/{id}:
    get:
      summary: 점검 회차 단건 조회
      description: >
        점검 회차 상세를 반환한다. 소유권은 회사 스코프로 검증하며, 시설물이 미존재/타인 소유이면
        (FacilityService.get()이 FACILITY_NOT_FOUND를 던지는 경우) InspectionService.getInspection이
        이를 INSPECTION_NOT_FOUND로 변환해 통일 응답한다(존재 여부 열거 방지).
      security:
        - SessionCookie: []
      tags: [inspection]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InspectionApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: 회사 멤버십 없음/회수·만료 (FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 점검 회차 미존재 또는 타인 소유 (INSPECTION_NOT_FOUND, 존재 여부 열거 방지 통일 응답)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/inspections/{id}/confirm-review:
    post:
      summary: 점검 회차 검수 확정 (ANALYZED → REVIEWED)
      description: >
        결과 뷰어 "점검 요약" 버튼 클릭 시 호출된다. 이미 REVIEWED/REPORTED면 아무 효과 없이
        성공 처리한다(멱등). ANALYZED가 아니면(아직 분석 전/진행 중 등) 409 INSPECTION_REVIEW_NOT_READY로
        거부하고, 미검수(is_reviewed=false)인 비삭제 하자가 하나라도 남아 있으면 409
        INSPECTION_REVIEW_INCOMPLETE로 거부한다. 상태 전이는 "여전히 ANALYZED일 때만" 전이하는
        조건부 UPDATE로 처리되며, 사전 체크 이후 다른 요청(재분석 선점 등)이 먼저 상태를 바꿨으면
        409 INSPECTION_ROUND_CONFLICT로 재시도를 안내한다(재조회 없이 클라이언트 재진입으로 자연
        해소). 소유권은 회사 스코프로 검증하며 미존재/타인 소유 모두 404로 통일한다.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [inspection]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: 확정 성공 또는 이미 REVIEWED/REPORTED라 멱등하게 무시됨 (data=null)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoidApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: 회사 멤버십 없음/회수·만료 (FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 점검 회차 미존재 또는 타인 소유 (INSPECTION_NOT_FOUND, 존재 여부 열거 방지 통일 응답)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "409":
          description: >
            아직 ANALYZED가 아님(INSPECTION_REVIEW_NOT_READY) · 미검수 하자가 남아 있음
            (INSPECTION_REVIEW_INCOMPLETE) · 사전 체크 이후 상태가 먼저 바뀜(INSPECTION_ROUND_CONFLICT,
            재시도 안내)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/defects/{id}/status:
    patch:
      summary: 하자 상태 전이 (HAJA-26 2차)
      description: >
        신규(DETECTED)→검수확정(CONFIRMED)→조치중(IN_PROGRESS)→조치완료(RESOLVED) 순서의 정방향
        한 단계 전이는 사유 없이 허용한다. 역행/건너뛰기 전이(조치완료에서의 이탈 포함)는 reason이
        있어야 하며 없으면 400 INVALID_INPUT이다. 현재 상태와 동일한 상태로 요청하면 409
        INVALID_STATE_TRANSITION이다. 신규(DETECTED)에서 벗어나려면 등급이 먼저 확정돼 있어야
        한다(없으면 400 INVALID_INPUT, #1397). 같은 사진(mediaId)의 하자들은 한 그룹으로 함께
        전이된다(#1556/#1583) — 앞으로 진행시키는 요청은 정방향 한 단계로 따라올 수 있는 멤버만,
        되돌리는 요청은 앞선 멤버까지 함께 전이한다(이미 목표 상태인 멤버는 제외). 그룹 내 하나라도
        거부되면 트랜잭션 전체가 롤백된다(부분 반영 없음). 소유권은 회사 스코프로 검증하며 미존재/
        타사 소유 모두 404 DEFECT_NOT_FOUND로 통일한다.
      security:
        - SessionCookie: []
          XsrfToken: []
      tags: [defect]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DefectStatusUpdateRequest" }
      responses:
        "200":
          description: 전이 반영된 하자 상세(anchor 기준)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefectResponseApiResponse" }
        "400":
          description: >
            역행/건너뛰기 전이에 reason 누락, 등급 미확정 상태에서 DETECTED 이탈 시도 등
            (INVALID_INPUT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: 회사 멤버십 없음/회수·만료 (FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 하자 미존재 또는 타사 소유 (DEFECT_NOT_FOUND, 존재 여부 열거 방지 통일 응답)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "409":
          description: 현재 상태와 동일한 상태로 재요청 (INVALID_STATE_TRANSITION)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/defects/{id}/action-logs:
    get:
      summary: 조치 등록 이력 조회 (#1193/HAJA-569)
      description: >
        조치중(IN_PROGRESS)/조치완료(RESOLVED) 단계별로 등록된 조치 결과 제출 이력을 최신순으로
        전체 반환한다(조치중 단계 다중 등록 지원). 하자 상세 모달 사진 탭이 항목 2개 이상일 때
        등록일 select로 넘겨보는 용도. phase 쿼리 파라미터는 필수이며 IN_PROGRESS/RESOLVED만
        허용한다(그 외 값·누락은 400). 소유권은 회사 스코프로 검증하며 미존재/타사 소유 모두 404
        DEFECT_NOT_FOUND로 통일한다.
      security:
        - SessionCookie: []
      tags: [defect]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - name: phase
          in: query
          required: true
          description: 조회할 조치 단계. IN_PROGRESS/RESOLVED만 허용한다.
          schema:
            type: string
            enum: [IN_PROGRESS, RESOLVED]
      responses:
        "200":
          description: 조회 성공(빈 배열 포함)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefectActionLogListApiResponse" }
        "400":
          description: phase 누락 또는 IN_PROGRESS/RESOLVED가 아닌 값 (INVALID_INPUT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
          description: 회사 멤버십 없음/회수·만료 (FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "404":
          description: 하자 미존재 또는 타사 소유 (DEFECT_NOT_FOUND, 존재 여부 열거 방지 통일 응답)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }

  /api/defects/{id}/revisions:
    get:
      summary: 하자 활동 기록(변경 이력) 조회 (HAJA-314)
      description: >
        하자 상태 변경 이력을 최신순으로 페이지 단위 반환한다 — 하자 상세 화면 활동 기록 타임라인용.
        같은 사진(mediaId) 단위 그룹 확장(#1556)으로, 조회 대상 하자와 같은 그룹에 속한 모든 하자의
        defect_revisions 이력을 함께 반환한다(mediaId가 없는 하자는 그룹 크기 1이라 단건 조회와
        동일). 소유권은 회사 스코프로 검증하며 미존재/타사 소유 모두 404 DEFECT_NOT_FOUND로
        통일한다.
      security:
        - SessionCookie: []
      tags: [defect]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - name: page
          in: query
          description: 0부터 시작하는 페이지 번호
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          description: 페이지 크기
          schema: { type: integer, minimum: 1, default: 20 }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefectRevisionPageApiResponse" }
        "401":
          description: 미인증 (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorApiResponse" }
        "403":
