        - { name: keyword, in: query, description: 이름·이메일 부분일치 검색어, schema: { type: string } }
        - { name: role, in: query, schema: { type: string, enum: [ADMIN, INSPECTOR, USER, COUNSELOR, PLATFORM_ADMIN] } }
        - { name: plan, in: query, schema: { type: string, enum: [FREE, STANDARD, ENTERPRISE] } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, SUSPENDED, WAITING] } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, description: "1~100(초과 시 100으로 clamp)", schema: { type: integer, default: 10 } }
