        반환한다(ADMIN 전용 — `/api/admin/**` 는 SecurityConfig 필터에서 hasRole(ADMIN) 로 강제).
        요청 관리자와 같은 회사 소속 사용자만 조회되며, `stats` 는 검색/필터 조건과 무관하게 전체
        사용자 기준으로 집계한다(계약). companyId 없는 관리자(개인 회원 등)는 FORBIDDEN(403).
        `AdminUserController.list` 구현됨.
      security:
        - SessionCookie: []
      tags: [admin]
