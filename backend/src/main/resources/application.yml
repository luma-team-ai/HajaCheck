server:
  # nginx(TLS 종단) 뒤에서 X-Forwarded-* 를 신뢰해 https/Secure 쿠키를 정상 인식.
  forward-headers-strategy: framework
  # TODO(후속, application-prod.yml 신설 시): prod 프로파일에서 세션 쿠키
  #   server.servlet.session.cookie.secure=true / same-site=lax 설정할 것.

spring:
  application:
    name: hajacheck
  profiles:
    active: local
  # Flyway가 스키마를 관리하고 Hibernate는 검증만 한다(#359 — arm1 승격 #531 스키마 드리프트 재발 방지).
  # baseline-on-migrate: 이미 전체 스키마가 있는 기존 DB(arm1 프로덕션, 팀원 로컬)는 V1 실행 없이
  # "이미 적용됨"으로 스탬프만 하고, V2(plans 시드)부터 정상 적용한다. 빈 새 DB는 V1부터 순서대로 적용된다.
  # ⚠️ V1(db/migration/V1__baseline_schema.sql)은 2026-07-22 baseline 시점 이후 고정(frozen)이며
  # docs/design/db/HajaCheck_script.sql과 더 이상 실시간으로 동기화되지 않는다 — 그 파일에 신규 테이블·
  # 컬럼이 추가되면 V1이 아니라 forward migration(V3, V4, …)으로 반영한다(예: api_system_logs → V3).
  # V1을 사후 수정하면 이미 baseline 스탬프를 찍은 기존 DB(arm1)는 그 변경을 영영 받지 못한다.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "reconciled schema 2026-07-22"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  session:
    store-type: redis
  servlet:
    multipart:
      # 개별 파일 한도는 두 업로드 기능 중 더 큰 쪽(점검 미디어 20MB, 사업자등록증 10MB) 기준.
      max-file-size: 20MB
      # 점검 미디어 다중 업로드 최악값 기준: maxFilesPerRequest(50)×maxSizeBytes(20MB) + 여유.
      # frontend/nginx/{dev,default,arm1}.conf의 client_max_body_size도 반드시 이 값과 함께 맞출 것
      # (안 맞추면 nginx가 Spring에 닿기도 전에 413으로 끊는다 — PR머신 리뷰 P2, #1067).
      max-request-size: 1005MB
  # 비밀번호 재설정 메일 발송(#194) — 시크릿은 전부 env 참조, 커밋된 값 없음.
  # ⚠️ SMTP_HOST 미설정 시 값이 "빈 문자열로 존재"한다 → 스프링은 JavaMailSender 빈을 만들지만,
  #    발송 구현체 선택은 SmtpConfiguredCondition(빈값 배제)이 하므로 로컬/dev 는 로그 폴백으로 간다.
  #    운영(arm1·vm)은 compose 의 ${SMTP_HOST:?} 가드가 미설정 기동 자체를 막는다(프로파일 분기 불가 —
  #    arm1 과 로컬이 둘 다 SPRING_PROFILES_ACTIVE=docker 라서).
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      # ⚠️ TLS 다운그레이드 차단(fail-close). enable 만 켜면 "기회주의적 TLS"라, 서버가 STARTTLS 를 광고하지
      #    않거나 MITM 이 광고를 스트립하면 예외 없이 평문 SMTP 로 폴백한다 → 재설정 링크(=1회용 토큰,
      #    사실상 계정 탈취 수단)가 앱→릴레이 구간에 평문으로 흐른다. 이 기능은 토큰 평문 노출 금지가 전제이므로
      #    (sha256 저장 키·로그 마스킹·응답 DTO 봉인) 전송 구간만 열어둘 수 없다.
      #    required=true 면 STARTTLS 협상 실패 시 발송이 실패한다("STARTTLS is required but host does not
      #    support STARTTLS" — Angus Mail 2.0.3 SMTPTransport 확인). 발송 실패는 응답에 반영되지 않는다(@Async).
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      # 호스트명 검증 — 꺼져 있으면 TLS 를 써도 MITM 이 성립한다(아무 유효 인증서나 통과).
      # Angus Mail 2.0.3 의 기본값이 true 임을 바이트코드로 확인했으나(SocketFetcher 가 default=true 로 조회),
      # 구현체 교체·업그레이드로 기본값이 조용히 바뀌어도 안전하도록 명시 고정한다.
      mail.smtp.ssl.checkserveridentity: true
      # 465(SMTPS, 암묵적 TLS) 사용 시에만 true — 465 는 STARTTLS 를 쓰지 않는다. 587(STARTTLS)이 기본.
      # ⚠️ 465 에서도 위 starttls.required 는 무해하다: 이미 SSLSocket 이면 SMTPTransport 가
      #    "STARTTLS requested but already using SSL" 로 건너뛰고 예외를 던지지 않는다(2.0.3 바이트코드 확인).
      #    이 값을 켜지 않고 포트만 465 로 두면 평문으로 말을 걸어 발송이 실패하니 세트로 설정할 것.
      mail.smtp.ssl.enable: ${SMTP_SSL_ENABLE:false}
      # SMTP 왕복이 늘어져도 발송 스레드만 묶이고 응답엔 영향이 없지만(@Async), 스레드 고갈은 막는다.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

# 기업 인증(회원가입·아이디/비번 찾기) 설정 — 시크릿 아님(SpringBoot_코드_컨벤션.md §9 @ConfigurationProperties).
app:
  file-storage:
    # local 기본: 임시경로. docker/dev 는 application-docker.yml 에서 마운트 볼륨 경로로 override.
    base-dir: ${java.io.tmpdir}/hajacheck-files
    base-url-path: /files
    allowed-content-types:
      - image/jpeg
      - image/png
      - application/pdf
    max-size-bytes: 10485760
  media-upload:
    # 점검 촬영 데이터(이미지) 업로드(dev-05-03) — 영상은 후속 PR 범위.
    allowed-content-types:
      - image/jpeg
      - image/png
    max-size-bytes: 20971520
    max-files-per-request: 50
    thumbnail-max-dimension: 400
    detail-max-dimension: 1600
  policy:
    # 약관 버전은 서버 소유(클라이언트 미전송) — 동의 이력에 기록.
    terms-version: "1.0"
    privacy-version: "1.0"
  auth:
    password-reset-ttl: 10m
    signup-status-ttl: 30d
    # 사용자 초대 코드(#794) — 프론트 발급 모달 카운트다운(02:59)과 동일값 유지.
    invite-code-ttl: 180s
    # 초대 코드 redeem 무차별 대입 방어(PR머신 리뷰 P2) — 사용자(userId) 축 하나.
    invite-code-redeem-rate-limit:
      user-limit: 5
      user-window: 5m
    # 로그인 후 비밀번호 변경(#1315) — 사용자(userId) 축 하나. 탈취된 세션이 "현재 비밀번호"를
    # 무차별 대입해 계정을 인수하는 것을 막는다(현재 비밀번호 확인이 이 경로의 유일한 재인증 관문).
    # 변경 성공 시 카운터는 즉시 해제된다(성공 = 현재 비밀번호를 안다는 증명이라 방어력 손실 없음).
    # ⚠️ 축이 userId 라 탈취 세션이 피해자와 카운터를 공유한다 → 공격자가 한도를 소모시키면 피해자의
    # 비밀번호 변경(복구 경로)이 봉쇄된다. 탈출 경로는 비로그인 이메일 재설정, 근본 해결은 #1318.
    password-change-rate-limit:
      user-limit: 5
      user-window: 5m
      # 같은 userId 의 429 반복 = 오타가 아니라 침해 신호 → ERROR 로 승격(잡음과 분리).
      breach-alert-threshold: 3
      breach-alert-window: 1h
    # 비밀번호 재설정 1단계 rate-limit(2단계엔 걸지 않음 — 계약 §Rate-limit).
    password-reset-rate-limit:
      # 대상 이메일 축 — 사용자 단위 실질 방어(특정 피해자 메일 폭탄 차단).
      email-limit: 3
      email-window: 5m
      # 전역 상한 — SMTP 제공자 쿼터·발신 평판 보호용 "천장"이지 사용자 단위 방어가 아니다.
      # 정상 트래픽(하루 한 자릿수)이 절대 닿지 않을 만큼 크게 잡는다. 근거는 AuthProperties javadoc 참조.
      # ⚠️ 작게 잡으면 공격자가 상한을 채워 정상 사용자를 429로 막는 DoS 킬스위치가 된다(IP 축 미사용).
      global-limit: 60
      global-window: 1m
    # 사업자등록증 OCR 공개 프록시 rate-limit(#557 / HAJA-324) — 비로그인이라 이메일 축이 없다.
    # 전역 상한만으로 AI 서버(RapidOCR+LLM) CPU 부하를 방어한다(IP 축 미사용 이유는 AuthProperties 참고).
    business-license-ocr-rate-limit:
      global-limit: 20
      global-window: 1m
      # 일일 절대 캡(security-reviewer P1) — 분당 캡만으로는 지속 반복 시 일일 LLM 호출/과금이
      # 무제한(20/분 × 1440분 = 최대 28,800/일)이라, 유료 LLM 다운스트림 총량을 별도로 캡한다.
      daily-limit: 500
      daily-window: 1d
  # 라이브 데모(기업 ADMIN 원클릭 로그인, #1626) — 기본 전부 꺼짐(fail-closed). 데모를 여는 환경에서만
  # enabled=true + DEMO_ADMIN_PASSWORD 환경변수를 함께 설정한다(비밀번호 미설정이면 켜져 있어도 404).
  demo:
    enabled: false
    # 데모 계정 loginId(email). 예약 도메인(.demo)이라 실제 메일함이 없다 — 메일 기반 재설정 표면 없음.
    login-id: demo-admin@hajacheck.demo
    # ⚠️ 시크릿 — 커밋값 금지, 환경변수 주입만(§9). 빈 값이면 데모 로그인은 fail-closed(404).
    admin-password: ${DEMO_ADMIN_PASSWORD:}
    # 전역 축 하나(비로그인 엔드포인트 — IP 축 금지 결정은 AuthProperties/RateLimiter javadoc 참조).
    login-rate-limit:
      global-limit: 10
      global-window: 1m
  # 데모 시드(DemoDataSeeder) 옵트인 스위치 — LocalUserSeeder(app.local-seed.enabled)와 동일 패턴.
  # 데모 회사·계정·시설물·점검·분석결과·보고서 시드는 이 스위치를 켠 환경에서만 기동 시 생성된다(멱등).
  demo-seed:
    enabled: false
  # 재설정 메일 발신 주소 + 링크 base. ⚠️ 링크 base 는 반드시 설정값 — 요청 Host 에서 유도 금지(poisoning).
  mail:
    from: ${MAIL_FROM:no-reply@hajacheck.local}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

# AI 서버(FastAPI) 인증 프록시 설정(#228) — 시크릿(internal-key)은 env 참조, 커밋값 없음.
ai:
  server:
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8000}
    internal-key: ${AI_SERVER_INTERNAL_KEY:}
    # 하자 자연어 검색(HAJA-120) 전용 — X-Internal-Key와 별개 토큰(contract.md InternalServiceToken).
    internal-service-token: ${AI_SERVER_INTERNAL_SERVICE_TOKEN:}
    connect-timeout-ms: 3000
    # HF Inference(Qwen3 reasoning)는 정상 응답에도 최대 HF_TIMEOUT(기본 120s)까지 걸릴 수 있어,
    # read-timeout이 그보다 작으면 Spring이 먼저 끊어 정상 응답조차 실패 처리된다(#448 P1). 여유분 포함 150s.
    read-timeout-ms: 150000
    # 플랫폼 관리자 모니터링(#728) ai-server 헬스체크 전용 — 위 read-timeout-ms 와 별개로 짧게 끊는다.
    health-check-timeout-ms: 3000
    # RAG 임베딩 완료 확인(#1393, RagEmbeddingCompletionPoller/RagEmbeddingStaleReconciler) 전용 —
    # embedding-status는 Chroma 메타데이터 조회뿐인 가벼운 엔드포인트라 LLM용 150s를 그대로 쓰면
    # ai-server가 느려질 때(=이 기능이 대응하려는 바로 그 장애 국면) 폴러가 시도당 최대 150s씩
    # 붙잡히고(총 최대 25분), 리컨사일러는 단일 스레드 @Scheduled 풀을 오래 점유해 다른 배치
    # (결제·플랜 강등 등)까지 굶주리게 한다(PR머신 리뷰 P1). 헬스체크(3s)보다 조금 더 여유를 둔다.
    embedding-status-timeout-ms: 5000

# 구독 결제 주기 만료 → FREE 자동 강등 배치(#1145 / HAJA-549).
#
# ⚠️ enabled=false + mode=DRY_RUN 기본값은 실수가 아니라 안전장치다. V27 백필이 current_period_end 를
# 실제 결제일이 아니라 started_at + 1개월(파생 추정치)로 채웠기 때문에, 가입한 지 한 달이 넘은 유료
# 구독은 이미 전부 "만료" 상태로 DB에 들어 있다. 그대로 켜면 첫 실행에서 기존 유료 회사가 일괄 FREE 로
# 강등되고 좌석까지 정지된다. 게다가 제품 안에는 되돌릴 경로가 없다 — 무결제 상향이 #988로 차단돼
# FREE→STANDARD 복구는 운영자가 DB를 직접 만져야 한다.
#
# 운영 승격 순서(단계마다 로그로 확인하고 다음으로):
#   1) PLAN_EXPIRY_ENABLED=true (mode 는 DRY_RUN 유지) → 배치가 대상만 조회해 userPlanIds 를 WARN
#      로그로 남긴다. 아무것도 바뀌지 않는다(상한 초과여도 DRY_RUN 목록은 나온다).
#   2) 그 목록이 정말 만료된 게 맞는지 payments 결제 이력과 대조한다. prod 대상 행 수 직접 확인은
#      docker exec 로 전용 postgres 컨테이너(hajacheck-arm1-postgres-1, DB hajacheck)에서:
#      select count(*) from user_plans
#       where status in ('ACTIVE','UPGRADE_REQUESTED') and current_period_end is not null
#         and current_period_end < now();
#      (호스트 psql 은 hajacheck_dev 라 대상이 다르다)
#   3) PLAN_EXPIRY_NOT_BEFORE 를 설정해 V27 백필 추정치 구간을 쿼리 단계에서 배제한다.
#      ⚠️ 선택이 아니라 필수다 — ENFORCE 인데 이 값도 PLAN_EXPIRY_NOT_BEFORE_UNBOUNDED 도 없으면
#      기동이 실패한다. 전 구간을 의도적으로 대상 삼아야 할 때만 UNBOUNDED=true 를 명시한다.
#   4) 마지막으로 PLAN_EXPIRY_MODE=ENFORCE 로 올린다.
# max-per-run 은 그 이후에도 남는 방어선이지만, 대상이 상한 이하이면 그대로 통과하므로 단독으로는 소급
# 대량 강등을 막지 못한다(자세한 근거는 PlanExpiryProperties / PlanExpiryScheduler javadoc 참고).
#
# ────────────────────────────────────────────────────────────────────────────────────────────
# 오강등 복구 절차 (강등이 잘못 일어났을 때 — 제품 UI로는 되돌릴 수 없다)
#
# 무결제 상향이 #988로 차단돼 FREE→STANDARD 를 관리자 콘솔로 되돌릴 수 없다. 아래를 prod 전용 postgres
# 컨테이너에서 직접 수행한다. 트랜잭션으로 묶고, 각 단계 결과 행 수를 확인하며 진행할 것.
#
#   0) 즉시 배치를 멈춘다: PLAN_EXPIRY_MODE=DRY_RUN (또는 PLAN_EXPIRY_ENABLED=false) 후 재기동.
#   1) 복구 대상을 로그에서 수집한다. 강등 1건마다 아래 형식의 INFO 로그가 남아 있다:
#      "구독 만료 FREE 강등 — companyId=.. userId=.. previousPlan=.. periodEnd=.. expiredAt=..
#       suspendedSeats=.. suspendedUserIds=[..]"
#      여기서 (companyId 또는 userId) · previousPlan · suspendedUserIds 를 확보한다.
#      ⚠️ 이 절차는 그 INFO 로그가 남아 있어야 성립한다(users.status 는 이전 값을 보관하지 않는다).
#      컨테이너 로그 로테이션으로 유실되기 전에 먼저 수집해 따로 저장할 것.
#   2) 배치가 새로 발급한 FREE ACTIVE 행의 id 를 먼저 특정한다.
#      ⚠️ "그 회사의 ACTIVE 행"으로 뭉뚱그려 지우면 안 된다 — 오강등을 겪은 고객이 그 사이 재결제했다면
#      그 대상은 방금 결제한 유료 구독이다(payments.user_plan_id FK 가 NO ACTION 이라 트랜잭션이 통째로
#      abort 되면서 원인 불명 FK 에러로 나타난다). 반드시 FREE 플랜 행으로 좁히고, 각 DELETE 앞에
#      같은 조건의 select 를 먼저 돌려 대상이 1건이고 그것이 배치가 만든 행이 맞는지 눈으로 확인한다.
#      -- 회사 구독 예시(개인 구독이면 company_id = :companyId 대신 user_id = :userId 사용)
#      select id, plan_id, status, started_at, current_period_end from user_plans
#       where company_id = :companyId and status = 'ACTIVE'
#         and plan_id = (select id from plans where name = 'FREE');
#      -- 위 결과가 정확히 1건이고 started_at 이 강등 시각(expiredAt)과 일치하는지 확인한 뒤 그 id 를
#      -- :newFreeUserPlanId 로 삼는다. 2건 이상이거나 일치하지 않으면 멈추고 원인부터 확인할 것.
#   3) 그 행과 그 행으로 이월된 당월 사용량을 지운다.
#      ⚠️ 반드시 이 순서 — 부분 UQ(uq_user_plans_active_company/user)가 ACTIVE 1건만 허용하므로
#      새 FREE 행을 먼저 치우지 않으면 4)의 복원이 제약 위반으로 실패한다.
#      begin;
#      select count(*) from usage_counters where user_plan_id = :newFreeUserPlanId;  -- 사전 확인
#      delete from usage_counters where user_plan_id = :newFreeUserPlanId;
#      delete from user_plans where id = :newFreeUserPlanId;
#   4) 배치가 EXPIRED 로 내린 원래 구독을 되살린다(ended_at 도 함께 지운다).
#      select id, plan_id, status, ended_at from user_plans where id = :expiredUserPlanId;  -- 사전 확인
#      update user_plans
#         set status = 'ACTIVE', ended_at = null
#       where id = :expiredUserPlanId;   -- 1)에서 확보한 그 회사의 previousPlan 행
#   5) 정지된 좌석을 되살린다(1)의 suspendedUserIds).
#      ⚠️ status='SUSPENDED' 조건을 반드시 유지한다 — 이 강등과 무관하게 원래 정지돼 있던 계정을
#      되살리지 않기 위해서다(로그의 id 목록은 이 강등이 정지시킨 대상만 담고 있다).
#      update users set status = 'ACTIVE' where id in (:suspendedUserIds) and status = 'SUSPENDED';
#      commit;
#   6) 검증: 해당 소유 주체의 ACTIVE 구독이 정확히 1건이고 플랜이 previousPlan 인지,
#      복구 대상 사용자 status 가 전부 ACTIVE 인지 확인한다.
#      select id, plan_id, status, current_period_end from user_plans where company_id = :companyId;
#   7) 재발 방지: current_period_end 가 실제 결제일과 맞는지 payments 와 대조해 바로잡은 뒤에만
#      PLAN_EXPIRY_NOT_BEFORE 를 다시 설정하고 ENFORCE 로 올린다.
# ────────────────────────────────────────────────────────────────────────────────────────────
hajacheck:
  plan:
    expiry:
      enabled: ${PLAN_EXPIRY_ENABLED:false}
      # DRY_RUN = 대상 조회·id 로그만(강등 0건) · ENFORCE = 실제 반영.
      # 강등이 일어나려면 enabled=true 와 mode=ENFORCE 를 모두 켜야 한다.
      mode: ${PLAN_EXPIRY_MODE:DRY_RUN}
      # 매일 KST 04:00 — 점검 알림 배치(06:00)와 겹치지 않게.
      cron: ${PLAN_EXPIRY_CRON:0 0 4 * * *}
      # 만료 즉시 강등(P0D). 자동 청구 수단(빌링키)이 없어 유예를 둬도 결제를 유도할 방법이 없다.
      # ⚠️ 음수를 넣으면 기준시각이 미래가 되어 유효한 구독까지 대상이 되므로 기동이 실패한다(의도적).
      grace-period: ${PLAN_EXPIRY_GRACE_PERIOD:P0D}
      # 강등 하한 컷오프(ISO-8601 instant, 예: 2026-08-01T00:00:00Z).
      # 설정하면 current_period_end 가 이 시각 이후인 구독만 대상이 된다 — V27 백필 추정치로 채워진
      # 과거 구간을 코드가 직접 배제한다(사람 절차에만 기대지 않는다).
      # ⚠️ mode=ENFORCE 에서는 필수. 비운 채 ENFORCE 로 올리면 기동이 실패한다.
      not-before: ${PLAN_EXPIRY_NOT_BEFORE:}
      # 컷오프 없이(전 구간) ENFORCE 를 돌리겠다는 명시적 선언. not-before 와 동시 설정 불가.
      # "설정을 깜빡한 상태"와 "알고서 전 구간을 고른 상태"를 구분하기 위한 값이다.
      not-before-unbounded: ${PLAN_EXPIRY_NOT_BEFORE_UNBOUNDED:false}
      max-per-run: ${PLAN_EXPIRY_MAX_PER_RUN:50}
      # 강등 대상 행 잠금 대기 상한(ms, 0=무제한). @Scheduled 기본 스레드가 1개라 한 건의 무한 대기가
      # 다른 배치까지 멈춘다. JPA lock.timeout 힌트는 PostgreSQL 에서 무시되므로
      # set_config('lock_timeout', …, true) 로 트랜잭션 로컬 적용한다(UserPlanRepository 참고).
      lock-timeout-ms: ${PLAN_EXPIRY_LOCK_TIMEOUT_MS:3000}
    # 플랜 하향 예약 적용 배치(#1105 / HAJA-526) — 관리자가 신청해 둔 하향을 다음 결제 주기에 반영한다.
    # ⚠️ 만료 강등(expiry)과 달리 기본값이 "켜짐"이다: 대상이 소급 백필 데이터가 아니라 사람이 명시적으로
    # 만든 예약 행뿐이라 소급 대량 실행 표면이 없고, 꺼 두면 "신청은 받아 놓고 영원히 적용되지 않는" 더
    # 나쁜 상태가 된다(자세한 근거는 ScheduledPlanChangeProperties javadoc).
    scheduled-change:
      # 사고 시 배포 없이 배치만 끄기 위한 비상 스위치.
      enabled: ${PLAN_SCHEDULED_CHANGE_ENABLED:true}
      # 매시 정각(KST) — 적용 시각이 결제 주기 종료 시각이라 하루 중 아무 때나 걸린다. 일 1회면 최악의
      # 경우 하루 가까이 상위 요금제가 무료로 연장되므로 지연을 1시간 이내로 제한한다.
      cron: ${PLAN_SCHEDULED_CHANGE_CRON:0 0 * * * *}
      # 1회 실행 상한 — 초과하면 아무것도 하지 않고 중단한다(부분 적용 금지). 사람이 만든 예약뿐이라
      # 정상 운영에서 넘길 일이 없고, 넘겼다면 그 자체가 사고 신호다.
      max-per-run: ${PLAN_SCHEDULED_CHANGE_MAX_PER_RUN:100}
      # 예약·구독 행 잠금 대기 상한(ms, 0=무제한). 근거·적용 방식은 위 expiry.lock-timeout-ms 와 동일.
      lock-timeout-ms: ${PLAN_SCHEDULED_CHANGE_LOCK_TIMEOUT_MS:3000}
      # 유료→유료 하향(#1177 C안) 허용 스위치 — 기본 false(닫힘). 생성(AdminPlanService#scheduleChange)과
      # 실행(ScheduledPlanChangeWriter#applyBillingPeriod) 양쪽을 게이팅한다 — 생성만 막으면 스위치를 켠
      # 동안 쌓인 예약이 최대 한 달 보관되므로, 되돌려도 이미 만들어진 PENDING 이 그대로 실행돼 안내 없이
      # 좌석 정지·FREE 강등이 일어난다(닫힌 상태에서 실행되면 예약은 FAILED 로 끝나고 신청자에게 알림이 간다).
      #
      # ⚠️ 이 값을 true 로 올리기 전 선결 조건(#1177 후속) — 전부 해소되기 전에는 켜지 말 것:
      #   1) 프론트 유료 대상 예약 UI(결제 마감 안내·유예 배너·결제 유도) 연동
      #   2) [P2-C] 2단계(유예 만료 강등)에 종료 상태·실패 알림 추가 — 지금은 결정적 실패가 매시 영구
      #      재시도되고, 누적되면 max-per-run 상한에 걸려 2단계 전체가 봉쇄된다
      #   3) [P2-D] 2단계에 "PAID && user_plan_id IS NULL 이면 스킵 + 알람" fail-safe — 유예 정산 결제가
      #      승인은 됐는데 전이가 끝나지 않은 대사 대상(#1010)이 예정대로 FREE 강등되는 것을 막는다
      #   4) [P2-E] 결제해도 유예 진입 때 정지된 좌석이 자동 복구되지 않는다는 안내(최소 문구)
      paid-target-enabled: ${PLAN_SCHEDULED_CHANGE_PAID_TARGET_ENABLED:false}
      # 유료→유료 하향의 미결제 유예 일수(1~14). 유료 대상 예약이 적용되면 결제 없이 그 요금제가
      # 발급되되, 이 일수 안에 결제하지 않으면 FREE 로 강등된다(이 배치의 2단계). 유예 구간은 어떤
      # 경우에도 청구가 발생하지 않으므로 길수록 미결제 노출이 커진다 — 상한 2주.
      payment-grace-days: ${PLAN_SCHEDULED_CHANGE_PAYMENT_GRACE_DAYS:7}

# 국세청 사업자등록정보 진위확인(data.go.kr) — #596. service-key 미설정 시 진위확인을 스킵하고
# 가입을 그대로 진행한다(fail-open). service-key 는 data.go.kr "일반 인증키(Decoding)" 를 주입한다.
biz-verify:
  base-url: ${BIZ_VERIFY_BASE_URL:https://api.odcloud.kr}
  service-key: ${BUSINESS_REGISTRATION_API_KEY:}
  connect-timeout-ms: 3000
  # 제출 경로 전용(CompanySignupService → validate() 단독 호출, permitAll+rate-limit 없음) — PR #880
  # 이전 값 그대로 유지, 재시도 없음(PR #889 P1: 무인증 엔드포인트 스레드 점유 증가 방지). 자세한 근거는
  # BizVerifyProperties.readTimeoutMs Javadoc 참고.
  read-timeout-ms: 5000
  # 실시간 진위확인 경로 전용(#648, rate-limit 보호되는 인터랙티브 경로) — 5000→8000 상향(#880).
  realtime-read-timeout-ms: 8000
  # 일시적 실패(연결실패·타임아웃·5xx)만 재시도(#880) — 실시간 진위확인 경로에만 적용, 제출 경로
  # validate()는 재시도하지 않는다(NtsBusinessVerifyClient 참고). 총 대기 시간 근거도 그 클래스 Javadoc 참고.
  retry-max-attempts: 1
  retry-backoff-ms: 300
  # 실시간 진위확인 공개 API(#648, POST /api/auth/business-verification) rate-limit — 비로그인이라
  # 전역 상한만 사용한다(IP 축 미사용 근거는 BizVerifyProperties.RateLimit javadoc 참고). 일일 캡은
  # 회원가입 플로우와 공유하는 국세청 서비스키 쿼터 소진을 막는 안전판이다.
  rate-limit:
    global-limit: 10
    global-window: 1m
    daily-limit: 300
    daily-window: 1d
  # PENDING 사업자 진위확인 자동 재검증 배치(#888) — 국세청 장애로 fail-open된 PENDING 회사를 주기적으로
  # verifyRealtime()으로 재조회해 VERIFIED/FAILED로 확정한다. 이 배치는 위 rate-limit(공개 API 전용)을
  # 타지 않으므로 max-batch-size가 국세청 서비스키 일일 쿼터를 지키는 유일한 통제 수단이다
  # (PendingBusinessReverifyProperties Javadoc 참고). cron은 매일 05:30 KST — 시설물 점검 예정일
  # 알림 배치(06:00, InspectionDueNotificationScheduler)보다 앞서 실행되게 분리했다.
  pending-reverify:
    enabled: true
    max-batch-size: 20
    cron: "0 30 5 * * *"

# 토스페이먼츠 샌드박스 결제(#988 / HAJA-489) — 시크릿(secret-key)은 env 참조, 커밋된 값 없음.
# ⚠️ TOSS_SECRET_KEY는 서버 전용 시크릿이다. 절대 VITE_ 접두사를 붙이지 말 것 — Vite는 VITE_*를 빌드
#    시점에 번들에 인라인하므로, 붙이는 순간 시크릿이 프론트 정적 자산으로 공개된다. 프론트가 쓰는 건
#    클라이언트 키(VITE_TOSS_CLIENT_KEY)뿐이며 그건 공개돼도 되는 값이다.
# 미설정 정책은 fail-close이되 기동은 막지 않는다: 결제 진입점(POST /api/me/plan/orders,
# POST /api/me/payments/confirm)만 PAYMENT_GATEWAY_ERROR(502)로 거절되고 나머지 기능은 정상 동작한다
# (근거는 TossPaymentsProperties javadoc — compose 가드를 :- 소프트로 둔 것과 세트).
toss-payments:
  base-url: ${TOSS_API_BASE_URL:https://api.tosspayments.com}
  secret-key: ${TOSS_SECRET_KEY:}
  connect-timeout-ms: 3000
  # 승인은 카드사 왕복이 포함돼 조회성 호출보다 느리고, 타임아웃이 곧 "승인 여부 불명"이라 짧게 끊을수록
  # 미확정 결제가 늘어난다. 사용자가 결제창 앞에서 기다리는 인터랙티브 경로라 10초로 둔다.
  read-timeout-ms: 10000
  order-name-prefix: HajaCheck
  history-max-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health, metrics
  health:
    # 메일 헬스체크 비활성(#310 — #194 회귀 수정). 끄는 이유가 셋이다:
    #
    # 1) 로컬/dev를 깨뜨린다. 로컬 compose는 SMTP_* 를 전달하지 않는 게 설계 의도라
    #    spring.mail.host 가 빈 문자열이 되는데, Boot 의 MailSenderAutoConfiguration 은
    #    @ConditionalOnProperty(name="spring.mail.host") 라 빈 문자열도 "속성 존재"로 보고
    #    JavaMailSender 빈을 만든다. 그러면 MailHealthIndicator 가 붙어 연결을 시도하고
    #    AuthenticationFailedException → health DOWN → 도커 헬스체크 실패 → 스택이 안 뜬다.
    # 2) 운영에서 SMTP 도달성이 서비스 전체 health 를 좌우하면 안 된다. 메일은 비밀번호 재설정
    #    한 기능의 의존성인데, 제공자가 잠깐 흔들렸다고 앱 전체가 DOWN 으로 찍혀 재시작·LB 제거로
    #    이어지는 건 과하다.
    # 3) MailHealthIndicator.testConnection() 은 헬스 폴링마다 SMTP 연결을 연다. 짧은 주기로
    #    돌면 제공자(예: Gmail) 한도를 소모하고 계정이 스로틀·차단될 수 있다.
    #
    # 발송 실패의 관측 지점은 여기가 아니라 PasswordResetMailDispatcher 의 WARN 로그다.
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  # 컨트롤러가 produces를 명시 안 하면 springdoc이 */*로 문서화하는데, 실제 JSON 엔드포인트는
  # MappingJackson2HttpMessageConverter가 application/json으로 응답한다 — */*보다 사실에 가깝고
  # 문서로서 쓸모 있으므로 전역 기본값을 명시한다(IT-05 Swagger diff 검증 중 발견).
  # 단 바이너리 응답까지 JSON으로 오문서화하므로, 해당 엔드포인트는 @ApiResponse(content=)로 덮는다.
  default-produces-media-type: application/json
