# HajaCheck 배포 정의 — oci-arm1(공유 호스트) 전용 변형 (이슈 #104 → #258로 bridge 전환)
#
# oci-arm1은 hajacheck 외 다른 사이트(smartfarm·pension_db 등)와 host nginx(80/443)를 공유한다.
# base(docker-compose.yml)를 그대로 올리면 postgres(5432)가 공유 host postgres-16과 충돌하므로,
# 이 파일은 base와 같은 bridge-net + 전용 postgres/redis 컨테이너 구조를 쓰되, 포트만 arm1에 맞게
# 옮겨서(충돌 회피) publish한다. 서비스 간 통신은 서비스명(postgres/redis/spring/fastapi)으로 한다.
#
# 재사용하는 공유 자원(이 compose 밖, arm1에 이미 존재 — 절대 건드리지 않음):
#   - host nginx(80/443, TLS 종료): `/`→127.0.0.1:8100(frontend). `/ai/`는 이미 외부 폐쇄(#235,
#     스프링이 내부에서만 fastapi를 호출) — host nginx의 `/ai/`→8101 location 정리는 레포 밖(사람이 별도 수행).
#   - 공유 host postgres-16(127.0.0.1:5432, DB `hajacheck`) — 이 compose의 전용 postgres(5433)와는
#     별개. 컷오버(#258 Task #6, 런북 참조) 전까지는 앱이 여전히 host postgres를 쓸 수 있으나,
#     이 파일 자체는 전용 postgres/redis로 완전히 옮겨간 구조를 정의한다.
#
# 사용: docker compose -f docker-compose.arm1.yml build && docker compose -f docker-compose.arm1.yml up -d
# 절대 금지: 80/443 바인딩(TLS는 host nginx 담당), 공유 host postgres(5432) 참조.

# 프로젝트명 고정 — 홈서버(hmoeserver)에서 실제로 떠 있는 스택의 이름이다(컨테이너 hajacheck-home-*,
# 볼륨 hajacheck-home_pgdata 등). 이전 값 `hajacheck-arm1` 은 실행 중 스택과 달라서, `-p` 없이 도는
# deploy/deploy.sh 가 같은 호스트에 **빈 볼륨의 두 번째 스택**을 띄우고 8100/5433/6380 을 두고 충돌하는
# 상태였다(#1737). oci-arm1 은 2026-08-21 전 서비스 이전으로 정지 — 이 파일의 유일한 실행 호스트는 홈서버다.
name: hajacheck-home

networks:
  hajacheck-net:
    driver: bridge
  # Cloudflare Tunnel 공개 경로(홈서버) — 터널 컨테이너가 이 네트워크로만 각 스택에 도달한다(#1737).
  # 호스트에 이미 존재하는 외부 네트워크라 이 compose 가 만들지 않는다(`docker network create shared-net`).
  # oci-arm1 등 shared-net 이 없는 호스트에서는 이 파일이 기동되지 않는다 — 홈서버 전용 정의다.
  shared-net:
    external: true

volumes:
  pgdata:
  redisdata:
  chroma_data:
  # application-docker.yml의 app.file-storage.base-dir 대응 — 미마운트 시 컨테이너 임시 FS에 저장되어
  # deploy.sh의 매 배포 컨테이너 재생성마다 업로드 파일(사업자등록증 등)이 유실되고 DB 행만 남는다(#323).
  uploads:
  # application-docker.yml의 app.report-pdf-storage.base-dir 대응 — 보고서 PDF는 file-storage와 별개 도메인이라
  # uploads 볼륨(hajacheck-files 마운트)에 담기지 않으므로 전용 볼륨으로 분리 마운트한다(#455 P2-2, uploads와 동일 구조).
  report_uploads:
  # HF 임베딩 모델(bge-m3 ~2GB) 캐시 — 미마운트 시 deploy.sh 재배포마다 재다운로드(#439, uploads와 동일 구조).
  hf_cache:

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ARM1_DB_NAME:-hajacheck_dev}
      POSTGRES_USER: ${DB_USER:-hajacheck}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD가 .env에 설정되어야 합니다}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 팀 SSH 터널 전용 — 공유 host postgres(5432)와 충돌 회피로 5433에 publish, 공개 미개방(127.0.0.1)
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hajacheck} -d ${ARM1_DB_NAME:-hajacheck_dev}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks: [hajacheck-net]
    # 메모리 상한(luma200ok/home-infra#9) — 실측 73MiB. DB. 데이터 증가·shared_buffers 여유
    # OOM killer 는 원인 제공자가 아니라 점수가 가장 높은 프로세스를 죽이므로,
    # 상한이 없으면 이 컨테이너의 폭주가 무관한 서비스를 죽인다.
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD가 .env에 설정되어야 합니다}
    # requirepass 미설정 시 인증 없이 전체 접근 가능 — PRD §6.1 보안 필수 조치
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redisdata:/data
    ports:
      # 내부 6379 → 호스트 6380, 팀 SSH 터널 전용 — 공개 미개방(127.0.0.1 바인딩)
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks: [hajacheck-net]
    # 메모리 상한(luma200ok/home-infra#9) — 실측 9MiB. 세션·캐시. 데이터 증가 여유
    # OOM killer 는 원인 제공자가 아니라 점수가 가장 높은 프로세스를 죽이므로,
    # 상한이 없으면 이 컨테이너의 폭주가 무관한 서비스를 죽인다.
    deploy:
      resources:
        limits:
          memory: 512M

  spring:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # latest 금지(PRD §6.1) — deploy.sh가 IMAGE_TAG(날짜+커밋SHA)를 주입해 태깅. 수동 실행 시 local.
    image: hajacheck-arm1-spring:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${ARM1_DB_NAME:-hajacheck_dev}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-hajacheck}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD가 .env에 설정되어야 합니다}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD가 .env에 설정되어야 합니다}
      # 운영 0번 / 개발 1번(PRD §6.1) — arm1은 dev 스택이므로 기본 1
      SPRING_DATA_REDIS_DATABASE: ${REDIS_DB_INDEX:-1}
      AI_SERVER_BASE_URL: http://fastapi:8000
      # 스프링→FastAPI 프록시가 부착하는 내부키. FastAPI의 AI_INTERNAL_KEY와 동일 소스여야 검증 통과.
      # 운영(arm1)은 강제(:?).
      AI_SERVER_INTERNAL_KEY: ${AI_INTERNAL_KEY:?AI_INTERNAL_KEY가 .env에 설정되어야 합니다}
      # 국세청 사업자 진위확인(#596) serviceKey — spring bizverify가 읽음.
      # ⚠️ #1324로 이 키의 보안 성질이 뒤집혔다 — :- 소프트에서 :? 강제로 전환한다.
      #   이전: 미설정 → 진위확인 SKIPPED → 회사 verification_status=PENDING → 회사 스코프 닫힘
      #         (fail-closed. 키가 없어도 무해했으므로 기동을 막을 이유가 없었다.)
      #   이후: 미설정 → SKIPPED → CompanyAccountWriter가 무조건 VERIFIED+APPROVED+오너 멤버십 발급
      #         → 임의의 사업자번호로 가입한 계정이 즉시 회사 스코프 전체를 얻는다(fail-open).
      # 즉 이 키는 이제 "없으면 서비스가 성립하지 않는 것"(AI_INTERNAL_KEY·SMTP_PASSWORD와 동급)이다.
      BUSINESS_REGISTRATION_API_KEY: ${BUSINESS_REGISTRATION_API_KEY:?BUSINESS_REGISTRATION_API_KEY가 .env에 설정되어야 합니다 — 미설정 시 기업 가입이 무검증으로 자동승인됩니다(#1324)}
      # 토스페이먼츠 샌드박스 결제(#988) 시크릿 — spring payment 클라이언트가 읽음. 미설정이면 결제
      # 진입점만 PAYMENT_GATEWAY_ERROR(502)로 fail-close 되고 나머지 기능·기동은 정상이다. :- 소프트인
      # 이유: 결제는 샌드박스 데모 부가기능이라 키 누락으로 배포 전체를 멈추면 안 된다(:? 는
      # AI_INTERNAL_KEY·SMTP_PASSWORD처럼 없으면 서비스가 성립하지 않는 것에만 쓴다).
      # ⚠️ 서버 전용 시크릿이다 — VITE_ 접두사 금지(붙이면 프론트 번들에 인라인되어 공개된다).
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      # 라이브 데모 계정 비밀번호(#1635) — 서버 .env(미커밋)에만. 빈 값이면 데모 로그인은 fail-closed(404)라
      # :- 소프트인(TOSS_SECRET_KEY와 동급 — 데모는 부가기능, 누락으로 배포 전체를 멈추지 않는다).
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      # OAuth2 registration — 값은 서버 .env(미커밋)에만. 미설정 시 기동 실패(:? 가드)로 조기 차단.
      # (registration.{provider}.client-id 키가 빈 문자열로만 존재해도 기동 실패 — base 주석 참조.)
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:?KAKAO_CLIENT_ID가 .env에 설정되어야 합니다}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:?KAKAO_CLIENT_SECRET이 .env에 설정되어야 합니다}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID가 .env에 설정되어야 합니다}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET이 .env에 설정되어야 합니다}
      # 비밀번호 재설정 메일 발송(#194) — 값은 서버 .env(미커밋)에만.
      # 운영은 강제(:?): SMTP_HOST가 비면 앱이 "로그 폴백"으로 조용히 전환돼, 재설정 링크가 사용자에게
      # 안 가고 서버 로그에만 찍힌다(무증상 장애 + 토큰이 로그에 남음). 프로파일로는 막을 수 없다 —
      # arm1과 로컬이 둘 다 SPRING_PROFILES_ACTIVE=docker라서. 그래서 AI_INTERNAL_KEY와 동일하게 :? 가드로 막는다.
      # ⚠️ 승격 순서: 서버 .env에 값 주입 → 그 다음 main 승격(가드가 의도적으로 배포를 멈춘다).
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST가 .env에 설정되어야 합니다}
      SMTP_PORT: ${SMTP_PORT:-587}
      # 465(SMTPS, 암묵적 TLS)를 쓸 때만 true — 587(STARTTLS)이 기본이며 포트와 세트로 설정할 것.
      # (전달하지 않으면 .env에 넣어도 컨테이너에 반영되지 않는다.)
      SMTP_SSL_ENABLE: ${SMTP_SSL_ENABLE:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME이 .env에 설정되어야 합니다}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD가 .env에 설정되어야 합니다}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM이 .env에 설정되어야 합니다}
      # 재설정 링크 base. 요청 Host에서 유도하지 않으므로(poisoning 방어) 이 값이 유일한 출처 — 미설정 시 기동 실패.
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?FRONTEND_BASE_URL이 .env에 설정되어야 합니다}
    volumes:
      - uploads:/app/uploads/hajacheck-files
      - report_uploads:/app/uploads/hajacheck-report-pdf
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    networks: [hajacheck-net]
    # 메모리 상한(luma200ok/home-infra#9) — 실측 766MiB. ⚠️ -Xmx 미설정이라 JVM 이 컨테이너 상한의 25%(=768M)를 힙으로 잡는다.
    # 상한이 없는 지금은 호스트 30GiB 의 25%(=7.5G)까지 힙이 커질 수 있어 오히려 위험하다.
    # 실측 RSS 766MiB 를 고려해 2G(힙 512M)가 아닌 3G 로 잡아 GC 압박을 피한다
    # OOM killer 는 원인 제공자가 아니라 점수가 가장 높은 프로세스를 죽이므로,
    # 상한이 없으면 이 컨테이너의 폭주가 무관한 서비스를 죽인다.
    deploy:
      resources:
        limits:
          memory: 3G

  fastapi:
    build:
      context: ./ai-server
      dockerfile: Dockerfile
    # latest 금지(PRD §6.1) — deploy.sh가 IMAGE_TAG(날짜+커밋SHA)를 주입해 태깅. 수동 실행 시 local.
    image: hajacheck-arm1-fastapi:${IMAGE_TAG:-local}
    restart: unless-stopped
    # bridge-net에서 spring이 http://fastapi:8000 으로 서비스명 통신하므로 컨테이너 내부는 0.0.0.0 리슨 필수.
    # 이미지 Dockerfile 기본 CMD도 --host 0.0.0.0 --port 8000 이지만, 리뷰어 모호성 제거 + 회귀 방지 위해 명시.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD가 .env에 설정되어야 합니다}@redis:6379/${REDIS_DB_INDEX:-1}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3-8B}
      HF_API_TOKEN: ${HF_API_TOKEN:-}
      # 모델 가중치 revision 고정(#1645) — 미설정 시 코드 기본값(main HEAD 폴백)과 동일하게 동작.
      YOLO_REVISION: ${YOLO_REVISION:-}
      UNET_REVISION: ${UNET_REVISION:-}
      # X-Internal-Key 검증용 공유키(스프링 AI_SERVER_INTERNAL_KEY와 동일 소스). 운영은 강제(:?).
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY:?AI_INTERNAL_KEY가 .env에 설정되어야 합니다}
      # 프로덕션 신호 — main.py가 이 값으로 /docs·/redoc·/openapi.json을 비활성화(무인증 스키마 노출 차단)
      APP_ENV: prod
      # HF 캐시를 named volume(hf_cache) 경로로 고정 — bge-m3 모델 캐시 영속화(#439).
      HF_HOME: /app/hf_cache
      # LangSmith 트레이싱(design-03-13/HAJA-115) — 미설정(빈값/false) 시 비활성.
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_ENDPOINT: ${LANGCHAIN_ENDPOINT:-}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-}
      # RAG 시맨틱 캐시 보존 정책(#1594) — 근거·기본값 산출은 ai/core/semantic_cache.py 모듈
      # docstring 참고. 미설정이면 코드 기본값과 동일하게 동작하며, 잘못된 값을 넣어도 경고 로그만
      # 남기고 기본값으로 폴백한다(앱 기동은 막지 않음 — 운영에서 :? 강제로 두지 않는 이유).
      SEMANTIC_CACHE_THRESHOLD: ${SEMANTIC_CACHE_THRESHOLD:-0.95}
      SEMANTIC_CACHE_TTL_SECONDS: ${SEMANTIC_CACHE_TTL_SECONDS:-86400}
      SEMANTIC_CACHE_MAX_ENTRIES: ${SEMANTIC_CACHE_MAX_ENTRIES:-5000}
    volumes:
      - chroma_data:/app/chroma_data
      - hf_cache:/app/hf_cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks: [hajacheck-net]
    # 메모리 상한(luma200ok/home-infra#9) — 실측 2.5GiB. 최대 소비자. ML/임베딩 워크로드라 변동 폭이 크다
    # OOM killer 는 원인 제공자가 아니라 점수가 가장 높은 프로세스를 죽이므로,
    # 상한이 없으면 이 컨테이너의 폭주가 무관한 서비스를 죽인다.
    deploy:
      resources:
        limits:
          memory: 4G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NGINX_CONF_FILE: nginx/arm1.conf
        # Vite가 빌드 시점에 인라인하는 카카오맵 키(#323) — 운영은 강제(:?). 미설정 시 지도 페이지가
        # 빌드·헬스체크 전부 통과한 뒤 런타임에만 KakaoMapKeyMissingError로 조용히 깨진다.
        VITE_KAKAO_MAP_APP_KEY: ${VITE_KAKAO_MAP_APP_KEY:?VITE_KAKAO_MAP_APP_KEY가 .env에 설정되어야 합니다}
        # 토스 결제창 SDK 클라이언트 키(#988) — Vite가 빌드 시점에 인라인한다(런타임 주입 불가).
        # 공개돼도 되는 키지만 운영은 카카오와 동일하게 강제(:?) — 소프트(:-)로 두면 키가 비어도
        # 빌드·헬스체크가 전부 통과한 뒤 결제 경로만 런타임에 조용히 깨진다(#1339). 서버 시크릿
        # TOSS_SECRET_KEY와 절대 혼동하지 말 것.
        VITE_TOSS_CLIENT_KEY: ${VITE_TOSS_CLIENT_KEY:?VITE_TOSS_CLIENT_KEY가 .env에 설정되어야 합니다}
    # latest 금지(PRD §6.1) — deploy.sh가 IMAGE_TAG(날짜+커밋SHA)를 주입해 태깅. 수동 실행 시 local.
    image: hajacheck-arm1-frontend:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      spring:
        condition: service_healthy
      fastapi:
        condition: service_healthy
    ports:
      # host nginx가 `/`→127.0.0.1:8100으로 프록시(TLS는 host nginx 담당) — 공개 미개방(127.0.0.1)
      - "127.0.0.1:8100:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      hajacheck-net:
      # 터널이 도달하는 유일한 진입점이라 frontend 만 조인한다(spring·fastapi·postgres·redis 는 내부 전용).
      # ⚠️ 이 조인이 없으면 컨테이너 recreate 마다 hajacheck.luma200ok.com 이 502 가 된다(#1737).
      #    수동 `docker network connect` 는 recreate 시 사라지므로 정의에 있어야 한다.
      # 별칭은 프로젝트명에 종속되지 않는 고정 이름 — 컨테이너명(hajacheck-home-frontend-1)은
      # `-p` 로 주는 프로젝트명이 바뀌면 함께 바뀌므로 터널 인그레스의 대상으로 삼기에 불안정하다.
      shared-net:
        aliases:
          - hajacheck-frontend
    # 메모리 상한(luma200ok/home-infra#9) — 실측 5MiB. 정적 자산 서빙
    # OOM killer 는 원인 제공자가 아니라 점수가 가장 높은 프로세스를 죽이므로,
    # 상한이 없으면 이 컨테이너의 폭주가 무관한 서비스를 죽인다.
    deploy:
      resources:
        limits:
          memory: 256M
