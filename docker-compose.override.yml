# HajaCheck 로컬 개발 오버라이드 — `docker compose up`(파일 미지정 시) 시 base와 자동 병합.
# 소스 bind mount + 핫리로드: backend devtools(gradle bootRun --continuous) /
# ai-server uvicorn --reload / frontend는 vite dev 서버(frontend-dev) 추가.
#
# nginx(80)는 이 오버라이드에서 dist 대신 frontend-dev를 프록시한다(#311) — 진입점을 80 하나로 통일.
#   개발(거울): docker compose up -d            → localhost = vite HMR, 저장 즉시 반영
#   검증(사진): COMPOSE_FILE=docker-compose.yml docker compose up -d --build nginx
#                                               → localhost = 구운 dist(운영과 동일 조건)
#   ⚠️ .env에 COMPOSE_FILE을 고정해뒀다면(#303) 사진 모드에선 위처럼 그 값을 덮어써야 한다.
# 전에는 nginx=dist / frontend-dev=:5173 두 진입점이 공존해, 소셜 로그인 착지 고정값이 어느 쪽을
# 가리키든 반대쪽 진입자가 다른 앱으로 튕겼다(#302 로그인 무한 루프의 구조적 원인).

services:
  spring:
    build:
      target: build # JDK 빌드 스테이지 재사용(gradlew bootRun에 필요, jre 런타임 스테이지 아님)
    # 백엔드 핫리로드(#1058) — **두 프로세스**로 나눠야 동작한다.
    #
    #   ① `classes --continuous`(백그라운드) : 소스 변경을 감지해 build/classes 를 재컴파일
    #   ② `bootRun`(포그라운드)              : 앱 실행. devtools 가 build/classes 변경을 보고 재기동
    #
    # ⚠️ 옛 `bootRun --continuous` 는 **동작하지 않는다**(실측: 파일을 고쳐도 로그 0줄). continuous
    # build 는 "빌드가 끝난 뒤" 입력을 재평가하는데 `bootRun` 은 앱이 떠 있는 동안 끝나지 않아
    # 재평가 지점에 영영 도달하지 못한다. 같은 `--continuous` 라도 `classes` 처럼 종료되는 태스크에
    # 붙이면 정상 감지된다("Change detected, executing build..." 실측 확인).
    #
    # ⚠️ `--no-daemon` 도 붙이지 말 것 — continuous build 는 데몬을 전제로 하고, 붙이면 single-use
    # 데몬이 빌드 종료와 함께 죽는다("Daemon will be stopped at the end of the build"). 게다가 여기선
    # 두 gradle 프로세스가 데몬을 공유해야 한다. backend/Dockerfile 의 빌드 스테이지에서는 일회성
    # 빌드라 --no-daemon 이 정석인데, 그 패턴이 이 개발용 command 로 복붙된 것이 원인이었다
    # (도입 c5b1f2e4 / PR #101 — 커밋 메시지에 그 플래그에 대한 언급 없음).
    #
    # 정상 동작 확인: 소스 저장 → ①에서 "Change detected, executing build..." → ② devtools 재기동.
    command: ["sh", "-c", "./gradlew classes --continuous & ./gradlew bootRun"]
    volumes:
      - ./backend:/workspace
      - ./docs:/docs:ro # build.gradle의 verifyHa25SchemaInputs가 ../docs/design/db/*.sql을 참조 — ./gradlew test에 필요
      - gradle-cache:/root/.gradle
    environment:
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
    ports:
      - "8080:8080" # 로컬 직접 접근/디버깅 편의(base는 내부 전용 — 미publish)
    # gradlew bootRun은 기본 curl 헬스체크 응답까지 오래 걸릴 수 있어 여유 부여
    healthcheck:
      start_period: 120s

  fastapi:
    volumes:
      - ./ai-server:/app # pytest tests/ 미마운트 상태였음 — 컨테이너 안에서 테스트 실행하려면 필요
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      # main.py가 fail-closed(명시적 dev/local만 /docs 노출)로 바뀌어 로컬 개발에서 켜려면 명시 필요
      APP_ENV: dev
    ports:
      - "8000:8000" # 로컬 직접 접근/디버깅 편의(base는 내부 전용 — 미publish)

  # nginx가 dist 대신 vite dev 서버를 서빙하도록 conf 교체(#311) — 이미지 재빌드 없이 bind mount로.
  # base(운영)가 쓰는 default.conf는 이미지 안에 그대로 있고, 이 오버라이드를 뺀 순간 되살아난다.
  nginx:
    volumes:
      - ./frontend/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      # frontend-dev가 뜨기 전에 nginx가 프록시하면 502 — healthy까지 대기.
      # base의 spring/fastapi depends_on은 병합되어 유지된다(오버라이드는 키 단위 교체가 아님).
      frontend-dev:
        condition: service_healthy

  # Vite dev 서버(핫리로드) — 평소엔 nginx(80)가 프록시하므로 직접 접속할 일이 없다.
  # :5173 publish는 네이티브 vite(npm run dev) 흐름·기존 문서 호환을 위해 유지(#311).
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build # node 빌드 스테이지 재사용(vite dev 서버 실행)
    command: ["npm", "run", "dev"]
    environment:
      # VITE_PROXY_FASTAPI 제거 — 프론트가 /api/ai/*(스프링 경유)로만 호출(#234), FastAPI 직결 폐쇄(#235)
      VITE_PROXY_SPRING: http://spring:8080
      # VITE_* 공개 키는 루트 .env 에서 주입(#357) — 도커 흐름은 .env 단일 소스.
      # 네이티브 npm run dev 는 frontend/.env.local 을 직접 읽지만, 도커는 이 파일이
      # 컨테이너에 없으므로(볼륨 미마운트) 여기서 명시하지 않으면 undefined 가 된다.
      # Vite dev 서버는 environment 를 런타임에 읽으므로 값 변경 시 재빌드 없이 재생성만 하면 된다.
      VITE_KAKAO_MAP_APP_KEY: ${VITE_KAKAO_MAP_APP_KEY:-}
      # 토스 결제창 SDK 클라이언트 키(#988) — dev 서버는 environment 를 런타임에 읽는다.
      VITE_TOSS_CLIENT_KEY: ${VITE_TOSS_CLIENT_KEY:-}
      VITE_APP_TITLE: ${VITE_APP_TITLE:-hajaCheck}
      # Docker Desktop(Windows) 바인드 마운트는 네이티브 fs 이벤트가 컨테이너로 전파되지 않아
      # 기본 chokidar 감시로 HMR이 소스 변경을 못 잡는다(수정해도 이전 코드가 계속 서빙됨) —
      # vite.config.ts의 server.watch.usePolling이 이 값을 읽어 폴링으로 강제 감지한다.
      VITE_WATCH_POLL: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    healthcheck:
      # 127.0.0.1 명시(IPv6 localhost 폴백 실패 회피 — frontend/Dockerfile 헬스체크와 동일 이유)
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173/"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [hajacheck-net]

volumes:
  gradle-cache:
